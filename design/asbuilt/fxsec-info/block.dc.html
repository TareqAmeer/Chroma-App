<div class="tp-panel active" data-panel="info">

        <div class="fx-ctrl-title"><span class="fx-ctrl-chev" role="button" tabindex="0" aria-label="Show or hide Preview Info &amp; Metadata" aria-expanded="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.714" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>Preview Info &amp; Metadata<span class="fx-title-right"><button type="button" class="fx-ctrl-title-reset" title="Reset this section"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.714" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 12a9 9 0 1 1 3 6.7M3 21v-6h6"></path></svg><span class="fx-ctrl-title-reset-lb">Reset</span></button></span></div>
        <!-- Info is split into Metadata (open) / Keywords / Tags (auto tags + People & Pets).
        <!-- People & Pets (people-pets wireframes screen I) — deliberately lives HERE, not as
             its own rail section: it's a fact about the photo, not a grading control, same
             reasoning as EXIF sitting right below it. `fx-people` is populated by
             fxRenderPeoplePanel(), called from showExif()'s one choke point. -->
        <details class="sk2-more fx-info-part" open=""><summary>Metadata</summary>
        <div id="fx-exif"></div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--mut);line-height:1.6;margin-top:8px" id="fx-info">Preview 512×384</div>
        </details>
        <details class="sk2-more fx-info-part"><summary>Keywords</summary>
        <!-- Keywords: same per-photo sidecar tags the Library's own Get Info popover edits
             (get_sidecar/set_keywords, desktop/library-ui.js) — this Info TAB had no way to see
             or edit them at all while a photo was open in the Editor. fxRenderKeywordsPanel()
             populates this, called from the same showExif() choke point as People & Pets. -->
        <div id="fx-keywords"></div>
        </details>
        <details class="sk2-more fx-info-part"><summary>Tags</summary>
        <div id="fx-autotags"></div>
        <div id="fx-people"></div>
        </details>
      
</div>
