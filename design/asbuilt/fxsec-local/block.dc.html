<div class="tp-panel active" data-panel="local">

        <div class="fx-ctrl-title"><span class="fx-ctrl-chev"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>Masks <span class="fx-title-right"><button type="button" class="fx-ctrl-title-reset" title="Reset this section"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 1 3 6.7"></path><path d="M3 21v-6h6"></path></svg><span class="fx-ctrl-title-reset-lb">Reset</span></button><div class="fx-toggle on" id="tg-local" data-a11y="1" role="switch" aria-checked="true" tabindex="0" aria-label="Masks"></div></span></div>
        <div class="fx-fields" id="ff-local">
          <!-- Was 8 peer buttons in one row ("+ Radial + Linear + Brush + Sky + Skin + Color
               Range + Luminance Range + AI Select") — reads as a list, not a control, and the
               row wrapped to 3 lines once Skin/AI Select showed on desktop. One trigger, one
               grouped menu (mskAddMenu), built on the exact same .msk-more-menu/.msk-more-it
               popover the mask row's own "⋯" menu already uses — no new component, no new CSS
               beyond the group-header label. The #btn-msk-add-skin/#btn-msk-add-ai elements this
               replaced are gone, along with the `body.deskx …!important` CSS rule that only
               existed to show them — mskAddMenu checks `body.deskx` itself to decide whether the
               Skin/AI Select ENTRIES belong in the menu, the same condition that rule used, so
               they still appear in exactly the same contexts (including ?deskx=1 for testing). -->
          <div class="btn-row">
            <button class="btn bgh">+ Mask</button>
          </div>
          <div class="fx-row"><div class="fx-label">Show on photo</div>
            <div class="seg lib-seg msk-prevmode-seg"><button data-v="overlay" class="on">Overlay</button><button data-v="isolate">Isolate</button><button data-v="select" title="Shows the EFFECTIVE selection in red — shape combined with the luminance and colour-range gates. The Overlay/Isolate modes draw the shape only.">Selection</button><button data-v="off">Off</button></div>
          </div>
          <!-- Overlay/Isolate are drawn in JS from the mask SHAPE only; Selection is rendered by
               the shader and is the effective weight. For a gated mask those differ a lot, and
               without saying so the three modes look like three contradictory answers. -->
          <div id="msk-prevmode-hint" style="font-size:var(--fs-1);color:var(--mut);font-family:var(--sans);margin:2px 0 6px"></div>
          <div class="fx-row" id="msk-selview-opacity-row" style="display:none">
            <div class="fx-label">Overlay opacity</div>
            <input class="fx-slider" type="range" min="10" max="100" step="1" value="75" id="sl-msk-selview-opacity" aria-label="Overlay opacity" style="--fillA: 0%; --fillB: 72.22222222222221%;">
            <div class="fx-val" id="vl-msk-selview-opacity" contenteditable="true" spellcheck="false" inputmode="text" title="Tap to type a value" style="">75</div>
          </div>
          <div class="fx-row" id="msk-selview-outline-row" style="display:none">
            <div class="fx-label">Edge only</div>
            <input type="checkbox" id="ck-msk-selview-outline" style="">
          </div>
          <div class="btn-row" id="local-list" style="flex-wrap:wrap;gap:4px"></div>
          <div id="local-ctl" style="display:flex;flex-direction:column;gap:6px"><div style="font-size:var(--fs-1);color:var(--mut);font-family:var(--sans);margin-top:6px">Add a mask to begin — Radial for faces/subjects, Linear or Sky for skies, Brush to paint any area (e.g. lifting shadow under an eye).</div></div>
        </div>
      
</div>
