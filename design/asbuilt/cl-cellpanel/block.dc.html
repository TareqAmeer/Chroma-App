<div class="tp-panel active" data-panel="cl-cellpanel">

        <div class="ctitle" style="margin-bottom:10px">Selected photo</div>
        <div class="fx-row"><div class="fx-label">Zoom</div><input class="fx-slider" type="range" min="100" max="400" value="100" id="cl-zoom" aria-label="Zoom" style="--fillA: 0%; --fillB: 0%;"><div class="fx-val" id="cl-zoom-v">100</div></div>
        <div class="fx-hint">Drag inside the photo to reposition it. Scroll over a photo to zoom.</div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn bsec">Replace</button>
          <button class="btn bgh">Reset</button>
          <button class="btn bgh">Clear slot</button>
        </div>
      
</div>
