<div class="tp-panel active" data-panel="fx-deskbar">

    <!-- 2026-09-10 (3.1.9/3.1.10): #fx-deskbar-left/-right exist so body.deskx can lay the bar
         out as a real 3-column grid (1fr auto 1fr — Editor (Developer) View.dc.html's own
         .topbar) instead of one flex row with the title absolutely centred on top of it. The
         centred title only ever LOOKED right by coincidence, whenever the two side clusters
         happened to weigh about the same — shrinking the left cluster and moving Export/All FX
         (this file's own history: 045993e removed 6 always-visible buttons, 6627253 removed 4
         more) made the actual overlap LESS likely, but never addressed the root cause, and
         editor_responsive_qa.mjs's OVERLAP check still failed it at plain 1440×900 with nothing
         narrow or unusual about the window. Grid columns can't overlap by construction, so this
         fixes the class of bug, not just today's specific collision. -->
    <div id="fx-deskbar-left">
      <button class="fx-db fx-db-icon" id="db-lib-btn" style="display:none" title="Photo gallery (L)"><span class="fx-db-ic" id="db-lib-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 5h7l2 3h9v12H3Z"></path></svg></span></button>
      <!-- 3.1.1: undo/redo used to be two bare .fx-db buttons, reading as unaligned with the rest
           of the bar's filled-tile buttons — wrapped in a bordered pill matching the wireframe's
           own .undogrp (Editor (Developer) View.dc.html:41-43): one outer border, square inner
           corners, a hairline divider between the two. -->
      <div class="fx-undogrp">
        <button class="fx-db fx-db-icon" id="btn-undo-db" title="Undo (⌘Z) · hold for edit history · shift-click to reset"><span class="fx-db-ic" id="db-undo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h12v10h-4"></path></svg></span></button>
        <button class="fx-db fx-db-icon" id="btn-redo-db" title="Redo (⌘Y)" disabled=""><span class="fx-db-ic" id="db-redo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H8v10h4"></path></svg></span></button>
      </div>
      <div style="position:relative;display:inline-flex" id="db-history-wrap">
        <button class="fx-db fx-db-icon" id="btn-export-history" title="Edit &amp; export history for this photo" style=""><span class="fx-db-ic" id="db-history"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l4 4"></path></svg></span></button>
      </div>
    <button class="db-btn" id="btn-before" title="Press and hold to see the original"><span class="fx-db-ic" id="ic-before"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M2 12l10-7 10 7-10 7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></button><button id="btn-fx-fullres" class="zc-ic db-btn" title="Full resolution — renders the whole preview at full source resolution instead of the usual capped size. Costs more GPU time; drops to the capped size automatically while dragging a slider"><span class="fx-db-ic" id="ic-fullres"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="4" width="18" height="13"></rect><path d="M8 21h8M12 17v4M14 7h4v4M18 7l-5 5"></path></svg></span></button></div>
    <!-- "Reset all edits" moved into the ⋯ overflow menu (ovfBuild()) — the one genuinely rare,
         semi-destructive action in the always-visible cluster; Undo/Redo already cover the
         common "I changed my mind" case. -->
    <div id="fx-deskbar-title"><span id="db-title-name">portrait</span><span id="db-title-status" role="status" aria-live="polite" aria-atomic="true" class="">512 × 384 · PNG</span><div class="fx-zoom-ctrl" id="fx-zoom-ctrl" style="display: flex;">
          <button class="zc-ic" id="btn-zoom-out" title="Zoom out"><span class="fx-db-ic" id="ic-zoom-out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12h14"></path></svg></span></button>
          <input type="range" class="fx-slider" id="fx-zoom-slider" min="25" max="800" value="100" step="1" title="Drag to zoom · double-click to fit the whole image" style="--fillA: 9.67741935483871%; --fillB: 9.67741935483871%; --sl-def-pct: 9.67741935483871%; --sl-roll: 0deg;">
          <button class="zc-ic" id="btn-zoom-in" title="Zoom in"><span class="fx-db-ic" id="ic-zoom-in"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></button>
          <span id="fx-zoom-pct" title="Scroll to zoom · drag to pan · double-click to fit">100%</span>
          <button id="btn-loupe" title="True 1:1 view — renders a native-resolution crop through the full pipeline so grain &amp; halation appear at real export scale">1:1</button>
          <!-- 2026-09-10: "zc-ic" alone has no background/border/color of its own — relies
               entirely on the parent ".fx-zoom-ctrl button" rule for its actual look, which
               isn't there once relocatePreviewTools() parks this in the left cluster under
               deskx. Added "db-btn" alongside it for that reset (matches its new neighbour, Show
               original); zc-ic's own 28px sizing still wins by source order so web/mobile mode
               (where it stays inside .fx-zoom-ctrl, sized like its zoom-cluster siblings) is
               visually unchanged. -->
          
          <button id="btn-flag-red" class="flag-btn flag-btn-red" title="Reject (Gallery)" style="margin-left: 4px;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
          <button id="btn-flag-green" class="flag-btn flag-btn-green" title="Green flag (Gallery)" style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 21V3M5 4h13l-4 4.5 4 4.5H5"></path></svg></button>
          <button id="btn-favorite" class="flag-btn flag-btn-fav" title="Favorite (Gallery)" style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 21 3 12a4.5 4.5 0 0 1 9-4.5 4.5 4.5 0 0 1 9 4.5Z"></path></svg></button>
        </div></div>
    <div id="fx-deskbar-right">
      <div id="fx-deskbar-tools"><div class="btn-row fx-mini-row" id="fx-preview-tools" style="justify-content: center; margin-top: 8px; display: flex;">
          <button class="db-btn" id="btn-editor-bg" title="Studio background colour (also right-click the empty area around the photo)" style="padding:0;min-width:28px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center"><span style="display:block;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#000 50%,#fff 50%);border:1px solid var(--bdr)"></span></button>
          
          <button class="db-btn" id="btn-split" title="Split before/after view"><span class="fx-db-ic" id="ic-split"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="4" width="18" height="16"></rect><path d="M12 4v16M8 10l-2 2 2 2M16 10l2 2-2 2"></path></svg></span></button>
          <div style="position:relative;display:inline-flex">
            <button class="db-btn db-btn-narrow" id="btn-split-menu" title="Choose what the split's before-side compares against"><span class="fx-db-ic" id="ic-splitmenu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button>
            <div id="fx-split-popover" style="display:none;position:absolute;top:100%;left:0;margin-top:6px;min-width:210px;max-height:320px;overflow-y:auto;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:4px;z-index:var(--z-dropdown);box-shadow:none"></div>
          </div>
          <div style="position:relative;display:inline-flex">
            <button class="db-btn" id="btn-history" title="Edit history timeline"><span class="fx-db-ic" id="ic-timeline"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l4 4"></path></svg></span></button>
            <div id="fx-timeline-popover" style="display:none;position:absolute;top:100%;right:0;margin-top:6px;width:260px;max-height:360px;overflow-y:auto;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:8px;z-index:var(--z-dropdown);box-shadow:none"></div>
          </div>
          <button class="db-btn" id="btn-hist" title="Toggle scope overlay"><span class="fx-db-ic" id="ic-scope"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 20h18M5 20V9M10 20V4M15 20v-8M20 20V7"></path></svg></span></button>
          <!-- Gamut warning's own toggle button lived here (3.1.6: "gamut button should be
               removed but can be enabled from the View menu bar") — removed; toggleGamutWarn()
               is now reached from the View menu only (viewMenuBuild()) and safely no-ops the
               button-highlight step when #btn-gamut-warn doesn't exist. -->
          <select id="sel-scope-mode" title="Scope type" style="display:none;font-size:10px">
            <option value="hist">Histogram</option><option value="wave">Waveform</option>
            <option value="parade">RGB Parade</option><option value="vector">Vectorscope</option>
          </select>
        </div></div>
      <button class="fx-db js-allfx" title="All FX: one click adds film grain, glow and borders. Use the ▾ to choose which effects and how strong."><span class="fx-db-ic" id="db-allfx"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 4l1.5 4.5L15 10l-4.5 1.5L9 16l-1.5-4.5L3 10l4.5-1.5ZM18 14v6M15 17h6"></path></svg></span><span class="fx-db-lb">All FX</span></button><button class="fx-db js-allfx-cfg" title="Choose what All FX applies — effects, strengths and look" aria-label="All FX settings">▾</button>
      <!-- Shown only for a Lightroom "Edit In" handoff session (library-ui.js sets
           window.chromasmithEditInPath and un-hides this) — writes the render straight back over
           the file Lightroom handed us instead of the normal share-sheet save. -->
      <button class="fx-db fx-db-pri" id="db-save-lr" style="display:none" title="Save back to the file Lightroom handed off — Lightroom will re-import and sync it"><span class="fx-db-ic" id="db-export-lr"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9h10M3 9v12h12V11M9 15 21 3M14 3h7v7"></path></svg></span>Save to Lightroom</button>
      <button class="fx-db fx-db-pri" id="btn-export-db" title="Export…"><span class="fx-db-ic" id="db-export"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9h10M3 9v12h12V11M9 15 21 3M14 3h7v7"></path></svg></span><span class="fx-db-lb">Export</span></button>
      <!-- 2026-09-09: Tools + View + ⋯ merged into ONE settings menu, docked last (far right) —
           matches the Library top bar's own …zoom → flags → All FX → Export → gear order. Each
           inner div below is still built/owned by its original function (toolsBuild/viewMenuBuild/
           ovfBuild) — only the trigger button and outer dropdown are new; see settingsBuild(). -->
      <div id="fx-settings">
        <button class="fx-db fx-db-icon" title="Settings" aria-label="Settings — transform, edit settings, view, appearance"><span class="fx-db-ic" id="db-settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 3h6l6 6v6l-6 6H9l-6-6V9Z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></button>
        <!-- 2026-09-10: two-column drill-down (the approved design) — #fx-settings-cats lists
             the categories, #fx-settings-page holds all five content panes stacked but only the
             ACTIVE one visible (settingsShowCat()). Each pane is still filled by its own
             pre-existing function exactly as before (toolsBuild/viewMenuBuild/ovfBuild/
             settingsSplitBuild/settingsHistoryBuild) — split-view and edit history still render
             the same "submenu, not a floating popover" content described below, just inside a
             selected pane instead of concatenated into one long scroll. -->
        
      </div>
    </div>
  <div id="fx-page-title"><button type="button" class="fx-page-back" title="Back to the Studio">← Studio</button><span></span></div>
