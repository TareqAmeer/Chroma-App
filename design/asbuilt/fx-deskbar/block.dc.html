<div class="tp-panel active" data-panel="fx-deskbar">

    <!-- 2026-09-10 (3.1.9/3.1.10): #fx-deskbar-left/-right exist so body.deskx can lay the bar
         out as a real 3-column grid (1fr auto 1fr — Editor (Developer) View.dc.html's own
         .topbar) instead of one flex row with the title absolutely centred on top of it. The
         centred title only ever LOOKED right by coincidence, whenever the two side clusters
         happened to weigh about the same — shrinking the left cluster and moving Export/All FX
         (this file's own history: 045993e removed 6 always-visible buttons, 6627253 removed 4
         more) made the actual overlap LESS likely, but never addressed the root cause, and
         editor_responsive_qa.mjs's OVERLAP check still failed it at plain 1440×900 with nothing
         narrow or unusual about the window. Grid columns can't overlap by construction, so this
         fixes the class of bug, not just today's specific collision. -->
    <div id="fx-deskbar-left">
      <button class="fx-db fx-db-icon" id="db-lib-btn" style="display:none" title="Photo library (L)"><span class="fx-db-ic" id="db-lib-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.6.8l.9 1.2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span></button>
      <!-- 3.1.1: undo/redo used to be two bare .fx-db buttons, reading as unaligned with the rest
           of the bar's filled-tile buttons — wrapped in a bordered pill matching the wireframe's
           own .undogrp (Editor (Developer) View.dc.html:41-43): one outer border, square inner
           corners, a hairline divider between the two. -->
      <div class="fx-undogrp">
        <button class="fx-db fx-db-icon" id="btn-undo-db" title="Undo (⌘Z) · hold for edit history · shift-click to reset" disabled=""><span class="fx-db-ic" id="db-undo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg></span></button>
        <button class="fx-db fx-db-icon" id="btn-redo-db" title="Redo (⌘Y)" disabled=""><span class="fx-db-ic" id="db-redo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg></span></button>
      </div>
      <div style="position:relative;display:inline-flex" id="db-history-wrap">
        <button class="fx-db fx-db-icon" id="btn-export-history" title="Edit &amp; export history for this photo" style=""><span class="fx-db-ic" id="db-history"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></span></button>
      </div>
    <button class="db-btn" id="btn-before" title="Press and hold to see the original" disabled=""><span class="fx-db-ic" id="ic-before"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></button><button id="btn-fx-fullres" class="zc-ic db-btn" title="Full resolution — renders the whole preview at full source resolution instead of the usual capped size. Costs more GPU time; drops to the capped size automatically while dragging a slider"><span class="fx-db-ic" id="ic-fullres"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="1"></rect><path d="M8 21h8M12 18v3"></path></svg></span></button></div>
    <!-- "Reset all edits" moved into the ⋯ overflow menu (ovfBuild()) — the one genuinely rare,
         semi-destructive action in the always-visible cluster; Undo/Redo already cover the
         common "I changed my mind" case. -->
    <div id="fx-deskbar-title"><span id="db-title-name">portrait</span><span id="db-title-status">512 × 384 · PNG</span></div>
    <div id="fx-deskbar-right">
      <div id="fx-deskbar-tools"><div class="btn-row fx-mini-row" id="fx-preview-tools" style="justify-content: center; margin-top: 8px; display: flex;">
          <button class="db-btn" id="btn-editor-bg" title="Editor background colour (also right-click the empty area around the photo)" style="padding:0;min-width:28px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center"><span style="display:block;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#000 50%,#fff 50%);border:1px solid var(--bdr)"></span></button>
          
          <button class="db-btn" id="btn-split" title="Split before/after view"><span class="fx-db-ic" id="ic-split"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16"></path><path d="M8 10l-2 2 2 2M16 10l2 2-2 2"></path></svg></span></button>
          <div style="position:relative;display:inline-flex">
            <button class="db-btn db-btn-narrow" id="btn-split-menu" title="Choose what the split's before-side compares against"><span class="fx-db-ic" id="ic-splitmenu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></button>
            <div id="fx-split-popover" style="display:none;position:absolute;top:100%;left:0;margin-top:6px;min-width:210px;max-height:320px;overflow-y:auto;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:4px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.35)"></div>
          </div>
          <div style="position:relative;display:inline-flex">
            <button class="db-btn" id="btn-history" title="Edit history timeline"><span class="fx-db-ic" id="ic-timeline"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></span></button>
            <div id="fx-timeline-popover" style="display:none;position:absolute;top:100%;right:0;margin-top:6px;width:260px;max-height:360px;overflow-y:auto;background:var(--sur2);border:1px solid var(--bdr);border-radius:8px;padding:8px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.35)"></div>
          </div>
          <button class="db-btn" id="btn-hist" title="Toggle scope overlay"><span class="fx-db-ic" id="ic-scope"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20V9M8 20V4M13 20v-8M18 20V7"></path></svg></span></button>
          <!-- Gamut warning's own toggle button lived here (3.1.6: "gamut button should be
               removed but can be enabled from the View menu bar") — removed; toggleGamutWarn()
               is now reached from the View menu only (viewMenuBuild()) and safely no-ops the
               button-highlight step when #btn-gamut-warn doesn't exist. -->
          <select id="sel-scope-mode" title="Scope type" style="display:none;font-size:10px">
            <option value="hist">Histogram</option><option value="wave">Waveform</option>
            <option value="parade">RGB Parade</option><option value="vector">Vectorscope</option>
          </select>
        </div><div class="fx-zoom-ctrl" id="fx-zoom-ctrl" style="display: flex;">
          <button class="zc-ic" id="btn-zoom-out" title="Zoom out"><span class="fx-db-ic" id="ic-zoom-out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg></span></button>
          <input type="range" id="fx-zoom-slider" min="25" max="800" value="100" step="1" title="Drag to zoom · double-click to fit the whole image" style="">
          <button class="zc-ic" id="btn-zoom-in" title="Zoom in"><span class="fx-db-ic" id="ic-zoom-in"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span></button>
          <span id="fx-zoom-pct" title="Scroll to zoom · drag to pan · double-click to fit">100%</span>
          <button id="btn-loupe" title="True 1:1 view — renders a native-resolution crop through the full pipeline so grain &amp; halation appear at real export scale">1:1</button>
          <!-- 2026-09-10: "zc-ic" alone has no background/border/color of its own — relies
               entirely on the parent ".fx-zoom-ctrl button" rule for its actual look, which
               isn't there once relocatePreviewTools() parks this in the left cluster under
               deskx. Added "db-btn" alongside it for that reset (matches its new neighbour, Show
               original); zc-ic's own 28px sizing still wins by source order so web/mobile mode
               (where it stays inside .fx-zoom-ctrl, sized like its zoom-cluster siblings) is
               visually unchanged. -->
          
          <button id="btn-flag-red" class="flag-btn flag-btn-red" title="Reject (Library)" style="margin-left: 4px;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" fill="none"></path></svg></button>
          <button id="btn-flag-green" class="flag-btn flag-btn-green" title="Green flag (Library)" style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4" fill="none"></path><path d="M5 4h13l-3.2 4.5L18 13H5z" fill="currentColor" stroke="none"></path></svg></button>
          <button id="btn-favorite" class="flag-btn flag-btn-fav" title="Favorite (Library)" style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-10-9.1C.6 8.1 2 4.8 5.2 4c2-.5 4 .3 5.3 2 1.3-1.7 3.3-2.5 5.3-2 3.2.8 4.6 4.1 3.2 7.4-2.5 4.5-10 9.1-10 9.1z" fill="currentColor" stroke="none"></path></svg></button>
        </div></div>
      <button class="fx-db js-allfx" title="Toggle grain, halation, bloom &amp; borders all at once"><span class="fx-db-ic" id="db-allfx"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v3M3.5 4.5h3"></path><path d="M18 14v3M16.5 15.5h3"></path><path d="M13 4l2 5.5 5.5 2-5.5 2L13 19l-2-5.5L5.5 11.5 11 9.5z"></path></svg></span><span class="fx-db-lb">All FX</span></button>
      <!-- Shown only for a Lightroom "Edit In" handoff session (library-ui.js sets
           window.chromasmithEditInPath and un-hides this) — writes the render straight back over
           the file Lightroom handed us instead of the normal share-sheet save. -->
      <button class="fx-db fx-db-pri" id="db-save-lr" style="display:none" title="Save back to the file Lightroom handed off — Lightroom will re-import and sync it"><span class="fx-db-ic" id="db-export-lr"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4"></path><path d="M5 21h14"></path></svg></span>Save to Lightroom</button>
      <button class="fx-db fx-db-pri" id="btn-export-db" title="Export at full resolution"><span class="fx-db-ic" id="db-export"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4"></path><path d="M5 21h14"></path></svg></span><span class="fx-db-lb">Export</span></button>
      <!-- 2026-09-09: Tools + View + ⋯ merged into ONE settings menu, docked last (far right) —
           matches the Library top bar's own …zoom → flags → All FX → Export → gear order. Each
           inner div below is still built/owned by its original function (toolsBuild/viewMenuBuild/
           ovfBuild) — only the trigger button and outer dropdown are new; see settingsBuild(). -->
      <div id="fx-settings">
        <button class="fx-db fx-db-icon" title="Settings — transform, edit settings, view, appearance"><span class="fx-db-ic" id="db-settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span></button>
        <!-- 2026-09-10: two-column drill-down (the approved design) — #fx-settings-cats lists
             the categories, #fx-settings-page holds all five content panes stacked but only the
             ACTIVE one visible (settingsShowCat()). Each pane is still filled by its own
             pre-existing function exactly as before (toolsBuild/viewMenuBuild/ovfBuild/
             settingsSplitBuild/settingsHistoryBuild) — split-view and edit history still render
             the same "submenu, not a floating popover" content described below, just inside a
             selected pane instead of concatenated into one long scroll. -->
        <div id="fx-settings-menu">
          <div id="fx-settings-cats"></div>
          <div id="fx-settings-page">
            <div id="fx-tools-menu" class="fx-settings-pane"></div>
            <div id="fx-view-menu" class="fx-settings-pane"></div>
            <!-- Split-view and edit history used to be a topbar icon each, opening a floating
                 popover anchored to that specific button (#fx-split-popover/#fx-timeline-popover,
                 still there for web/mobile mode — see the body.deskx hide rules near
                 .fx-zoom-ctrl). On desktop they render inline here instead — no separate floating
                 layer or viewport-clamping to get right, since this pane already scrolls. -->
            <div id="fx-settings-split-list" class="fx-settings-pane"></div>
            <div id="fx-settings-history-list" class="fx-settings-pane"></div>
            <div id="fx-overflow-menu" class="fx-settings-pane"></div>
          </div>
        </div>
      </div>
    </div>
  
</div>
