<div class="tp-panel active" data-panel="nr">

        <div class="fx-ctrl-title"><span class="fx-ctrl-chev"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>Noise Reduction<span class="fx-title-right"><button type="button" class="fx-ctrl-title-reset" title="Reset this section"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 1 3 6.7"></path><path d="M3 21v-6h6"></path></svg><span class="fx-ctrl-title-reset-lb">Reset</span></button></span></div>
        <div class="fx-row">
          <div class="fx-label">RAW Noise Reduction <button class="fx-info-i" title="Off: untouched decode. Fast (default): the native Rust-side shadow + chroma-wavelet denoise on linear RAW data, before any tone curve — a few seconds, applies automatically. High: additionally runs a neural (RawNIND UtNet2) denoiser, 25–90s at 24MP — never automatic; press &quot;Denoise now&quot; below, or it runs once at export if selected. Requires reopening this photo (or Denoise now) to take effect. Desktop/RAW only.">i</button></div>
          <select id="sel-raw-nr" style="display:none"><option value="off">Off</option><option value="fast" selected="">Fast</option><option value="high">High</option></select>
          <div class="seg" id="seg-raw-nr" style="flex:1"><button class="">Off</button><button class="on">Fast</button><button class="">High</button></div>
        </div>
        <div class="fx-cond-block">
          <div class="fx-row" id="row-nr-high-strength" style="display:none">
            <div class="fx-label">High Strength <button class="fx-info-i" title="Real-photo review (5 ISO 12800 shots vs DxO PureRAW) found full strength can soften fine hair/fur strands more than DxO does, even though flat-area noise removal is comparable or better — lower this if High is smoothing detail you want to keep. Changing it re-arms Denoise now / re-applies at next export.">i</button></div><input class="fx-slider" type="range" min="0" max="100" value="70" id="sl-nr-high-strength" aria-label="High Strength" style="--fillA: 0%; --fillB: 70%;"><div class="fx-val" id="vl-nr-high-strength" contenteditable="true" spellcheck="false" inputmode="text" title="Tap to type a value" style="">70</div>
          </div>
          <div class="fx-row" id="row-nr-high" style="display:none">
            <button class="btn bgh" id="btn-denoise-now" style="flex:1" disabled="" title="High-tier noise reduction only applies to RAW files">Denoise now</button>
            <button class="btn" id="btn-denoise-cancel" style="display:none;margin-left:6px">Cancel</button>
          </div>
          <div id="row-nr-high-progress" style="display:none;margin:2px 0 4px">
            <div style="height:4px;border-radius:2px;background:var(--sur2);overflow:hidden"><div id="nr-high-progress-bar" style="height:100%;width:0%;background:var(--acc);transition:width .15s"></div></div>
          </div>
        </div>
        <div class="fx-row">
          <div class="fx-label">Sparkle-optimized RAW <button class="fx-info-i" title="Uses AHD interpolation, which cleans up dense green/magenta false-color speckle on sunlit water/specular highlights much further than Standard — but it trades away some general chroma-noise headroom elsewhere in the frame, so it's opt-in per photo rather than a global default. Requires reopening this photo to take effect. Desktop only.">i</button></div><div class="fx-toggle" id="tg-demosaic-ahd" data-a11y="1" role="switch" aria-checked="false" tabindex="0" aria-label="Sparkle-optimized RAW"></div>
        </div>
        <div class="fx-row"><div class="fx-label">Luminance</div><input class="fx-slider" type="range" min="0" max="100" value="0" id="sl-nr-lum" aria-label="Luminance" style="--fillA: 0%; --fillB: 0%;"><div class="fx-val" id="vl-nr-lum" contenteditable="true" spellcheck="false" inputmode="text" title="Tap to type a value" style="">0</div></div>
        <div class="fx-row"><div class="fx-label">Color</div><input class="fx-slider" type="range" min="0" max="100" value="0" id="sl-nr-col" aria-label="Color" style="--fillA: 0%; --fillB: 0%;"><div class="fx-val" id="vl-nr-col" contenteditable="true" spellcheck="false" inputmode="text" title="Tap to type a value" style="">0</div></div>
        <div class="fx-row nr-gated gate-off" id="row-nr-det"><div class="fx-label" title="Higher = preserve more fine detail/edges (less smoothing)">Detail</div><input class="fx-slider" type="range" min="0" max="100" value="50" id="sl-nr-det" aria-label="Detail" style="--fillA: 0%; --fillB: 50%;"><div class="fx-val" id="vl-nr-det" contenteditable="true" spellcheck="false" inputmode="text" title="Tap to type a value" style="">50</div></div>
        <div class="fx-row" title="Capture sharpening — RAW photos default to 40 on load/reset (moved here so it survives Reset independently of the general Adjust sliders)."><div class="fx-label">Sharpen</div><input class="fx-slider" type="range" min="0" max="100" value="0" id="sl-adj-sharp" aria-label="Sharpen" style="--fillA: 0%; --fillB: 0%;"><div class="fx-val" id="vl-adj-sharp" contenteditable="true" spellcheck="false" inputmode="text" title="Tap to type a value" style="">0</div></div>
        <div class="fx-row nr-gated gate-off" id="row-nr-hldesat"><div class="fx-label">Highlight Desaturation <button class="fx-info-i" title="Bright specular highlights (sunlit water, glints) sometimes show green/magenta demosaic false-color that no amount of Luminance/Color NR fully removes. Since real highlight color is usually near-neutral anyway, this fades Cb/Cr toward zero from mid-tones (~45%) up through highlights — reaches far enough to cover where the fringing actually sits, so it WILL flatten real color in bright areas too at high amounts. Per-photo only, so it never touches other images.">i</button></div><input class="fx-slider" type="range" min="0" max="100" value="0" id="sl-nr-hldesat" aria-label="Highlight Desaturation" style="--fillA: 0%; --fillB: 0%;"><div class="fx-val" id="vl-nr-hldesat" contenteditable="true" spellcheck="false" inputmode="text" title="Tap to type a value" style="">0</div></div>
        <div style="font-size:var(--fs-1);color:var(--mut);font-family:var(--sans);margin-top:4px" id="nr-gate-hint">Detail &amp; Highlight Desaturation are inactive — raise Luminance or Color to enable noise reduction.</div>
      
</div>
