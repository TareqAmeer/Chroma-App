<div class="tp-panel active" data-panel="match">

  <div class="card" id="setup-card">
    <div class="ctitle">Step 1 — drop images to start</div>
    <div class="dg2">
      <div class="dz" id="dz-before">
        <input type="file" accept="image/*" style="">
        <div class="dz-ic" data-ic="image"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="5" width="18" height="14"></rect><path d="M3 19l7-7 7 7M13 15l3-3 5 5"></path><path d="M16.5 7l1.5 1.5-1.5 1.5-1.5-1.5Z"></path></svg></div><div class="dz-lb">Before / Original</div>
        <div class="dz-sb">Ungraded flat image</div><div class="dz-fn" id="fn-before"></div>
      </div>
      <div class="dz" id="dz-target">
        <input type="file" accept="image/*" style="">
        <div class="dz-ic" data-ic="compare"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18M15 4.5v15M18 6.5v11"></path></svg></div><div class="dz-lb">After / Target</div>
        <div class="dz-sb">Graded Lightroom result</div><div class="dz-fn" id="fn-target"></div>
      </div>
    </div>
    <div class="div-sep">Optional starting point</div>
    <div class="dz opt-dz" id="dz-start">
      <input type="file" accept=".cube,.xmp" style="">
      <div class="dz-ic" data-ic="looks"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 13 13 3M7 17 17 7M11 21 21 11M5 15l2 2"></path></svg></div><div class="dz-lb">Starting LUT (.cube) or Preset (.xmp)</div>
      <div class="dz-sb">Optional — helps bootstrap the look</div><div class="dz-fn" id="fn-start"></div>
    </div>
    <div class="vrow">
      <div class="vlb">Name</div>
      <input class="vinput" id="match-name" value="my_look" placeholder="my_look" style="">
    </div>
    <div class="btn-row">
      <button class="btn bpri" id="btn-start" disabled="">Generate LUT &amp; XMP</button>
    </div>
    <div class="pb" id="pb-s"><div class="pf" id="pf-s"></div></div>
  </div>
  <div id="step-history"></div>

</div>
