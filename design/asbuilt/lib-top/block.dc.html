<div class="tp-panel active" data-panel="lib-top">

      <div class="lib-logo-gap"></div>
      <div id="lib-top-left">
      <div style="position:relative">
        <button class="lib-btn lib-pill" id="lib-sort-btn" title="Sort by"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.846" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M7 15V3M4 6l3-3 3 3"></path><path d="M13 11h7M13 16h4M13 6h9"></path></svg><span class="lbl" id="lib-sort-label">Date taken</span></button>
        <div class="lib-menu" id="lib-sort-menu">
          <div class="grp-label">Sort by</div>
          <select id="lib-sort" style="display:none">
            <option value="name">Name</option>
            <option value="mtime">Date modified</option>
            <option value="date">Date taken</option>
            <option value="iso">ISO</option>
            <option value="shutter">Shutter speed</option>
            <option value="aperture">Aperture</option>
            <option value="focal">Focal length</option>
            <option value="camera">Camera</option>
            <option value="edited">Edit status</option>
            
            <option value="editedts">Date edited</option>
          </select>
          <!-- #13: matches the wireframe's own 3 keys (Library View.html:238-241) exactly —
               Name/Rating/Camera stay reachable via the list-view's own column headers
               (data-sort on .lib-lh-cell), a separate real feature the wireframe's mock has no
               equivalent surface for, so removing them from just this menu keeps the feature
               without keeping the menu's own divergence from the wireframe. "Date added" reuses
               the existing 'mtime' sort key (file mtime) — the closest available proxy; there is
               no distinct added-to-catalog timestamp anywhere in this app. -->
          <div class="opt sel" data-sortval="date"><span>Date taken</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div><div class="opt" data-sortval="mtime"><span>Date added</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div><div class="opt" data-sortval="editedts"><span>Date edited</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
          <hr>
          <!-- Newest first / Oldest first radio pair, replacing the old single "Reverse order"
               toggle — Library View.html:244-245, copied literally. -->
          <div class="opt" data-sortdir="desc"><span>Newest first</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
          <div class="opt sel" data-sortdir="asc"><span>Oldest first</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
        </div>
      </div>
      <div id="lib-filters-btn-wrap">
        <button class="lib-btn lib-pill" id="lib-filters-btn" title="Subfolders, type/camera/lens/ISO/duplicates/sync/rating/tag filters"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 6h16M4 12h16M4 18h16M8 4l2 2-2 2-2-2ZM16 10l2 2-2 2-2-2ZM11 16l2 2-2 2-2-2Z"></path></svg><span class="lbl">Filters</span><span id="lib-filters-badge"></span></button>
      </div>
      <!-- Grid/List only, matching Library View.html's 2-button toggle — Compare moved into the
           gear's View menu (below) per explicit decision: it's a real feature but not common
           enough to earn a permanent topbar slot next to the two everyday view modes. -->
      <div class="lib-seg lib-viewtoggle" id="lib-viewmode-seg" hidden="" style="display:none">
        <button data-v="grid" title="Grid view" class="on"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.714" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></button>
        <button data-v="list" title="List view (unavailable while docked — expand the Gallery first)" disabled=""><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.714" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
      </div>
      </div>
      <div class="lib-spacer"></div>
      <!-- Single search feature, one icon: plain filename/keyword search and AI/CLIP semantic
           search (e.g. "a dog on a beach") both live in this one box — typing filters live
           (plain match), and Enter with non-empty text ALWAYS also runs the AI/CLIP semantic
           search (runClipTextSearch, wired below), not only when the plain match is empty.
           HANDOVER §3.11 — this comment previously claimed the empty-match condition. Per
           explicit decision, there is no separate AI-search button/icon: two search icons read
           as two features when there's really only one. Under deskx this sits centred in
           #lib-top-center, same slot as the Editor's filename/status title. -->
      <div id="lib-top-center">
      <div class="lib-search-wrap">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.714" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
        <input id="lib-search" placeholder="Search places, keywords, anything" autocomplete="off" title="Type a place, keyword or filename; press Enter to also find photos that look like it (e.g. &quot;dog on a beach&quot;)" style="">
        <div id="lib-search-suggest" hidden=""></div>
      </div>
      </div>
      <div id="lib-top-right"><button type="button" id="sk2-act" title="Background work — click for details"><span class="sk2-act-dot" aria-hidden="true"></span><span class="sk2-act-body"><span id="lib-activity"></span><span style="font-size:11px;color:var(--mut)" id="lib-thumb-progress"></span></span></button>
      <!-- 2026-09-11 (topbar parity pass): zoom + flags merged into ONE cluster
           (#lib-zoomflag-cluster), mirroring the Editor's own #fx-zoom-ctrl (chromasmith-22.html)
           which holds its zoom slider AND flag buttons as one group carrying a single divider.
           Previously these were two independent flex children of #lib-top-right, each getting
           the row's own 8px gap on both sides — that read as "zoom  flags" evenly spaced same as
           "flags  All FX", when the Editor treats zoom+flags as one visual unit and only dividers
           its OUTER edges. See body.deskx #lib-overlay #lib-zoomflag-cluster below for the exact
           divider/gap values, copied literally from #fx-deskbar-tools .fx-zoom-ctrl /
           body.deskx .fx-zoom-ctrl. -->
      <div id="lib-zoomflag-cluster">
      <div class="lib-zoomrow">
        <button type="button" class="lib-zoom-btn" id="lib-zoom-out" title="Smaller thumbnails"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.000" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <input type="range" id="lib-thumbsize" min="90" max="320" step="10" title="Thumbnail size" style="">
        <button type="button" class="lib-zoom-btn" id="lib-zoom-in" title="Larger thumbnails"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.000" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <!-- Flag row: applies to the selected Library photos. The Editor's separate toolbar
           continues to rate only the photo being edited via window.chromasmithToggle*().
           Reject icon is 'flagRed' (not the generic 'close' this used to render) — the Editor's
           own reject button (#btn-flag-red, chromasmith-22.html) uses 'flagRed' specifically so
           the two bars show the literal same glyph, not two different X shapes at two different
           stroke weights. -->
      <div class="lib-flagrow" id="lib-flagrow">
        <button class="lib-btn lib-btn-icon flag-btn" id="lib-flag-reject" title="Reject selected photos" disabled=""><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        <button class="lib-btn lib-btn-icon flag-btn" id="lib-flag-pick" title="Pick selected photos" disabled=""><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 21V3M5 4h13l-4 4.5 4 4.5H5"></path></svg></button>
        <button class="lib-btn lib-btn-icon flag-btn" id="lib-flag-fav" title="Favorite selected photos" disabled=""><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.333" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 21 3 12a4.5 4.5 0 0 1 9-4.5 4.5 4.5 0 0 1 9 4.5Z"></path></svg></button>
      </div>
      </div>
      <button class="lib-btn lib-pill" id="lib-allfx-btn" title="Apply your All FX effects to every selected photo (right-click to choose what it applies)" disabled=""><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.714" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 4l1.5 4.5L15 10l-4.5 1.5L9 16l-1.5-4.5L3 10l4.5-1.5ZM18 14v6M15 17h6"></path></svg><span class="lbl">All FX</span></button>
      <button class="lib-btn lib-btn-export" id="lib-export-btn" title="Export selected photos — ⌘E" disabled=""><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.714" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 9h10M3 9v12h12V11M9 15 21 3M14 3h7v7"></path></svg><span class="lbl">Export</span></button>
      <!-- id (not just a bare positioning div) so body.deskx can give it the SAME margin-left/
           padding-left/border-left divider as the Editor's own #fx-settings, instead of just the
           row's flat 8px gap — see the #lib-settings CSS rule below, copied from #fx-settings. -->
      <div style="position:relative" id="lib-settings">
        <button class="lib-btn lib-btn-icon" id="lib-view-menu-btn" title="View settings"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"><path d="M9 3h6l6 6v6l-6 6H9l-6-6V9Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        <!-- CHR-147 fix: reverted to a flat single-list menu. The 2026-09-11 two-column
             category drill-down (matching the Editor's #fx-settings-menu) hid every option
             outside the default "Library" pane behind a tab click with no strong visual cue,
             so toggles like "Hide flag & type icons" and the theme switch appeared unresponsive
             — reported as "settings button doesn't work in library view". Library has far fewer
             settings than the Editor, so the drill-down's scroll-avoidance tradeoff wasn't
             worth the discoverability cost here. -->
        <!-- Same drill-down as the Studio's #fx-settings-menu (categories left, page right),
             sharing its .fx-settings-* classes. The first category opens by default and hovering
             a category switches to it, so nothing is hidden behind an unexplained click (CHR-147). -->
        <!-- One settings menu for gallery and Studio: these panes are moved into the Studio's
             #fx-settings-menu at init (libSettingsAdopt) and shown as its gallery categories. -->
        <div id="lib-view-menu" hidden="">
          
          
          
        </div>
      </div>
      </div>
    
</div>
