          <div class="opt sel" data-sortval="date"><span>Date taken</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div><div class="opt" data-sortval="mtime"><span>Date added</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div><div class="opt" data-sortval="editedts"><span>Date edited</span><svg class="check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>

           search (e.g. "a dog on a beach") both live in this one box — typing filters live
           (plain match), and Enter with non-empty text ALWAYS also runs the AI/CLIP semantic
           search (runClipTextSearch, wired below), not only when the plain match is empty.
           HANDOVER §3.11 — this comment previously claimed the empty-match condition. Per
           explicit decision, there is no separate AI-search button/icon: two search icons read
           as two features when there's really only one. Under deskx this sits centred in
           #lib-top-center, same slot as the Editor's filename/status title. -->
      <div id="lib-top-center">

        <input id="lib-search" placeholder="Search name, keyword, or filter" style="">
      </div>
      </div>
      <div id="lib-top-right">

           (#lib-zoomflag-cluster), mirroring the Editor's own #fx-zoom-ctrl (chromasmith-22.html)
           which holds its zoom slider AND flag buttons as one group carrying a single divider.
           Previously these were two independent flex children of #lib-top-right, each getting
           the row's own 8px gap on both sides — that read as "zoom  flags" evenly spaced same as
           "flags  All FX", when the Editor treats zoom+flags as one visual unit and only dividers
           its OUTER edges. See body.deskx #lib-overlay #lib-zoomflag-cluster below for the exact
           divider/gap values, copied literally from #fx-deskbar-tools .fx-zoom-ctrl /

      </div>
      <!-- Flag row: rates state.openedPath — whichever single photo is open in the Editor —
           same window.chromasmithToggle*() bridge the Editor's own top-bar flag buttons already
           use, so the two stay in sync automatically. HANDOVER §3.11 — this comment previously
           claimed a multi-selection fallback; chromasmithToggleFlag/Favorite (below) read

      </div>
