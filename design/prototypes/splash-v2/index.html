<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splash Concept</title>
<link rel="stylesheet" href="gramatika.css">
<style>
:root{--bg:#141414;--ink:#f2f0ea;--mut:#8d8b85;--acc:#ff3b1f}
*{box-sizing:border-box;margin:0}
body{background:#0b0b0b;color:var(--ink);font-family:Gramatika,system-ui,sans-serif;padding:40px 16px;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px}
.stage{container-type:inline-size;width:min(100%,960px);aspect-ratio:720/560;position:relative;overflow:hidden;background:var(--bg)}
.stage>*{position:absolute}
.num{font-variant-numeric:tabular-nums}
.ph{left:50%;top:9%;width:44%;aspect-ratio:3/2;translate:-50% 0;background:#000;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 40%;filter:grayscale(1) contrast(1.1);display:block}
.cr{right:28%;top:calc(9% + 29.3cqw + 1cqw);font-size:1.3cqw;color:var(--mut);font-style:italic}
.brand{left:0;right:0;top:57%;display:flex;justify-content:center;align-items:center;gap:1.8cqw;font-weight:700;font-size:5.4cqw;letter-spacing:.02em;line-height:1}
.brand svg{width:6.2cqw;height:6.2cqw;flex:none;margin:-.6cqw}
.wedge{left:22%;right:22%;top:71%;height:2.6cqw;display:grid;grid-template-columns:repeat(11,1fr)}
.wedge i{background:#1d1d1d;border-right:1px solid var(--bg);transition:background .35s}
.lb{left:22%;top:76%;font-size:1.8cqw;color:var(--mut)}
.pc{right:22%;top:76%;font-size:1.8cqw}
.ft{left:0;right:0;bottom:4%;text-align:center;font-size:1.5cqw;color:var(--mut)}
button{font:inherit;font-size:13px;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--acc);padding:4px 0;cursor:pointer}
</style></head><body>
<div class="stage">
  <div class="ph"><img alt="" src="dog-sitting.webp"></div>
  <div class="cr">Cover photo by Tareq Ameer</div>
  <div class="brand">
    <svg viewBox="18 18 64 62" aria-hidden="true"><rect x="21" y="21" width="48" height="44" fill="#f2f0ea"/><rect x="36" y="32" width="43" height="45" fill="#ff3b1f"/><clipPath id="p2c"><rect x="36" y="32" width="33" height="33"/></clipPath><g clip-path="url(#p2c)"><defs><radialGradient id="p2a" cx="69" cy="32" r="41.25" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff1e0"/><stop offset=".35" stop-color="#ff6a3a"/><stop offset=".7" stop-color="#b0200e"/><stop offset="1" stop-color="#7a1208"/></radialGradient><radialGradient id="p2b" cx="69" cy="32" r="41.25" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff1e0"/><stop offset=".4" stop-color="#ff7a4c"/><stop offset="1" stop-color="#ff2a10"/></radialGradient></defs><polygon points="36,32 69,32 36,65" fill="url(#p2a)"/><polygon points="69,32 69,65 36,65" fill="url(#p2b)"/><line x1="36" y1="65" x2="69" y2="32" stroke="#fff1e0" stroke-width=".35" opacity=".8"/></g></svg>
    <span>CHRO-MA-SMITH</span>
  </div>
  <div class="wedge"></div>
  <div class="lb">Checking your library</div><div class="pc num">0%</div>
  <div class="ft num">Build 22</div>
</div>
<button id="rp">Replay</button>
<script>
const PH=[[12,'Checking your library'],[18,'Finding folders'],[35,'Reading metadata'],[45,'Reading edits'],[70,'Warming the cache'],[100,'Drawing thumbnails']];
const Z=11,W=document.querySelector('.wedge');W.innerHTML='<i></i>'.repeat(Z);
const shade=i=>{if(i===Z-1)return 'var(--acc)';const v=Math.round(242-(i/(Z-2))*200);return `rgb(${v},${v-2},${v-8})`};
function paint(p){
  document.querySelector('.pc').textContent=Math.round(p)+'%';
  document.querySelector('.lb').textContent=(PH.find(x=>p<=x[0])||PH[5])[1];
  const n=Math.floor(p/100*Z+1e-4);
  W.querySelectorAll('i').forEach((e,i)=>e.style.background=i<n?shade(i):'');
}
let raf;
function run(){cancelAnimationFrame(raf);const t0=performance.now(),D=7000;
  const step=t=>{const k=Math.min(1,(t-t0)/D);paint(100*(1-Math.pow(1-k,1.6)));if(k<1)raf=requestAnimationFrame(step);else setTimeout(run,1800)};
  raf=requestAnimationFrame(step)}
document.getElementById('rp').onclick=run;paint(0);run();
</script>
</body></html>
