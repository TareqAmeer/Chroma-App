<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor Concept</title>
<link rel="stylesheet" href="gramatika.css">
<style>
/* Concept v2 — calmer. One accent, one shape (the square), photo first.
   Library = light gallery, Editor = dark darkroom. Palettes: A vermilion, B orange + blue. */
:root{
  --act:#ff3b1f; --onact:#fff;
  --font:'Gramatika','Helvetica Neue',Helvetica,Arial,sans-serif;
}
/* Palettes: --act = the one action/position colour, --sel = optional second colour (selection only). */
body[data-pal=b]{--act:#ff5a1f}
body[data-pal=klein]{--act:#1f3fff}
body[data-pal=racing]{--act:#0f6b43}
body[data-pal=signal]{--act:#e8ff2a;--onact:#111}
body[data-pal=pink]{--act:#ff4f9a}
body[data-pal=te]{--act:#ff6a00}
body[data-pal=mondrian]{--act:#e3261b}
body[data-pal=violet]{--act:#6b3cff}
body[data-pal=mint]{--act:#1fcf8f;--onact:#111}
body[data-pal=mono]{--act:#111;--onact:#fff}
body[data-pal=mono] .dark{--act:#f2f0ea;--onact:#111}
body[data-pal=b] .dark,body[data-pal=b] .light{--sel:#2b44ff}
body[data-pal=mondrian] .dark,body[data-pal=mondrian] .light{--sel:#1f3dff}
body[data-pal=te] .dark,body[data-pal=te] .light{--sel:#8a8a86}
body[data-pal=pink] .dark,body[data-pal=pink] .light{--sel:#1f3fff}
.dark{--bg:#141414;--sur:#1c1c1c;--line:#292929;--ink:#f2f0ea;--mute:#76746e;--dim:#45443f}
.light{--bg:#f4f2ec;--sur:#ebe8e0;--line:#dcd8ce;--ink:#111;--mute:#77746c;--dim:#bcb8ae}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:12px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-variant-numeric:tabular-nums}
.cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.view{position:fixed;inset:0;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:56px 1fr}
.view[hidden]{display:none}

/* ── shared top bar ── */
header{display:grid;grid-template-columns:200px 1fr auto;align-items:center;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-left:24px}
.mark{width:12px;height:12px;background:var(--act)}
.brand b{font-size:15px;font-weight:500;letter-spacing:-.01em}
.views{display:flex;gap:24px;font-size:13px}
.views button{color:var(--mute);padding:4px 0}
.views button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.right{display:flex;align-items:center;height:100%}
.ib{width:52px;height:100%;color:var(--mute);font-size:15px}
.ib:hover{color:var(--ink)}
.primary{height:100%;padding:0 24px;min-width:128px;background:var(--act);color:var(--onact);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:24px}

/* ═════ LIBRARY ═════ */
.lib{grid-template-columns:200px 1fr;grid-template-rows:56px 1fr}
.lib header{grid-column:1/-1}
.side{padding:32px 24px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.side .cap{margin:24px 0 8px}
.side .cap:first-child{margin-top:0}
.side button{text-align:left;font-size:15px;color:var(--mute);padding:3px 0;display:flex;justify-content:space-between;position:relative}
.side button small{font-size:11px;color:var(--dim)}
.side button:hover,.side button.on{color:var(--ink)}
.side button.on::before{content:"";position:absolute;left:-24px;top:50%;width:10px;height:10px;margin-top:-5px;background:var(--act)}
.gal{overflow:auto;padding:32px 48px 64px 24px}
.ghead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:40px}
.ghead h1{font-size:64px;font-weight:400;letter-spacing:-.045em;line-height:.85}
.ghead .meta{display:flex;gap:32px;align-items:baseline;color:var(--mute);font-size:13px}
.ghead .meta button{color:var(--mute)} .ghead .meta button.on{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:40px 24px}
.card{text-align:left}
.card .t{aspect-ratio:1;display:grid;place-items:center;background:var(--sur);position:relative}
.card .t div{width:78%;height:78%;background:center/contain no-repeat}
.card span{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--mute)}
.card:hover span{color:var(--ink)}
.card.on .t::after{content:"";position:absolute;right:0;bottom:0;width:16px;height:16px;background:var(--sel,var(--act))}
.card.on span{color:var(--ink)}

/* ═════ EDITOR ═════ */
.ed{grid-template-columns:168px 300px 1fr;grid-template-rows:56px 1fr 76px}
.ed header{grid-column:1/-1}
nav{border-right:1px solid var(--line);padding:24px 0}
nav button{display:block;width:100%;text-align:left;padding:6px 24px;font-size:15px;color:var(--mute);position:relative}
nav button:hover,nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;left:0;top:50%;width:10px;height:10px;margin-top:-5px;background:var(--act)}
nav hr{border:0;border-top:1px solid var(--line);margin:12px 24px}
aside{border-right:1px solid var(--line);overflow:auto;padding:28px 24px 48px}
aside h2{font-size:32px;font-weight:400;letter-spacing:-.035em;margin-bottom:28px}
.sec{margin-bottom:28px}
.sec>.cap{display:block;margin-bottom:10px}
.row{display:grid;grid-template-columns:84px 1fr 32px;align-items:center;height:30px;gap:12px}
.row label{color:var(--mute)}
.row.set label{color:var(--ink)}
.row .v{text-align:right;color:var(--dim)}
.row.set .v{color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;background:var(--mute)}
.row.set input::-webkit-slider-thumb{background:var(--ink)}
.fam{display:flex;gap:16px;margin-bottom:20px}
.fam button{color:var(--mute)} .fam button.on{color:var(--ink)}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.look{text-align:left}
.look .t{aspect-ratio:4/5;background:center/cover;position:relative}
.look span{display:block;margin-top:6px;font-size:11px;color:var(--mute)}
.look.on .t::after{content:"";position:absolute;right:0;bottom:0;width:14px;height:14px;background:var(--act)}
.look.on span{color:var(--ink)}
.amount{position:sticky;bottom:-48px;background:var(--bg);margin:20px -24px -48px;padding:12px 24px 16px;border-top:1px solid var(--line)}
main{position:relative;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;height:calc(100% - 80px);aspect-ratio:3/4}
.photo{position:absolute;inset:0;background:url(photos/canal.webp) center/cover}
.photo.graded{filter:contrast(1.08) saturate(.82) sepia(.14) brightness(1.02)}
.orig{position:absolute;inset:0;background:url(photos/canal.webp) center/cover;clip-path:inset(0 100% 0 0)}
.split{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);left:100%;cursor:ew-resize;display:none}
.split::after{content:"";position:absolute;left:-5px;top:50%;width:11px;height:11px;background:var(--ink)}
body.cmp .split{display:block}
.strip{grid-column:1/-1;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px}
.thumb{height:48px;aspect-ratio:3/4;background:center/cover;opacity:.4;position:relative}
.thumb.wide{aspect-ratio:4/3}
.thumb.on{opacity:1}
.strip .n{margin-left:auto;color:var(--mute)}

/* concept switcher (not part of the design) */
.dev{position:fixed;right:16px;bottom:16px;background:#fff;color:#111;border:1px solid #ccc;padding:10px;display:flex;gap:6px;align-items:center;font-size:11px;z-index:9}
.dev{flex-wrap:wrap;max-width:420px}
.dev button{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid #ddd}
.dev button i{width:10px;height:10px;display:inline-block}
.dev button.on{border-color:#111;box-shadow:inset 0 0 0 1px #111}
</style>
</head>
<body data-pal="a">

<!-- LIBRARY -->
<section class="view lib light" id="lib">
  <header>
    <div class="brand"><span class="mark"></span><b>Chro-ma-smith</b></div>
    <div class="views"><button class="on">Library</button><button data-go="ed">Editor</button><button>Match</button><button>Collage</button></div>
    <div class="right"><button class="ib" title="Search">⌕</button><button class="primary">Import <span>+</span></button></div>
  </header>
  <div class="side">
    <span class="cap">Library</span>
    <button>All photos <small class="mono">4,812</small></button>
    <button>Recent <small class="mono">248</small></button>
    <button>Favourites <small class="mono">61</small></button>
    <span class="cap">Collections</span>
    <button class="on">Spring walk <small class="mono">248</small></button>
    <button>Lake District <small class="mono">512</small></button>
    <button>Portraits <small class="mono">96</small></button>
    <button>Black &amp; white <small class="mono">133</small></button>
    <span class="cap">Folders</span>
    <button>2026 <small class="mono">1,904</small></button>
    <button>2025 <small class="mono">2,908</small></button>
  </div>
  <div class="gal">
    <div class="ghead">
      <h1>Spring walk</h1>
      <div class="meta"><span class="mono">248 photos</span><button class="on">Date</button><button>Rating</button><button>Edited</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- EDITOR -->
<section class="view ed dark" id="ed" hidden>
  <header>
    <div class="brand"><span class="mark"></span><b>Chro-ma-smith</b></div>
    <div class="views"><button data-go="lib">Library</button><button class="on">Editor</button><button>Match</button><button>Collage</button></div>
    <div class="right">
      <button class="ib" title="Undo">↶</button><button class="ib" title="Redo">↷</button><button class="ib" id="cmpBtn" title="Before / after (\)">◧</button>
      <button class="primary">Export <span>→</span></button>
    </div>
  </header>
  <nav id="nav"></nav>
  <aside id="panel"></aside>
  <main>
    <div class="stage"><div class="photo graded"></div><div class="orig" id="orig"></div><div class="split" id="split"></div></div>
  </main>
  <div class="strip" id="strip"></div>
</section>

<div class="dev"><span>Accent</span></div>

<script>
const P=[['canal','Canal at dusk',''],['dog-sitting','Towpath',''],['dog-lying','Sofa','wide'],['selfie','Waterfall',''],
  ['canal','Canal, B&W','','grayscale(1)'],['dog-lying','Nap','wide','grayscale(1) contrast(1.2)'],['dog-sitting','Towpath II','','sepia(.3)'],['selfie','Falls II','','grayscale(1)'],
  ['canal','Canal, Portra','','sepia(.2) saturate(.8)'],['dog-sitting','Towpath III','','contrast(1.2)'],['dog-lying','Sofa II','wide','sepia(.25)'],['selfie','Falls III','','saturate(1.3)']];
document.getElementById('grid').innerHTML=P.map(([f,n,w,flt],i)=>
  `<button class="card ${i===0?'on':''}" data-go="ed"><div class="t"><div style="background-image:url(photos/${f}.webp);filter:${flt||'none'}"></div></div><span>${n}<b class="mono">${String(i+1).padStart(3,'0')}</b></span></button>`).join('');
document.getElementById('strip').innerHTML=P.slice(0,10).map(([f,,w,flt],i)=>
  `<div class="thumb ${w} ${i===0?'on':''}" style="background-image:url(photos/${f}.webp);filter:${flt||'none'}"></div>`).join('')+`<span class="n mono">1 / 248</span>`;

document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;
  document.getElementById('lib').hidden=g.dataset.go!=='lib';document.getElementById('ed').hidden=g.dataset.go!=='ed';});

const TOOLS=['Looks','Adjust','Colour','Detail','Retouch','Crop','Mask','Film','Frame'];
let cur='Looks';
const nav=document.getElementById('nav');
const drawNav=()=>nav.innerHTML=TOOLS.map(t=>`<button class="${t===cur?'on':''}">${t}</button>`).join('')+'<hr><button>Info</button>';
nav.onclick=e=>{const b=e.target.closest('button');if(!b||b.textContent==='Info')return;cur=b.textContent;drawNav();drawPanel();};

const slider=(l,v,min=-100,max=100)=>`<div class="row ${v?'set':''}"><label>${l}</label><input type="range" min="${min}" max="${max}" value="${v}"><span class="v mono">${v>0?'+'+v:v}</span></div>`;
const sec=(n,b)=>`<div class="sec"><span class="cap">${n}</span>${b}</div>`;
const PANELS={
  Looks:()=>`<div class="fam"><button class="on">All</button><button>Kodak</button><button>Fuji</button><button>Cinema</button><button>B&amp;W</button></div><div class="looks">`+
    [['Portra 400',''],['Ektar 100','saturate(1.4) contrast(1.1)'],['Pro 400H','hue-rotate(-8deg) saturate(.8) brightness(1.05)'],['Classic Neg','sepia(.25) contrast(1.15) saturate(.9)'],['Tri-X 400','grayscale(1) contrast(1.3)'],['Vision3 500T','hue-rotate(12deg) saturate(.7) brightness(.95)']]
    .map(([n,f],i)=>`<button class="look ${i===0?'on':''}"><div class="t" style="background-image:url(photos/canal.webp);filter:${f||'contrast(1.08) saturate(.82) sepia(.14)'}"></div><span>${n}</span></button>`).join('')+
    `</div><div class="amount">${slider('Strength',80,0,100)}</div>`,
  Adjust:()=>sec('Light',slider('Exposure',12)+slider('Contrast',8)+slider('Highlights',-24)+slider('Shadows',16)+slider('Whites',0)+slider('Blacks',0))+
    sec('White balance',slider('Temp',6)+slider('Tint',0))+sec('Presence',slider('Vibrance',0)+slider('Saturation',-10)),
  Film:()=>sec('Grain',slider('Amount',34,0,100)+slider('Size',22,0,100))+sec('Halation',slider('Amount',18,0,100)+slider('Radius',40,0,100))+sec('Bloom',slider('Amount',0,0,100)),
};
const panel=document.getElementById('panel');
const drawPanel=()=>panel.innerHTML=`<h2>${cur}</h2>`+(PANELS[cur]||(()=>sec('Controls',slider('Amount',0)+slider('Radius',0))))();
panel.oninput=e=>{if(e.target.type!=='range')return;const r=e.target.closest('.row'),v=+e.target.value;r.querySelector('.v').textContent=v>0?'+'+v:v;r.classList.toggle('set',v!==0);};
panel.ondblclick=e=>{if(e.target.type==='range'&&+e.target.min<0){e.target.value=0;e.target.dispatchEvent(new Event('input',{bubbles:true}));}};

const split=document.getElementById('split'),orig=document.getElementById('orig');
const setSplit=p=>{split.style.left=p+'%';orig.style.clipPath=`inset(0 ${100-p}% 0 0)`;};
document.getElementById('cmpBtn').onclick=()=>{const on=document.body.classList.toggle('cmp');setSplit(on?50:100);};
split.onpointerdown=e=>{split.setPointerCapture(e.pointerId);split.onpointermove=m=>{const r=split.parentElement.getBoundingClientRect();setSplit(Math.min(100,Math.max(0,(m.clientX-r.left)/r.width*100)));};};
split.onpointerup=()=>split.onpointermove=null;

const PALS=[['a','Vermilion','#ff3b1f'],['b','Orange + blue','#ff5a1f','#2b44ff'],['mondrian','Mondrian red + blue','#e3261b','#1f3dff'],['te','TE orange + grey','#ff6a00','#8a8a86'],
  ['klein','Klein blue','#1f3fff'],['racing','Racing green','#0f6b43'],['signal','Signal lime','#e8ff2a'],['pink','Hot pink + blue','#ff4f9a','#1f3fff'],
  ['violet','Violet','#6b3cff'],['mint','Mint','#1fcf8f'],['mono','No colour','#111']];
document.querySelector('.dev').insertAdjacentHTML('beforeend',PALS.map(([k,n,c,c2],i)=>`<button data-p="${k}" class="${i?'':'on'}"><i style="background:${c}"></i>${c2?`<i style="background:${c2}"></i>`:''}${n}</button>`).join(''));
document.querySelector('.dev').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.dev button').forEach(x=>x.classList.toggle('on',x===b));document.body.dataset.pal=b.dataset.p;};
drawNav();drawPanel();
</script>
</body>
</html>
