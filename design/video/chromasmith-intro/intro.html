<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromasmith ident</title>
<style>
@font-face{font-family:Gramatika;src:url('../../../vendor/fonts/gramatika/GramatikaBold.otf') format('opentype');font-weight:700}
@font-face{font-family:Gramatika;src:url('../../../vendor/fonts/gramatika/GramatikaRegular.otf') format('opentype');font-weight:400}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:1920px;height:1080px;display:block}
#type{position:absolute;inset:0;pointer-events:none;font-family:Gramatika,Arial,sans-serif;color:#ece8df}
#title{position:absolute;left:0;width:100%;top:752px;text-align:center;white-space:nowrap;font-size:72px;font-weight:700;line-height:1;letter-spacing:.2em;text-indent:.2em}
#title .m{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em 0 .08em}
#title .l{display:inline-block;will-change:transform}
#rule{position:absolute;left:50%;top:868px;width:520px;height:1px;margin-left:-260px;background:linear-gradient(90deg,transparent,rgba(236,232,223,.55) 30%,rgba(255,150,110,.8) 50%,rgba(236,232,223,.55) 70%,transparent);transform:scaleX(0)}
#credit{position:absolute;left:0;width:100%;top:896px;text-align:center;font-size:21px;font-weight:400;color:rgba(236,232,223,.72);opacity:0}
#shade{position:absolute;inset:0;background:#000;opacity:0}
</style>
<script type="importmap">{"imports":{"three":"./lib/three/build/three.module.min.js","three/addons/":"./lib/three/jsm/"}}</script>
</head>
<body><main id="stage" aria-label="Chromasmith ident">
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="type"><div id="title"></div><div id="rule"></div><div id="credit">A MAD MACHINE PRODUCTION</div></div>
<div id="shade"></div>
</main>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {BokehPass} from 'three/addons/postprocessing/BokehPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';

const W=1920,H=1080,FPS=24;
// Motion blur: SUB renders per frame across a 180-degree shutter (half a frame).
const SUB=+(new URLSearchParams(location.search).get('sub')||10),SHUTTER=.5/FPS;
const clamp=x=>Math.max(0,Math.min(1,x)),lerp=(a,b,u)=>a+(b-a)*u;
const smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const easeOutCubic=u=>1-Math.pow(1-u,3),easeOutQuint=u=>1-Math.pow(1-u,5);
const easeInOut=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const bell=(c,w,t)=>Math.exp(-Math.pow((t-c)/w,2));

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.NoToneMapping;               // tone mapping happens once, after motion-blur accumulation
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
RectAreaLightUniformsLib.init();

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.75;
const camera=new THREE.PerspectiveCamera(28,W/H,.1,120);

// ---------- backdrop: deep graded void with a warm core that answers the impact ----------
const backdrop=new THREE.Mesh(new THREE.PlaneGeometry(140,80),new THREE.ShaderMaterial({
 uniforms:{uForge:{value:0},uLift:{value:0}},depthWrite:true,
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`varying vec2 vUv;uniform float uForge,uLift;
 void main(){vec2 p=(vUv-vec2(.5,.53))*vec2(1.75,1.);float r=length(p);
  vec3 c=mix(vec3(.010,.022,.040),vec3(.0012,.0018,.003),smoothstep(.0,.42,r));
  c+=vec3(.020,.040,.070)*exp(-r*r*40.)*(.6+uLift);
  c+=vec3(.16,.04,.012)*exp(-r*r*90.)*uForge;
  gl_FragColor=vec4(c*.55,1.);}`}));
backdrop.position.set(0,0,-30);scene.add(backdrop);

// ---------- the two slabs (logo geometry from the SVG mark, 1 svg unit = .05) ----------
const U=.05,CX=50,CY=49;
function slabGeometry(w,h,depth){
 const r=.045,s=new THREE.Shape(),x=-w/2,y=-h/2;
 s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
 const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:.03,bevelSize:.028,bevelSegments:6,curveSegments:10});
 g.translate(0,0,-depth/2);g.computeVertexNormals();return g;
}
function capTexture(draw,w,h){
 const c=document.createElement('canvas');c.width=1024;c.height=Math.round(1024*h/w);
 draw(c.getContext('2d'),c.width,c.height);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
 t.repeat.set(1/w,1/h);t.offset.set(.5,.5);return t;
}
// subtle anisotropic brushing so highlights stretch instead of sitting as flat blobs
function brushed(w,h,seed){
 const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
 x.fillStyle='#8a8a8a';x.fillRect(0,0,512,512);let s=seed;
 for(let i=0;i<2600;i++){s=(s*16807)%2147483647;const y=s%512;s=(s*16807)%2147483647;const a=.03+(s%100)/2200;
  x.fillStyle=`rgba(${s%2?255:0},${s%2?255:0},${s%2?255:0},${a})`;x.fillRect(0,y,512,1)}
 const t=new THREE.CanvasTexture(c);t.repeat.set(1/w,1/h);t.offset.set(.5,.5);return t;
}
const WW=48*U,WH=44*U,OW=43*U,OH=45*U,DEPTH=.16;
const whiteMat=new THREE.MeshPhysicalMaterial({color:0xefece4,roughness:.42,roughnessMap:brushed(WW,WH,11),clearcoat:1,clearcoatRoughness:.12,sheen:.2,sheenColor:0xffffff});
const whiteSide=new THREE.MeshPhysicalMaterial({color:0xd9d5cc,roughness:.3,clearcoat:1,clearcoatRoughness:.08});
const orangeTex=capTexture((g,cw,ch)=>{
 g.scale(cw/43,ch/45);g.fillStyle='#ff3b1f';g.fillRect(0,0,43,45);
 const g1=g.createRadialGradient(33,0,0,33,0,41.25);g1.addColorStop(0,'#fff1e0');g1.addColorStop(.35,'#ff6a3a');g1.addColorStop(.7,'#b0200e');g1.addColorStop(1,'#7a1208');
 const g2=g.createRadialGradient(33,0,0,33,0,41.25);g2.addColorStop(0,'#fff1e0');g2.addColorStop(.4,'#ff7a4c');g2.addColorStop(1,'#ff2a10');
 g.fillStyle=g1;g.beginPath();g.moveTo(0,0);g.lineTo(33,0);g.lineTo(0,33);g.fill();
 g.fillStyle=g2;g.beginPath();g.moveTo(33,0);g.lineTo(33,33);g.lineTo(0,33);g.fill();
 g.strokeStyle='rgba(255,241,224,.8)';g.lineWidth=.35;g.beginPath();g.moveTo(0,33);g.lineTo(33,0);g.stroke();
},OW,OH);
const orangeMat=new THREE.MeshPhysicalMaterial({map:orangeTex,roughness:.34,roughnessMap:brushed(OW,OH,29),clearcoat:1,clearcoatRoughness:.1,emissive:0xff3b1f,emissiveMap:orangeTex,emissiveIntensity:.22});
const orangeSide=new THREE.MeshPhysicalMaterial({color:0xc4260f,roughness:.28,clearcoat:1,clearcoatRoughness:.08});
const white=new THREE.Mesh(slabGeometry(WW,WH,DEPTH),[whiteMat,whiteSide]);
const orange=new THREE.Mesh(slabGeometry(OW,OH,DEPTH),[orangeMat,orangeSide]);
for(const m of [white,orange]){m.castShadow=m.receiveShadow=true;scene.add(m)}
const WHITE_HOME=new THREE.Vector3((45-CX)*U,-(43-CY)*U,0),ORANGE_HOME=new THREE.Vector3((57.5-CX)*U,-(54.5-CY)*U,.24);

// ---------- lights ----------
const key=new THREE.DirectionalLight(0xfff1e2,3.6);key.position.set(4.5,5.5,7);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:30});key.shadow.bias=-.0004;key.shadow.normalBias=.02;key.shadow.radius=4;
scene.add(key);
const rim=new THREE.DirectionalLight(0x86bfff,3.4);rim.position.set(-6,3.5,-5);scene.add(rim);
const fill=new THREE.DirectionalLight(0x5d7fa8,.35);fill.position.set(-5,-2,6);scene.add(fill);
const sweep=new THREE.RectAreaLight(0xfff6ea,0,7,.55);scene.add(sweep);
const forge=new THREE.PointLight(0xff6a32,0,6,2);forge.position.set(.1,-.05,.9);scene.add(forge);

// ---------- dust in the air, deterministic ----------
const N=700,dustPos=new Float32Array(N*3),base=[];let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
for(let i=0;i<N;i++)base.push([lerp(-9,9,rnd()),lerp(-5,5,rnd()),lerp(-14,5,rnd()),rnd()*6.28,.04+rnd()*.1]);
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
const dust=new THREE.Points(dustGeo,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uA:{value:0}},
 vertexShader:'uniform float uA;varying float vA;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=clamp(42./-mv.z,1.,9.);vA=uA*smoothstep(-30.,-4.,mv.z);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vec3(.55,.68,.85)*vA*smoothstep(.5,.0,d),1.);}'}));
scene.add(dust);

// ---------- post: render -> depth of field -> bloom (all linear HDR) ----------
const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(W,H,{type:THREE.HalfFloatType}));
composer.addPass(new RenderPass(scene,camera));
const bokeh=new BokehPass(scene,camera,{focus:10,aperture:.0035,maxblur:.009});composer.addPass(bokeh);
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.3,.5,1.0);composer.addPass(bloom);
for(const p of composer.passes)p.renderToScreen=false;
composer.renderToScreen=false;

const accum=new THREE.WebGLRenderTarget(W,H,{type:THREE.FloatType});
const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),quadGeo=new THREE.PlaneGeometry(2,2);
const addMat=new THREE.ShaderMaterial({uniforms:{tex:{value:null},w:{value:1}},blending:THREE.CustomBlending,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,blendSrcAlpha:THREE.OneFactor,blendDstAlpha:THREE.OneFactor,depthTest:false,depthWrite:false,transparent:true,
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}',
 fragmentShader:'uniform sampler2D tex;uniform float w;varying vec2 vUv;void main(){gl_FragColor=vec4(texture2D(tex,vUv).rgb*w,w);}'});
const addScene=new THREE.Scene();addScene.add(new THREE.Mesh(quadGeo,addMat));
// final grade: exposure, ACES, gentle teal/amber split, chromatic fringe, vignette, film grain
const outMat=new THREE.ShaderMaterial({uniforms:{tex:{value:accum.texture},uExp:{value:1},uSeed:{value:0},uRes:{value:new THREE.Vector2(W,H)}},depthTest:false,depthWrite:false,
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}',
 fragmentShader:`uniform sampler2D tex;uniform float uExp,uSeed;uniform vec2 uRes;varying vec2 vUv;
 vec3 aces(vec3 x){float m=max(max(x.r,x.g),x.b);float k=m/(1.+m*.55)*1.12;return clamp(x*(k/max(m,1e-5)),0.,1.);}
 float h(vec2 p){vec3 q=fract(vec3(p.xyx+uSeed*vec3(.71,.37,.53))*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
 void main(){vec2 d=vUv-.5;float r2=dot(d,d);vec2 o=d*r2*.006;
  vec3 c=vec3(texture2D(tex,vUv+o).r,texture2D(tex,vUv).g,texture2D(tex,vUv-o).b)*uExp;
  c=aces(c*1.25);float l=dot(c,vec3(.2126,.7152,.0722));
  c+=mix(vec3(-.006,.004,.014),vec3(.012,.004,-.01),smoothstep(.15,.7,l));
  c*=1.-smoothstep(.18,.85,r2*1.9)*.55;
  c=pow(max(c,0.),vec3(1./2.2));
  float g=(h(gl_FragCoord.xy)+h(gl_FragCoord.xy+17.3)-1.)*.045*(1.-l*.6);
  gl_FragColor=vec4(c+g,1.);}`});
const outScene=new THREE.Scene();outScene.add(new THREE.Mesh(quadGeo,outMat));

// ---------- choreography ----------
const q=(x,y,z)=>new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z)),ID=new THREE.Quaternion();
const bez=(p0,p1,p2,p3,u)=>{const v=1-u;return p0.clone().multiplyScalar(v*v*v).add(p1.clone().multiplyScalar(3*v*v*u)).add(p2.clone().multiplyScalar(3*v*u*u)).add(p3.clone().multiplyScalar(u*u*u))};
const WHITE={t0:.55,t1:2.6,p:[new THREE.Vector3(-7,3.6,-16),new THREE.Vector3(-5,3,-7),new THREE.Vector3(-1.4,1.2,1.8)],r:q(1.3,-2.8,.8)};
const ORANGE={t0:1.45,t1:3.3,p:[new THREE.Vector3(5.5,-2.6,7.5),new THREE.Vector3(3.6,-1.6,4.5),new THREE.Vector3(1.4,-.9,2.2)],r:q(-2.1,2.5,-1.1)};
function fly(mesh,spec,home,t){
 if(t<spec.t0){mesh.visible=false;return}mesh.visible=true;
 const u=clamp((t-spec.t0)/(spec.t1-spec.t0)),s=easeOutCubic(u);
 mesh.position.copy(bez(spec.p[0],spec.p[1],spec.p[2],home,s));
 mesh.quaternion.copy(spec.r).slerp(ID,easeOutQuint(u));
 const dt=t-spec.t1;if(dt>0){const k=Math.exp(-5.5*dt);  // damped settle after landing
  mesh.rotation.x+=.05*k*Math.sin(17*dt);mesh.rotation.y+=-.035*k*Math.sin(13*dt+.6);mesh.position.z+=.05*k*Math.sin(15*dt)}
}
const target=new THREE.Vector3();
function cameraAt(t){
 const az=THREE.MathUtils.degToRad(lerp(30,11,easeInOut(clamp(t/4.6)))-3*smooth(4.6,8.8,t));
 const el=THREE.MathUtils.degToRad(lerp(12,4,easeInOut(clamp(t/4.6))));
 const dist=lerp(21,15.2,easeOutCubic(clamp(t/4.4)))-.7*smooth(4.4,8.8,t);
 target.set(lerp(-.35,.12,smooth(0,4,t)),lerp(-.15,-1.05,smooth(3.4,4.8,t)),0);
 const sh=(a,c)=>a*Math.exp(-7*Math.max(0,t-c))*Math.sin(55*(t-c))*(t>c?1:0);  // tiny impact jolts
 camera.position.set(target.x+dist*Math.sin(az)*Math.cos(el),target.y+dist*Math.sin(el)+sh(.012,2.6)+sh(.02,3.3),target.z+dist*Math.cos(az)*Math.cos(el));
 camera.lookAt(target);camera.updateMatrixWorld();
}
function sceneAt(t){
 fly(white,WHITE,WHITE_HOME,t);fly(orange,ORANGE,ORANGE_HOME,t);
 if(t>ORANGE.t1){const k=Math.exp(-6*(t-ORANGE.t1));white.position.z-=.04*k*Math.sin(14*(t-ORANGE.t1))}
 cameraAt(t);
 const sw=smooth(3.9,5.6,t);sweep.position.set(lerp(-6,6,sw),lerp(1.8,-.6,sw),3.2);sweep.lookAt(0,0,0);sweep.intensity=9*bell(4.75,.6,t);
 const hit=Math.max(t>2.6?.45*Math.exp(-4*(t-2.6)):0,t>3.3?Math.exp(-3.2*(t-3.3)):0);
 forge.intensity=0;backdrop.material.uniforms.uForge.value=hit*.9+.08*smooth(3.3,4.5,t);
 backdrop.material.uniforms.uLift.value=smooth(0,1.5,t);
 const a=dustGeo.attributes.position.array;
 for(let i=0;i<N;i++){const b=base[i];a[i*3]=b[0]+.12*t+.25*Math.sin(t*.4+b[3]);a[i*3+1]=b[1]+b[4]*t+.15*Math.cos(t*.3+b[3]);a[i*3+2]=b[2]}
 dustGeo.attributes.position.needsUpdate=true;dust.material.uniforms.uA.value=.55*smooth(0,1.4,t);
 // rack focus: follow whichever slab is moving, settle on the mark
 const fw=camera.position.distanceTo(white.position),fo=camera.position.distanceTo(orange.position),fm=camera.position.distanceTo(new THREE.Vector3(0,0,.12));
 const focus=t<1.45?fw:t<3.3?lerp(fw,fo,smooth(1.45,2.4,t)):lerp(fo,fm,smooth(3.3,3.8,t));
 bokeh.uniforms.focus.value=focus;bokeh.uniforms.aperture.value=lerp(.0035,.00005,smooth(3.3,4.4,t));
 bloom.strength=.28+.25*hit;
}

// ---------- type ----------
const word='CHROMASMITH',title=document.getElementById('title'),letters=[];
for(const ch of word){const m=document.createElement('span');m.className='m';const l=document.createElement('span');l.className='l';l.textContent=ch;m.appendChild(l);title.appendChild(m);letters.push(l)}
function typeAt(t){
 letters.forEach((l,i)=>{const u=easeOutQuint(clamp((t-4.35-i*.05)/.9));l.style.transform=`translateY(${(1-u)*108}%)`});
 title.style.letterSpacing=lerp(.28,.2,easeOutCubic(clamp((t-4.35)/2.2)))+'em';
 const r=easeOutCubic(clamp((t-5.25)/.9));document.getElementById('rule').style.transform=`scaleX(${r})`;
 const c=document.getElementById('credit'),cu=easeOutCubic(clamp((t-5.6)/1));c.style.opacity=cu;c.style.letterSpacing=lerp(.52,.38,cu)+'em';c.style.textIndent=lerp(.52,.38,cu)+'em';
 document.getElementById('shade').style.opacity=smooth(8.15,8.8,t);
}

let frameNo=0;
window.renderAt=function(t){
 renderer.setRenderTarget(accum);renderer.setClearColor(0,0);renderer.clear();
 for(let j=0;j<SUB;j++){
  const st=Math.max(0,t+(SUB>1?(j/(SUB-1)-.5):0)*SHUTTER);
  sceneAt(st);composer.render();
  addMat.uniforms.tex.value=composer.readBuffer.texture;addMat.uniforms.w.value=1/SUB;
  renderer.setRenderTarget(accum);renderer.render(addScene,quadCam);
 }
 sceneAt(t);typeAt(t);
 outMat.uniforms.uExp.value=.38*smooth(0,.9,t);  // exposure tuned against the weight-correct accumulatoroutMat.uniforms.uSeed.value=(frameNo++%97)*1.37;
 renderer.setRenderTarget(null);renderer.render(outScene,quadCam);
};
await document.fonts.ready;
window.renderAt(0);
window.ready=true;
</script></body></html>
