<text class="k" x="48" y="42">CHROMASMITH / CHR—149 / NEW ICON CONCEPTS</text>
<text class="title" x="48" y="88">New shapes for the tool rail.</text>
<text class="sub" x="49" y="117">Two original symbol families. These change the underlying drawing and metaphor, not just the stroke treatment.</text>
<line class="rule" x1="48" x2="1224" y1="145" y2="145"/>
