<text class="eyebrow" x="48" y="46">CHROMASMITH / CHR—149 / SECOND PASS</text>
<text class="title" x="48" y="94">Signal, sharpened.</text>
<text class="desc" x="49" y="123">Three degrees of edge, all with finer lines than the first sheet. Each study is drawn on a 24-unit grid.</text>
<line class="rule" x1="48" x2="1152" y1="145" y2="145"/>
<text class="eyebrow" x="50" y="178">A / CUT PRECISION</text><text class="desc" x="293" y="178">The most usable: surgical lines, squared terminals, one decisive cut per form.</text>
<text class="eyebrow" x="50" y="389">B / ANGULAR TENSION</text><text class="desc" x="293" y="389">Diagonal interruption becomes a shared detail across the family.</text>
<text class="eyebrow" x="50" y="600">C / HARD SIGNAL</text><text class="desc" x="293" y="600">The boldest composition, kept readable through familiar silhouettes.</text>

