<text class="k" x="48" y="48">CHR—149 / ICON STUDIES / 25.09.2026</text>
<text class="h" x="48" y="93">Razor-thin, with a clear silhouette.</text>
<text class="s" x="49" y="122">Original SVG studies on a 24-unit drawing grid. Shown enlarged; 24 px previews at right of each cell.</text>
<line class="rule" x1="48" y1="145" x2="1152" y2="145"/>
<text class="k" x="49" y="177">01 / ORTHOGONAL</text><text class="s" x="260" y="177">Square ends · straight edges · controlled asymmetry</text>
<text class="k" x="49" y="391">02 / CUT LINE</text><text class="s" x="260" y="391">Intentional gaps · light and architectural</text>
<text class="k" x="49" y="605">03 / SIGNAL</text><text class="s" x="260" y="605">Extended gesture · more editorial presence</text>

