<text class="k" x="50" y="44">CHR—149 / DESIGN EXPLORATION 04</text>
<text class="h" x="49" y="91">Four ways to shift the line.</text>
<text class="sub" x="50" y="120">All original SVGs, building on A. Read each row as a possible system; combine individual details if you prefer.</text>
