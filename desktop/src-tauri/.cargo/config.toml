# Intel Mac builds target AVX2-era CPUs (Haswell, 2013+; every Intel Mac macOS 13+ supports).
# The RAW decode/demosaic/LUT loops get wider SIMD; Rust never fuses multiply-add on its own,
# so output is byte-identical (checked: dump_rw2 sha256 equal, ~6% faster decode).
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]
