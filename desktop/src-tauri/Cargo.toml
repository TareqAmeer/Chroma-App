[package]
name = "chromasmith"
version = "1.0.0"
description = "Chromasmith — offline film-emulation photo editor (native macOS shell)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
# Window position/size/maximized-state persistence across launches — without it the window
# always opens at tauri.conf.json's fixed 1440x900, forgetting wherever it was last resized or
# moved. Officially maintained (tauri-apps org), same as the other tauri-plugin-* deps above.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Manual asset server: Tauri's declarative app.security.headers config does not reliably
# attach COOP/COEP to the main document's response in this build (verified — origin is
# correctly tauri://localhost, but crossOriginIsolated stayed false even after a forced
# reload). A manually registered protocol handler gives full control over every response's
# headers, the same level of control the iOS Capacitor shell's WebViewAssetHandler Swift
# patch already uses successfully for this exact requirement. (Reads dist/ off disk at
# runtime for now, not compile-time-embedded — see main.rs's DIST_DIR comment.)
mime_guess = "2"
# Native RAW (RW2) decode — the same architecture RapidRAW uses: decode in Rust, never in the
# WebView, sidestepping WKWebView's unreliable SharedArrayBuffer support entirely (the libraw-
# wasm decoder the browser/iOS builds use needs SharedArrayBuffer, which this native shell
# could not get WKWebView to expose — verified two independent ways). rawler decodes to raw
# Bayer sensor data only; this app does its own black-level/WB/demosaic in main.rs, then hands
# linear 16-bit camera RGB to the EXISTING, already-calibrated JS DCP pipeline unchanged.
rawler = "0.7"
# Parallel pixel loops in the native decode (rawler already pulls rayon in; this just makes
# the dependency explicit for our own code).
rayon = "1"
base64 = "0.22"
# Library browser: thumbnail generation (downsize + JPEG-encode both RAW-decoded buffers and
# regular JPEG/PNG files) and a small non-crypto hash for the on-disk thumbnail cache key.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# Library browser: EXIF (camera/lens/date) for non-RAW files — rawler covers the RAWs.
kamadak-exif = "0.5"
# Native HTTP download for the Google Photos Picker's googleusercontent.com CDN, which the
# WKWebView's own fetch()/XHR can't reach (CORS preflight the CDN won't answer for the
# tauri:// origin). ureq is a small blocking client; rustls (no OpenSSL/tokio) keeps the build light.
ureq = "2"
# Lens-profile auto-correction (distortion/vignette/TCA) looked up by camera+lens EXIF, using
# lensfun's bundled community database. Pure-Rust port (no system liblensfun dependency, unlike
# the C original) — but it's pre-alpha (0.7.0): API surface may still shift on upgrade. The
# manual Distortion/Vignette/CA sliders remain the fallback when no profile match is found (this
# camera/lens pairing — Panasonic DC-S9 + LUMIX S 18-40 — may not be in the community DB yet).
lensfun = "0.7"
# Diagnostic-only alternate demosaic algorithms (CS_DEMOSAIC=ahd etc. env override in
# raw_decode.rs) — testing whether AHD's homogeneity-directed adaptive interpolation reduces
# the sunlit-water false-color speckle PPG produces, before considering a default swap.
demosaic = "0.3"
# AI tap-to-select (Masks): MobileSAM inference (vendor/sam/*.onnx — MIT-licensed export from
# huggingface.co/Acly/MobileSAM) against a vendored onnxruntime dylib (vendor/onnxruntime/,
# MIT-licensed — see that dir's README for why it's vendored: no x86_64-apple-darwin prebuilt
# exists via the `ort` crate's download-binaries feature, and this project's actual dev machine
# is Intel). Calls the ONNX Runtime C API DIRECTLY via ort-sys + libloading, NOT the `ort` crate's
# own Session/Environment wrapper — `ort` 2.0.0-rc.12's load-dynamic feature has a confirmed,
# reproducible hang bug in its internal dylib-handle caching on this platform (see sam.rs's
# top-of-file comment for the full trace). The raw C API has none of this bug and was proven
# end-to-end (real model, real photo, real inference) before writing sam.rs this way.
ort-sys = { version = "=2.0.0-rc.12", default-features = false, features = ["disable-linking", "api-17", "std"] }
libloading = "0.9"
# Card ingest: statfs(2) for a card's capacity/free space. Already in the tree as a transitive
# dependency of tauri/rawler — this only makes the direct use explicit. Nothing else needs it,
# and the alternative (shelling out to `df` and parsing it) would be worse.
libc = "0.2"

[profile.release]
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# NOTE: opt-level="s" + codegen-units=1 + lto=true were dropped for now — rawler's dependency
# tree (jxl/image codecs etc.) made whole-program LTO builds take 10+ minutes, too slow while
# iterating. Reinstate these once the native RAW pipeline is verified working, for a smaller
# final binary.
