<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chromasmith — Second display</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#111;color:#eee;font:13px system-ui,sans-serif}
    body{display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 14px;background:#191919;color:#bbb}
    #empty,#photo{grid-area:2/1}#photo{width:100%;height:100%;object-fit:contain;min-width:0;min-height:0}#empty{place-self:center;color:#aaa}
  </style>
</head>
<body>
  <header class="bar"><span id="name">Second display</span><span id="size"></span></header>
  <div id="empty">Open a still photo in the editor to display it here.</div>
  <img id="photo" alt="Current photo preview" hidden>
  <script src="second-display.js"></script>
</body>
</html>
