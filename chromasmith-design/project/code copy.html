<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
  --slate-dark: #0f1c24;
  --slate-deep: #162832;
  --slate-surface: #1d333e;
  --primary-accent: #61a0af;
  --amber-accent: #ff9b42;
  --ink-light: #f5f5f7;
  --ink-muted: #8d9da7;
  --ink-faint: #566872;
}

html, body {
  height: 100%;
  width: 100%;
  background: #090e11;
  font-family: var(--font-text);
  color: var(--ink-light);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}

/* Background Desktop Environment / Darkroom Studio Backdrop */
.desktop-canvas {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 40%, #15222b 0%, #0a1116 75%, #05080a 100%);
}

/* Subtle architectural grid pattern to represent desktop OS workspace */
.desktop-canvas::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* Simulated macOS Menu Bar for authentic desktop context */
.macos-menubar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 28px;
  background: rgba(15, 23, 29, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  z-index: 50;
}

.macos-menu-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.apple-mark {
  opacity: 0.9;
  cursor: default;
}

.menu-app-name {
  font-weight: 600;
  color: #fff;
}

.menu-item {
  color: rgba(255, 255, 255, 0.7);
}

.macos-menu-right {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.6);
}

/* Lightroom Style Floating Centered Modal */
.splash-container {
  position: relative;
  width: 820px;
  height: 510px;
  max-width: 94vw;
  background: var(--slate-dark);
  border-radius: 12px;
  box-shadow: 
    0 24px 70px rgba(0, 0, 0, 0.85),
    0 8px 24px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.12);
  display: grid;
  grid-template-columns: 410px 410px;
  overflow: hidden;
  z-index: 100;
  animation: splashFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes splashFadeIn {
  from {
    opacity: 0;
    transform: scale(0.97) translateY(8px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Left Pane: Branding, Credits, Loading State */
.splash-left {
  background: #111d24;
  padding: 36px 36px 32px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  position: relative;
}

/* Top: Colorful Logo & Product Version Badge */
.brand-header {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-container {
  width: 100%;
  max-width: 280px;
  height: auto;
  display: flex;
  align-items: center;
  border-radius: 6px;
  overflow: hidden;
}

.logo-container img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.app-identity {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 4px;
}

.app-title-text {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.4px;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.pro-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  background: rgba(97, 160, 175, 0.2);
  color: var(--primary-accent);
  border: 1px solid rgba(97, 160, 175, 0.4);
  padding: 2px 6px;
  border-radius: 4px;
}

.version-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
  letter-spacing: 0.02em;
}

.product-tagline {
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-muted);
  margin-top: 2px;
}

/* Middle: Lightroom-style Contributor & System Info Scroll */
.credits-block {
  margin: 16px 0 18px;
  padding: 12px 14px;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.04);
  max-height: 145px;
  overflow-y: auto;
}

.credits-block::-webkit-scrollbar {
  width: 4px;
}
.credits-block::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 2px;
}

.credits-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-bottom: 6px;
}

.credits-text {
  font-size: 11px;
  line-height: 1.5;
  color: var(--ink-muted);
}

.credits-text span.highlight {
  color: rgba(255, 255, 255, 0.85);
  font-weight: 500;
}

/* Bottom: Progress Bar & Current Operation */
.loading-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.status-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}

.status-text {
  color: #ffffff;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-spinner {
  width: 10px;
  height: 10px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-top-color: var(--primary-accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.status-pct {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--primary-accent);
  font-weight: 600;
}

/* Progress bar styled in Chromasmith Palette */
.progress-track {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 9999px;
  overflow: hidden;
  position: relative;
}

.progress-bar {
  height: 100%;
  width: 68%;
  background: linear-gradient(90deg, #224455 0%, #61a0af 50%, #ff9b42 100%);
  border-radius: 9999px;
  transition: width 0.3s ease;
  position: relative;
}

.progress-bar::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 1.8s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.copyright-subtext {
  font-size: 10px;
  color: var(--ink-faint);
  margin-top: 4px;
}

/* Right Pane: Featured Photography (Dog portrait) */
.splash-right {
  position: relative;
  background: #0b1114;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo-wrapper {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.photo-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 38%;
  display: block;
}

/* Subtle Film Halation / Grain Vignette Over Photo */
.photo-scrim {
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(to top, rgba(15, 28, 36, 0.85) 0%, rgba(15, 28, 36, 0.1) 40%, transparent 70%),
    radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.4) 100%);
  pointer-events: none;
}

/* Photo Metadata Stamp (Lightroom Style) */
.artwork-meta {
  position: absolute;
  bottom: 24px;
  left: 24px;
  right: 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  z-index: 10;
  pointer-events: none;
}

.artwork-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.artwork-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(255, 255, 255, 0.6);
}

.artwork-title {
  font-size: 12px;
  font-weight: 500;
  color: #ffffff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.artwork-stock {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--amber-accent);
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  padding: 3px 7px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}

/* Interactive Dev Preview Toolbar (To demonstrate loading progress) */
.dev-controls {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(22, 40, 50, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(16px);
  padding: 8px 16px;
  border-radius: 9999px;
  z-index: 200;
  font-size: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}

.dev-controls button {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 9999px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.dev-controls button:hover {
  background: var(--primary-accent);
  color: #0b1215;
  border-color: var(--primary-accent);
}

.dev-controls .divider {
  width: 1px;
  height: 14px;
  background: rgba(255, 255, 255, 0.14);
}

.dev-hint {
  color: var(--ink-muted);
  font-size: 11px;
}
</style>

yle="width: 68%; height: 100%; background: linear-gradient(90deg, #e55319 0%, #ff8c2b 50%, #ffc43d 100%); border-radius: 9999px;"></div></div><div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px;"><span style="font-family: var(--font-mono); font-size: 10.5px; color: rgba(255, 185, 140, 0.75); letter-spacing: 0.02em;" class="">Version 1.4.2 (Build 2026.03)</span><span style="font-size: 10px; color: rgba(255, 255, 255, 0.4);" class="">Chromasmith Inc.</span></div></div></div>

<script>
const progressFill = document.getElementById('progress-fill');
const statusPct = document.getElementById('status-pct');
const stepLabel = document.getElementById('step-label');

const steps = [
  { pct: 15, text: "Initializing Core Graphics & Metal 3 context..." },
  { pct: 35, text: "Reading preferences & color profile cache..." },
  { pct: 60, text: "Loading 3D LUT tables (Portra 400, Tri-X, Ektar)..." },
  { pct: 82, text: "Verifying SQLite raw catalog database..." },
  { pct: 100, text: "Catalog ready. Launching Chromasmith Workspace..." }
];

let currentIndex = 2;

function setProgress(idx) {
  const step = steps[idx];
  progressFill.style.width = step.pct + '%';
  statusPct.textContent = step.pct + '%';
  stepLabel.textContent = step.text;
}

document.getElementById('btn-step-pref').onclick = () => setProgress(1);
document.getElementById('btn-step-lut').onclick = () => setProgress(2);
document.getElementById('btn-step-ready').onclick = () => setProgress(4);

document.getElementById('btn-replay').onclick = () => {
  let stepIdx = 0;
  setProgress(stepIdx);
  const interval = setInterval(() => {
    stepIdx++;
    if (stepIdx < steps.length) {
      setProgress(stepIdx);
    } else {
      clearInterval(interval);
    }
  }, 700);
};

let backdropDark = true;
document.getElementById('btn-theme-toggle').onclick = () => {
  const canvas = document.querySelector('.desktop-canvas');
  backdropDark = !backdropDark;
  if (backdropDark) {
    canvas.style.background = 'radial-gradient(circle at 50% 40%, #15222b 0%, #0a1116 75%, #05080a 100%)';
  } else {
    canvas.style.background = 'radial-gradient(circle at 50% 40%, #293844 0%, #1c262e 75%, #12191f 100%)';
  }
};
</script>
