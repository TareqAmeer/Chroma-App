const io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eo=p=>1-Math.pow(1-p,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
// the app's motion curve: --k-motion-easing cubic-bezier(.16,1,.3,1)
function bez(x1,y1,x2,y2){const B=(a,b,u)=>3*a*u*(1-u)*(1-u)+3*b*u*u*(1-u)+u*u*u;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,u=x;for(let i=0;i<30;i++){u=(lo+hi)/2;if(B(x1,x2,u)<x)lo=u;else hi=u}return B(y1,y2,u)}}

const CAM=[[0,960,540,1],[7.0,960,540,1],[8.6,1030,630,.78],[18.0,1030,630,.78],[19.8,960,540,1],
 [26.3,960,540,1],[27.3,1180,600,1.3],[44.3,1180,600,1.3],[45.5,965,526,2],[47.5,965,526,2],[48.6,1180,600,1.3],
 [53.6,1180,600,1.3],[54.8,1000,640,2],[56.8,1000,640,2],[57.8,1180,600,1.3],[57.9,1180,600,1.3],[58.9,960,600,1.05],
 [62.6,960,600,1.05],[63.4,710,628,1.4],[67.0,710,628,1.4],[68.0,960,540,1],[82,960,540,1]];
function camAt(t){const[x,y,z]=kf(CAM,t);let f=1;
 for(let i=1;i<CAM.length;i++){const a=CAM[i-1],b=CAM[i];const hold=a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3];
  if(t>=a[0]&&t<=b[0]){if(hold&&b[0]-a[0]>1)f=1+.015*io(seg(t,a[0],b[0]));
   else if(!hold&&i>1){const p=CAM[i-2];const wasHold=p[1]===a[1]&&p[2]===a[2]&&p[3]===a[3]&&a[0]-p[0]>1;if(wasHold)f=lerp(1.015,1,io(seg(t,a[0],b[0])))}break}}
 return{x,y,z:z*f}}

[['1','Import'],['2','Edit'],['3','Grain plugin'],['4','Export']].forEach(([n,t],i)=>{const w=el('div','win');css(w,{left:WX(i)-280+'px',top:WT+'px'});
