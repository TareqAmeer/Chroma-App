<script>
const W=1920,H=1080,FPS=24,BPM=112,BEAT=60/BPM,BAR=4*BEAT,NBARS=41,DUR=NBARS*BAR; // 87.86 s; scenes start on bar lines

function bez(x1,y1,x2,y2){const F=(a,c,u)=>3*a*u*(1-u)*(1-u)+3*c*u*u*(1-u)+u*u*u;return x=>{if(x<=0)return 0;if(x>=1)return 1;let lo=0,hi=1,u=x;for(let i=0;i<28;i++){u=(lo+hi)/2;if(F(x1,x2,u)<x)lo=u;else hi=u}return F(y1,y2,u)}}
const kE=bez(.16,1,.3,1),inE=bez(.7,0,.84,0),ioE=bez(.65,0,.35,1);
const stage=document.getElementById('stage');
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e};
const css=(e,o)=>{for(const k in o)e.style[k]=o[k]};
const show=(e,v)=>{e.style.display=v?'':'none';return v};
const IMG='bake13/';
const DIM={beach:[2400,1600],neon:[2400,1600],lib:[1600,1097],sunset:[1600,1063]};

/* The "Faithful prism" mark (design/logo/chromasmith-logo.svg). Every instance gets its OWN gradient ids:
   v13 reused ids across copies, one of them inside a hidden layer, and Chromium painted the overlap flat. */
let prismN=0;
function PRISM(){const n=++prismN;return `<svg viewBox="36 32 43 45" preserveAspectRatio="none"><defs><radialGradient id="pa${n}" cx="69" cy="32" r="41.25" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff1e0"/><stop offset=".35" stop-color="#ff6a3a"/><stop offset=".7" stop-color="#b0200e"/><stop offset="1" stop-color="#7a1208"/></radialGradient><radialGradient id="pb${n}" cx="69" cy="32" r="41.25" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff1e0"/><stop offset=".4" stop-color="#ff7a4c"/><stop offset="1" stop-color="#ff2a10"/></radialGradient><clipPath id="pc${n}"><rect x="36" y="32" width="33" height="33"/></clipPath></defs><g clip-path="url(#pc${n})"><polygon points="36,32 69,32 36,65" fill="url(#pa${n})"/><polygon points="69,32 69,65 36,65" fill="url(#pb${n})"/><line x1="36" y1="65" x2="69" y2="32" stroke="#fff1e0" stroke-width=".35" opacity=".8"/></g></svg>`}

/* ======== captions: one scheduler, one at a time, never overlapping, never shorter than 2.2 s ======== */
const LFull=el('div','L');const fbA=el('img','cover',LFull),fbB=el('img','cover',LFull);
const LPaper=el('div','L');

function ktAnim(e,t,tIn,tOut,stag=.06,dur=.6){const vis=t>=tIn&&t<tOut+.45;show(e,vis);if(!vis)return;
 e._w.forEach((w,i)=>{const p=kE(seg(t,tIn+i*stag,tIn+i*stag+dur)),q=inE(seg(t,tOut,tOut+.35));w.style.transform=`translateY(${(1-p)*115+q*115}%)`})}
const CAPS=[
 ['Your RAW photo.','photo',96,96,880,2.30,4.70],
 ['133 film looks.','photo',96,96,880,5.15,7.40],
 ['On film.','photo',200,90,800,7.90,10.10],
 ['This used to take four apps.','paper',72,0,150,10.60,23.00],
 ['And again, for every photo.','paper',72,0,150,23.60,25.90],
 ['One app.','paper',200,110,440,26.50,28.80],
 ['133 film looks. One tap each.','chip',52,80,70,32.60,40.20],
 ['Real film grain, from the app’s own engine.','chip',52,80,70,41.40,46.80],
 ['True pixels at 2.5×. Real 65mm grain.','photo',72,90,80,47.55,51.00],
 ['Halation: the glow film gives light.','photo',72,90,80,51.80,56.40],
 ['Extreme, for the full glow.','photo',72,90,80,57.20,61.60],
 ['Works on every photo.','paper',80,0,170,62.40,68.10],
 ['Raw Digital. Pure Film.','paper',64,0,690,84.00,86.30],
].map(([text,style,size,x,y,a,z])=>({e:kt(LCap,text,size,style),x,y,a,z}));
{const s=[...CAPS].sort((p,q)=>p.a-q.a);for(let i=0;i<s.length;i++){if(s[i].z-s[i].a<2.2-1e-6)throw new Error('caption too short: '+s[i].e.textContent);
 if(i&&s[i].a<s[i-1].z+.45-1e-6)throw new Error('captions overlap: '+s[i-1].e.textContent+' / '+s[i].e.textContent)}}
function drawCaps(t){for(const c of CAPS){ktAnim(c.e,t,c.a,c.z);if(c.e.style.display!=='none')css(c.e,{left:(c.x||(960-c.e.offsetWidth/2))+'px',top:c.y+'px'})}}

/* ======== lockup (first frame == last frame) ======== */
const LK={sq:120,size:120,gap:30};const LKk=LK.sq/43;
const lockBack=el('div','abs',LFg);css(lockBack,{background:'#111'});
const lockTxt=el('div','abs',LFg);css(lockTxt,{font:`700 ${LK.size}px G`,letterSpacing:'-.02em',whiteSpace:'nowrap',lineHeight:1,overflow:'hidden',padding:'0 0 .1em'});
const lockWord=el('span','',lockTxt,'CHRO-MA-SMITH');css(lockWord,{display:'inline-block'});
let LOCK; // {x0, base, red:[cx,cy]}
function drawLock(t,build){ // build: 0 = packed (only the square), 1 = full lockup
 show(lockBack,true);show(lockTxt,true);const k=LKk,{x0,base}=LOCK;
 const bo=kE(seg(build,0,.35));css(lockBack,{left:x0-15*k-40*(1-bo)+'px',top:base-45*k-11*k+'px',width:48*k+'px',height:44*k+'px',opacity:bo});
 css(lockTxt,{left:x0+LK.sq+LK.gap+'px',top:base-LK.size*.79+'px'});
 const p=kE(seg(build,.3,.8));lockWord.style.transform=`translateX(${(1-p)*-105}%)`}

/* ======== the hero square ======== */
const sq=el('div','sq',null,PRISM());const sqPrism=sq.firstChild;
function drawSq(x,y,s,o={}){show(sq,true);const h=s*(1+(45/43-1)*(o.prism||0));
 css(sq,{width:s+'px',height:h+'px',background:o.col||RED,opacity:o.op==null?1:o.op,transform:`translate(${x-s/2}px,${y-h/2}px) rotate(${o.rot||0}deg) scale(${o.sx||1},${o.sy||1})`});sqPrism.style.opacity=o.prism||0}
const greyCol=g=>`rgb(${lerp(255,150,g)|0},${lerp(59,146,g)|0},${lerp(31,140,g)|0})`;
// a hop between two points: arc, stretch in flight, squash on landing
function hop(t,t0,t1,from,to,h,s0,s1){const p=seg(t,t0,t1),e=ioE(p);const x=lerp(from[0],to[0],e),y=lerp(from[1],to[1],e)-4*h*p*(1-p);
 let sx=1,sy=1;if(p>0&&p<1){const st=.2*Math.sin(Math.PI*p);sy=1+st;sx=1-st*.6}
 const d=t-t1;if(d>=0&&d<1){const q=.22*Math.exp(-d*8)*Math.cos(d*24);sy-=q;sx+=q}
 return{x,y,s:lerp(s0,s1,e),sx,sy}}

/* ======== A: hook window ======== */
const HOOK=[['look_trix_400_polymax_grade_3','TRI-X 400'],['look_vision3_500t_2383','VISION3 500T'],['look_velvia_50_ilfochrome_m','VELVIA 50'],['look_eterna_bleach_bypass_composed','BLEACH BYPASS']];

 const o={w,rc:w.querySelector('.rc'),st:w.querySelector('.st'),bar:w.querySelector('.bar b'),ph:w.querySelector('.ph')};OW.push(o);return o}
{const o=owWin(0,'RAW Converter');o.rc.innerHTML=['IMG_0412.RW2','IMG_0413.RW2','IMG_0414.RW2','IMG_0415.RW2','IMG_0416.RW2'].map((f,i)=>`<div class="rw"><span>${f}</span><span style="color:#8d897f">${i?'waiting':'→ TIFF'}</span></div>`).join('')}

 o.tiles=[];for(let r=0;r<4;r++)for(let c=0;c<6;c++){const tl=el('div','tile',o.ph);css(tl,{left:c*100+'px',top:r*100+'px',width:'100px',height:'100px'});o.tiles.push(tl)}
 o.spin=el('div','spin',o.w);css(o.spin,{left:'30px',top:'530px'})}
{const o=owWin(3,'Exporter');o.rc.innerHTML=['IMG_0412.jpg','IMG_0413.jpg','IMG_0414.jpg','IMG_0415.jpg','IMG_0416.jpg'].map((f,i)=>`<div class="rw"><span>${f}</span><span style="color:#8d897f">${i<2?'done':i===2?'…':''}</span></div>`).join('')}
const OW_STATUS=['Converting 1 of 12 · 4 min left','Saving as TIFF · 148 MB…','Rendering preview…','Exporting 3 of 12…'];
OW.forEach((o,i)=>{o.st.textContent=OW_STATUS[i];if(i===2)o.st.style.paddingLeft='50px'});

app.innerHTML=`<div class="top"><div class="wm">CHRO-MA-SMITH</div><div class="nav">gallery<em>studio</em></div><div id="exportBtn">Export</div></div>
<div id="viewer"><div id="photo"><img id="pA"><img id="pB"></div></div><div id="panel"></div><div id="rail"></div>`;
const AX=150,AY=170,APPk=16/43;
{const top=app.querySelector('.top'),k=APPk,b0=el('div','abs',top);css(b0,{left:26-15*k+'px',top:43-45*k-11*k+'px',width:48*k+'px',height:44*k+'px',background:'#f2f0ea'});
