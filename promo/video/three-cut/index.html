<script type="module">
import * as THREE from 'three';

const W=1920,H=1080,FPS=24,DUR=45;
const SUB=+(new URLSearchParams(location.search).get('sub')||8),SHUTTER=.5/FPS;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,u)=>a+(b-a)*u;
const sm=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, eo=u=>1-Math.pow(1-u,3), eo5=u=>1-Math.pow(1-u,5);
const ring=(t,at,amp,k=7,w=22)=>t<at?0:amp*Math.exp(-k*(t-at))*Math.cos(w*(t-at));
const bump=(t,a,b)=>t<a||t>b?0:Math.sin(Math.PI*(t-a)/(b-a));
const keys=(t,k)=>{if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++)if(t<=k[i][0]){const u=eio(clamp((t-k[i-1][0])/(k[i][0]-k[i-1][0])));return Array.isArray(k[i][1])?k[i][1].map((v,j)=>lerp(k[i-1][1][j],v,u)):lerp(k[i-1][1],k[i][1],u)}return k[k.length-1][1]};
const col=(hex)=>new THREE.Color(hex);
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.toneMapping=THREE.NoToneMapping;renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.3;
const camera=new THREE.PerspectiveCamera(32,W/H,.1,200);
scene.fog=new THREE.Fog(0xe9e4da,26,70);

// ---------- textures ----------
const IM={};
const names=['beach1','beach2','beach3','beach4','beach5','beach6','studio1','studio2','studio3','studio4','studio5'];
for(let i=1;i<=24;i++)names.push('lib'+String(i).padStart(2,'0'));
await Promise.all(names.map(async n=>IM[n]=await loadImg(`tex/${n}.webp`)));
await document.fonts.load('700 64px Gramatika');await document.fonts.load('400 26px Gramatika');
const texOf=(c)=>{const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
const canvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

// ---------- world ----------
const PAPER=0xe9e4da;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,200),new THREE.MeshStandardMaterial({color:PAPER,roughness:.92}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// a far backdrop wall so the horizon reads as a seamless studio cyc
const slab=(w,h,d,mats)=>{const m=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,Math.min(.03,d/3)),mats);m.castShadow=m.receiveShadow=true;scene.add(m);return m};
const faceMats=(front,side=0xdedad2,{basic=false,rough=.5}={})=>{
 const s=new THREE.MeshStandardMaterial({color:side,roughness:.55});
 const f=basic?new THREE.MeshBasicMaterial({map:front,toneMapped:false}):new THREE.MeshStandardMaterial({map:front,roughness:rough});
 return [s,s,s,s,f,s];
};
const plane=(w,h,mat)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);scene.add(m);return m};

// logo (two lockups: opening and closing)
const gradCanvas=(()=>{const c=canvas(430,450),g=c.getContext('2d');g.scale(10,10);g.fillStyle='#ff3b1f';g.fillRect(0,0,43,45);
 const g1=g.createRadialGradient(33,0,0,33,0,41.25);g1.addColorStop(0,'#fff1e0');g1.addColorStop(.35,'#ff6a3a');g1.addColorStop(.7,'#b0200e');g1.addColorStop(1,'#7a1208');
 const g2=g.createRadialGradient(33,0,0,33,0,41.25);g2.addColorStop(0,'#fff1e0');g2.addColorStop(.4,'#ff7a4c');g2.addColorStop(1,'#ff2a10');
 g.fillStyle=g1;g.beginPath();g.moveTo(0,0);g.lineTo(33,0);g.lineTo(0,33);g.fill();g.fillStyle=g2;g.beginPath();g.moveTo(33,0);g.lineTo(33,33);g.lineTo(0,33);g.fill();return c})();
const wordCanvas=(()=>{const c=canvas(2400,360),g=c.getContext('2d');g.fillStyle='#111';g.font='700 250px Gramatika';g.textBaseline='alphabetic';
 g.save();g.translate(0,0);const txt='CHRO-MA-SMITH';let x=10;for(const ch of txt){g.fillText(ch,x,270);x+=g.measureText(ch).width-250*.035}g.restore();return c})();
const LOGO=[0,80].map(x0=>{
 const ink=slab(2.4,2.2,.22,new THREE.MeshPhysicalMaterial({color:0x111111,roughness:.38,clearcoat:.6,clearcoatRoughness:.2}));

 return {x0,ink,word,home:new THREE.Vector3(x0+.375,.05,.22)};
});

// the hero: a bevelled red block with clearcoat
const heroMat=new THREE.MeshPhysicalMaterial({color:0xff3b1f,roughness:.32,clearcoat:1,clearcoatRoughness:.12});
const hero=new THREE.Mesh(new RoundedBoxGeometry(1,1,1,4,.06),heroMat);hero.castShadow=true;scene.add(hero);
const decal=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:texOf(gradCanvas),transparent:true,toneMapped:false}));
decal.position.z=.502;hero.add(decal);

// the photo, standing as a print
const PH={x:9.5,w:4.2,h:2.8};
const photoPrint=slab(PH.w,PH.h,.08,faceMats((()=>{const t=new THREE.TextureLoader().load('tex/beach1.webp');t.colorSpace=THREE.SRGBColorSpace;return t})(),0xf3f0ea,{rough:.6}));
photoPrint.position.set(PH.x,PH.h/2+.35,0);photoPrint.rotation.y=-.12;
const easel=slab(.5,.35,.6,new THREE.MeshStandardMaterial({color:0xcfc8bb,roughness:.7}));easel.position.set(PH.x,.175,-.1);

// the old way: four generic apps, further apart each time
const OLD=[{x:17,n:'Import',a:'App 1',c:'#7b8794'},{x:26.5,n:'Edit',a:'App 2',c:'#7f8b7d'},{x:37,n:'Grain plug-in',a:'App 3',c:'#8a7f8c'},{x:48.5,n:'Export',a:'App 4',c:'#8c8471'}];
OLD.forEach((o,i)=>{
 const c=canvas(1080,720),g=c.getContext('2d');g.fillStyle='#e4e6e8';g.fillRect(0,0,1080,720);
 g.fillStyle=o.c;g.fillRect(0,0,1080,92);g.fillStyle='rgba(255,255,255,.55)';for(let k=0;k<3;k++)g.fillRect(34+k*34,36,20,20);
 g.fillStyle='#fff';g.font='700 46px Gramatika';g.fillText(o.n,160,62);g.font='400 30px Gramatika';g.globalAlpha=.75;g.fillText(o.a,900,60);g.globalAlpha=1;
 g.fillStyle='#c9ced3';
 if(i===0){for(let k=0;k<10;k++)g.fillRect(60+(k%5)*196,140+Math.floor(k/5)*150,172,120);g.fillRect(60,560,960,22);g.fillStyle=o.c;g.fillRect(60,560,180,22);g.fillStyle='#8a9097';g.font='400 30px Gramatika';g.fillText('Importing 214 photos…',60,530)}
 if(i===1){['Exposure','Contrast','Highlights','Shadows','Colour'].forEach((l,k)=>{g.fillStyle='#7f8b7d';g.font='400 28px Gramatika';g.fillText(l,60,160+k*100);g.fillStyle='#c9ced3';g.fillRect(60,180+k*100,420,5);g.fillStyle='#7f8b7d';g.fillRect(60+((k*137)%380),170+k*100,14,24)});g.fillStyle='#cdd3cc';g.fillRect(560,140,460,500)}
 if(i===2){g.fillStyle='#d6cfd8';g.fillRect(560,140,460,500);for(let k=0;k<2600;k++){g.fillStyle=`rgba(80,60,90,${(k%7)/40})`;g.fillRect(560+(k*397)%460,140+(k*211)%500,3,3)}['Size','Roughness','Amount'].forEach((l,k)=>{g.fillStyle='#8a7f8c';g.font='400 28px Gramatika';g.fillText(l,60,190+k*120);g.fillStyle='#c9ced3';g.fillRect(60,210+k*120,420,5)})}
 if(i===3){g.fillStyle='#8c8471';g.font='400 40px Gramatika';g.fillText('Export failed. Retrying…',200,330);g.fillStyle='#d9d3c5';g.fillRect(200,380,680,24);g.fillStyle='#b35b45';g.fillRect(200,380,90,24)}
 const m=slab(3.6,2.4,.1,faceMats(texOf(c),0xd7d9db,{rough:.7}));m.position.set(o.x,1.2+.35,0);m.rotation.y=(i%2?.1:-.1);o.mesh=m;
 const st=slab(.5,.35,.6,new THREE.MeshStandardMaterial({color:0xc6c9cc,roughness:.7}));st.position.set(o.x,.175,-.1);
});

// Chromasmith: the app rises out of the floor; panels swap as the square works
const APP={x:61,w:8,h:4.444};
const appC=canvas(2000,1111),appG=appC.getContext('2d'),appTex=texOf(appC);
const app=slab(APP.w,APP.h,.18,faceMats(appTex,0x1a1a1a,{basic:true}));
const photoC=canvas(1600,1096),photoG=photoC.getContext('2d'),photoTex=texOf(photoC);
// photo rect inside the studio screenshot: x 292..1422, y 183..957 of 2000x1111
const PR={u:(292+1422)/2/2000-.5,v:.5-(183+957)/2/1111,w:(1422-292)/2000,h:(957-183)/1111};
const appPhoto=new THREE.Mesh(new THREE.PlaneGeometry(APP.w*PR.w,APP.h*PR.h),new THREE.MeshBasicMaterial({map:photoTex,toneMapped:false}));
scene.add(appPhoto);
const grainC=canvas(512,512),grainG=grainC.getContext('2d'),grainTex=texOf(grainC);grainTex.wrapS=grainTex.wrapT=THREE.RepeatWrapping;grainTex.repeat.set(4,3);
const grain=new THREE.Mesh(new THREE.PlaneGeometry(APP.w*PR.w,APP.h*PR.h),new THREE.MeshBasicMaterial({map:grainTex,transparent:true,opacity:0,toneMapped:false,blending:THREE.NormalBlending}));scene.add(grain);

// the library: real gallery cards that fly out into two wings around the app
const cards=[];for(let i=0;i<24;i++){const t=new THREE.Texture(IM['lib'+String(i+1).padStart(2,'0')]);t.colorSpace=THREE.SRGBColorSpace;t.needsUpdate=true;
 const m=new THREE.Mesh(new RoundedBoxGeometry(1.5,1.03,.04,2,.01),[0,1,2,3,4,5].map(k=>k===4?new THREE.MeshBasicMaterial({map:t,toneMapped:false}):new THREE.MeshStandardMaterial({color:0xf3f0ea})));
 m.castShadow=true;scene.add(m);const side=i<12?-1:1,k=i%12,cx=k%4,cy=Math.floor(k/4);
 cards.push({m,to:new THREE.Vector3(APP.x+side*(5.6+cx*1.62),.95+cy*1.18,-.6-cx*.55),ry:-side*(.28+cx*.1),delay:i*.035})}

// lights
const hemi=new THREE.HemisphereLight(0xffffff,0xd8d0c4,.9);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff3e4,2.4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-12,right:12,top:10,bottom:-6,near:1,far:60});key.shadow.bias=-.0003;key.shadow.normalBias=.02;key.shadow.radius=6;
scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0xbfd6ff,1.2);scene.add(rim,rim.target);
const sweep=new THREE.SpotLight(0xffffff,0,30,.35,.8,1);scene.add(sweep,sweep.target);

// landing dust
const DN=36,dustGeo=new THREE.BufferGeometry(),dustArr=new Float32Array(DN*8*3);dustGeo.setAttribute('position',new THREE.BufferAttribute(dustArr,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0x8d877c,size:.05,transparent:true,opacity:.7,depthWrite:false}));scene.add(dust);

// ---------- the square's journey ----------
// each hop: [takeoff, land, x, y, z, arc height, size]
const L0=LOGO[0].home,L1=LOGO[1].home,topOf=o=>1.2+.35+1.2;
const appTop=()=>APP.h+.02;
const HOPS=[
 [1.7,2.6, PH.x+1.2,PH.h+.35,0, 2.2, .62],
 [4.3,4.9, PH.x+.2,PH.h+.35,0, .7, .62],
 [5.9,7.0, OLD[0].x+1,topOf(),0, 2.6, .6],
 [8.9,9.9, OLD[1].x+1.1,topOf(),0, 2.2, .52],
 [11.4,12.5, OLD[2].x+1.1,topOf(),0, 1.8, .46],
 [14.0,15.3, OLD[3].x+1.1,topOf(),0, 1.4, .42],
 [15.9,16.2, OLD[3].x+.7,topOf(),0, .3, .42],
 [16.5,16.8, OLD[3].x+.3,topOf(),0, .25, .42],
 [17.2,18.0, OLD[3].x+3.2,0,1.2, .4, .42],      // falls off
 [20.0,21.4, APP.x+3.2,appTop(),0, 3.5, .62],   // snaps up onto the app
 [24.0,24.4, APP.x+2.4,appTop(),0, .6, .62],    // Look
 [26.6,27.0, APP.x+1.5,appTop(),0, .6, .62],    // Light
 [29.2,29.6, APP.x+.6,appTop(),0, .6, .62],     // Colour
 [31.8,32.2, APP.x-.4,appTop(),0, .6, .62],     // Texture
 [34.4,34.8, APP.x-1.4,appTop(),0, .6, .62],    // Output
 [37.0,37.5, APP.x-2.6,appTop(),0, .8, .62],    // Library
 [40.4,43.0, L1.x,L1.y,L1.z, 5.0, 1],           // home
];
const LANDS=HOPS.map(h=>h[1]);
function heroState(t){
 let p=L0.clone(),size=0,from=L0.clone(),fromSize=0,flat=0;
 const s={pos:L0.clone(),sx:2.15,sy:2.25,sz:.22,rot:0,grey:0,grad:1,q:0};
 if(t<HOPS[0][0]){s.q=-.1*bump(t,1.45,1.7);s.rot=.05*Math.sin((t-.9)*16)*bump(t,.9,1.3);return s}
 let prev={x:L0.x,y:L0.y,z:L0.z,size:-1};
 for(let i=0;i<HOPS.length;i++){
  const [a,b,x,y,z,h,sz]=HOPS[i];
  if(t<a){break}
  const u=clamp((t-a)/(b-a)),k=eio(u);
  const px=lerp(prev.x,x,k),pz=lerp(prev.z,z,k),py=lerp(prev.y,y,u)+h*Math.sin(Math.PI*u);
  s.pos.set(px,py,pz);
  const fs=prev.size<0?null:prev.size, ts=i===HOPS.length-1?null:sz;
  if(fs===null&&ts!==null){s.sx=lerp(2.15,ts,eo(Math.min(1,u*2)));s.sy=lerp(2.25,ts,eo(Math.min(1,u*2)));s.sz=lerp(.22,ts,eo(Math.min(1,u*2)))}
  else if(ts===null){s.sx=lerp(fs,2.15,eio(u));s.sy=lerp(fs,2.25,eio(u));s.sz=lerp(fs,.22,eio(u))}
  else{s.sx=s.sy=s.sz=lerp(fs,ts,k)}
  s.rot=(x>prev.x?-1:1)*.35*Math.sin(Math.PI*u)*(i===HOPS.length-1?.4:1);
  s.q=.16*bump(t,a-.12,a)*-1+(u<1?.18*Math.sin(Math.PI*u)*(1-u):0)+ring(t,b,-.22,9,26);
  prev={x,y,z,size:sz};
 }
 // old way: it greys out; the fall leaves it flat; the snap restores it
 s.grey=sm(6,17,t)*(1-sm(19.6,19.75,t));
 if(t>18&&t<19.6){s.sy*=.25;s.sx*=1.6}
 if(t>=19.6&&t<20){const g=eo(clamp((t-19.6)/.12));s.sy=lerp(s.sy*.25,s.sy,g);s.sx=lerp(s.sx*1.6,s.sx,g);s.q+=ring(t,19.72,.3,8,30)}
 s.q+=-.1*bump(t,18.85,19.05);  // heartbeat twitch
 s.grad=t<HOPS[0][0]+.3?1-sm(1.7,2.0,t):sm(42.2,43,t);
 if(t>=43)s.q=ring(t,43,-.18,8,24);
 return s;
}

// ---------- camera: a smooth follow with a little lead, never cuts ----------
const SECT=[ // t, [distance, height, azimuth deg, look-ahead x]
 [0,[12.5,1.2,8,2.4]],[1.6,[12,1.2,6,1.6]],[2.6,[12,1.8,-6,1]],[5.5,[13,2.4,-14,1.2]],[7,[15,3,-28,2.2]],[16,[15,3,-22,1.2]],[18.2,[9,1.2,-8,0]],
 [19.8,[12,2.6,-4,0]],[22,[12.5,2.4,6,0]],[24,[10.5,1.6,8,0]],[31.6,[9.4,1.4,4,0]],[33,[7.6,1,2,0]],[34.3,[10.5,1.6,-6,0]],[37,[19,3,-4,0]],[39.8,[20,3.4,6,1.5]],[43,[13,1.4,14,0]],[45,[12.2,1.3,17,0]]];
const ANCH=[[0,0],[19.8,0],[23.4,1],[39.8,1],[41.2,0]];      // 1 = frame the app instead of the square
const APPCAM=[[22,[0,.2,12.5,6]],[24.2,[1.5,1.1,8.2,16]],[26.4,[1.5,1.1,8.2,16]],[26.9,[2.3,1.3,7.2,-12]],[29,[2.3,1.3,7.2,-12]],[29.5,[2.4,.7,8,12]],[31.6,[2.4,.7,8,12]],[32.2,[-.6,0,4.3,3]],[34.2,[-.6,0,4.0,-3]],[34.8,[-.3,0,9,-8]],[36.8,[-.3,0,9.5,-6]],[37.6,[0,.6,19,-4]],[39.8,[0,.8,20,6]]];
function rawCam(t){
 // weighted lag over the last 0.6 s of the square's path
 const c=new THREE.Vector3();let n=0;for(let k=0;k<9;k++){const w=Math.sin(Math.PI*(k+1)/10),p=heroState(clamp(t-k*.1+.4,0,DUR)).pos;/* centred window: lags a little, leads a little */c.addScaledVector(p,w);n+=w}c.multiplyScalar(1/n);
 const [d,hh,az,ahead]=keys(t,SECT);const aw=keys(t,ANCH);
 const [ox,oy,ad,aaz]=keys(t,APPCAM);
 const tgt=new THREE.Vector3(lerp(c.x+ahead,APP.x+ox,aw),lerp(c.y*.55+.9,APP.h*.5+oy,aw),lerp(c.z,0,aw));
 const D=lerp(d,ad,aw),A=lerp(az,aaz,aw),HH=lerp(hh,.6+ad*.08,aw);
 const a=THREE.MathUtils.degToRad(A+1.5*Math.sin(t*.37));
 return {pos:new THREE.Vector3(tgt.x+D*Math.sin(a),tgt.y+HH,tgt.z+D*Math.cos(a)),tgt};
}
// the camera's own path is averaged over ~1.6 s, so it glides and can never whip
function camAt(t){
 const P=new THREE.Vector3(),T=new THREE.Vector3();let n=0;
 for(let k=-8;k<=8;k++){const w=Math.exp(-(k*k)/22),c=rawCam(clamp(t+k*.1,0,DUR));P.addScaledVector(c.pos,w);T.addScaledVector(c.tgt,w);n+=w}
 P.multiplyScalar(1/n);T.multiplyScalar(1/n);camera.position.copy(P);camera.lookAt(T);camera.updateMatrixWorld();return T;
}

// ---------- the app's content per beat ----------
const BEATS=[{t:24.4,p:'studio1'},{t:27,p:'studio2'},{t:29.6,p:'studio3'},{t:32.2,p:'studio4'},{t:34.8,p:'studio5'}];
let lastAppKey='';
function drawApp(t){
 let i=-1;for(let k=0;k<BEATS.length;k++)if(t>=BEATS[k].t)i=k;
 const cur=i<0?'studio1':BEATS[i].p,prev=i<=0?'studio1':BEATS[i-1].p,f=i<0?1:clamp((t-BEATS[i].t)/.25);
 const key=cur+prev+f.toFixed(2);if(key!==lastAppKey){lastAppKey=key;appG.globalAlpha=1;appG.drawImage(IM[prev],0,0,2000,1111);appG.globalAlpha=f;appG.drawImage(IM[cur],0,0,2000,1111);appG.globalAlpha=1;appTex.needsUpdate=true}
 // the photo: raw -> four real looks -> the chosen look, then a border for Output
 const looks=[[24.5,'beach2'],[25.1,'beach3'],[25.7,'beach4'],[26.3,'beach5']];
 let a='beach1',b='beach1',m=0;
 for(let k=0;k<looks.length;k++)if(t>=looks[k][0]){a=k?looks[k-1][1]:'beach1';b=looks[k][1];m=clamp((t-looks[k][0])/.22)}
 const light=sm(27.1,28,t)*(1-sm(29.4,29.6,t)), colour=sm(29.7,30.6,t);

 // mood: warm studio -> cooler, dimmer old way -> dark low point -> warm again
 const cool=sm(6,15,t)*(1-sm(19.6,21,t)),dark=sm(17.6,18.2,t)*(1-sm(19.55,20.3,t));
