<!-- Boot splash — Swiss v2 (design/prototypes/splash-v2/index.html): cover photo on a white mat,
     glow prism mark beside the wordmark, and an 11-step wedge as the progress bar (last step
     vermilion). A compact card, not a full-window cover, so the desktop stays visible around it; on
     desktop the window ignores the mouse while it's up, so clicks around it reach the desktop.
     The photo is an inline data URI so it paints in the same frame as the card (a file URL here only
     starts loading once the parser reaches this point, 17MB into the page). Static markup + inline
     styles so the FIRST paint is the final design. #boot-splash-bar/-progress stay (hidden) because
     the progress JS and library-ui.js write to them. -->
<style id="boot-splash-style">
  #boot-splash{position:fixed;inset:0;z-index:var(--z-splash);display:flex;align-items:center;justify-content:center;background:transparent;pointer-events:none;
    --u:min(calc(54vw / 720),calc(60vh / 500));font-family:'Gramatika',system-ui,sans-serif;color:#f2f0ea}
  #boot-splash .bs{position:relative;width:calc(720*var(--u));height:calc(500*var(--u));overflow:hidden;background:#141414;transition:opacity .45s ease-out,transform .55s cubic-bezier(.2,.7,.2,1)}
  #boot-splash.out .bs{opacity:0;transform:scale(1.035)}
  #boot-splash .bs>*{position:absolute}
  #boot-splash .ph{left:calc(194.5*var(--u));top:calc(42*var(--u));width:calc(331*var(--u));height:calc(225*var(--u));background:#fff;padding:calc(7*var(--u));box-sizing:border-box}
  #boot-splash .ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%;filter:grayscale(1) contrast(1.1)}
  #boot-splash .cr{right:calc(194.5*var(--u));top:calc(275*var(--u));font-size:calc(9.5*var(--u));font-style:italic;color:#8d8b85;white-space:nowrap}
  #boot-splash .br{left:0;right:0;top:calc(304*var(--u));display:flex;justify-content:center;align-items:center;gap:calc(13*var(--u));font-weight:700;font-size:calc(39*var(--u));line-height:1;letter-spacing:.02em;white-space:nowrap}
  #boot-splash .br svg{width:calc(45*var(--u));height:calc(45*var(--u));flex:none;margin:calc(-4*var(--u))}
  #boot-splash .wg{left:calc(158*var(--u));right:calc(158*var(--u));top:calc(378*var(--u));height:calc(19*var(--u));display:grid;grid-template-columns:repeat(11,1fr)}
  #boot-splash .wg i{background:#1d1d1d;border-right:1px solid #141414;transition:background .35s}
  #boot-splash .lb,#boot-splash .pc{top:calc(410*var(--u));font-size:calc(13*var(--u));line-height:1}
  #boot-splash .lb{left:calc(158*var(--u));color:#8d8b85}
  #boot-splash .pc{right:calc(158*var(--u));font-variant-numeric:tabular-nums}
  #boot-splash .ver{left:0;right:0;top:calc(440*var(--u));text-align:center;font-size:max(11px,calc(13*var(--u)));color:#8d8b85;font-variant-numeric:tabular-nums}
  #boot-splash .bs{pointer-events:auto}
  #boot-splash-progress{display:none}
  /* Splash → app: the app fades up from the desktop while the card eases out (hideBootSplash). */
  html.cs-reveal-hold body>*:not(#boot-splash){opacity:0!important}
  html.cs-reveal-hold,html.cs-reveal-hold body{background:transparent!important}
  html.cs-reveal-go,html.cs-reveal-go body{transition:background-color .5s ease-out}
  html.cs-reveal-go body>*:not(#boot-splash){transition:opacity .5s ease-out}
  @media (prefers-reduced-motion:reduce){#boot-splash .bs{transition:opacity .2s}#boot-splash.out .bs{transform:none}}
</style>
