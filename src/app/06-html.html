body.sk2.deskx #fx-deskbar #fx-deskbar-title #btn-flag-red{margin-left:2px!important} /* 6px cluster gap + 2 = the Gallery's 8px */
/* Zoom cluster: was bare 18px text controls with no button affordance at all. */
.zc-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}
body.deskx .fx-zoom-ctrl{position:static;background:transparent;border:none;padding:0;gap:1px}
body.deskx .fx-zoom-ctrl button:not(.flag-btn){height:28px;min-width:28px;font-size:var(--fs-1);font-weight:500;padding:0 var(--sp-2);white-space:nowrap;flex:0 0 auto}
body.deskx .fx-zoom-ctrl .flag-btn{width:32px;height:32px;min-width:32px;padding:0}
/* Library-style minus/slider/plus: the two step buttons are icon-only, so they get the tight
   .zc-ic footprint instead of the 0 9px text padding every other zoom-ctrl button uses. */
body.deskx .fx-zoom-ctrl #btn-zoom-out,body.deskx .fx-zoom-ctrl #btn-zoom-in{padding:0;min-width:28px}
body.deskx #fx-zoom-slider{width:80px;flex:0 0 80px;order:0;margin-top:0}
/* 2026-09-09: 1:1 view, editor background colour and the scope-overlay toggle moved OFF the
   always-visible desktop bar and into the settings menu's View section (viewMenuBuild()) —
   occasional preview-quality toggles, not everyday actions. Hidden here rather than deleted from
   the HTML: #fx-zoom-ctrl/#fx-preview-tools are the SAME nodes relocatePreviewTools() moves onto
   the floating over-canvas spot in web/mobile mode, so deleting would remove them there too —
   this selector only fires under body.deskx.
   2026-09-10: Full resolution (#btn-fx-fullres) un-hidden and moved back OUT of this list —
   relocatePreviewTools() now parks it in the LEFT cluster next to Show original instead,
   matching the wireframe's left-cluster pair. It was removed from the always-visible bar
   entirely in 6627253, which overcorrected: the wireframe (Editor (Developer) View.dc.html's
   .tb-left) always showed it as a standing icon, not a menu row. */
body.deskx #btn-loupe,body.deskx #btn-editor-bg,body.deskx #btn-hist{display:none!important}
/* 2026-09-09: split-view + edit/export history move off the always-visible bar too, into the
   settings menu's Compare/History sections (settingsSplitBuild()/settingsHistoryBuild(), built
   from the exact same code the web/mobile floating popovers use — see _fxSplitListInto()/
   _fxTimelineListInto()'s own comments). Both topbar history triggers fold: btn-export-history
   (next to Undo/Redo) AND btn-history (inside the preview-tools cluster) are the SAME popover
   today (already unified 2026-09-09 per the comment above fxTimelineScrub()) — removing both
   from the bar loses no distinct feature, and the hold-Undo gesture (fxUndoMousedown, see
   btn-undo-db's own title) still reaches edit history in one motion without opening any menu.
   Hidden, not deleted, for the same shared-DOM-node reason as the zoom-cluster rules above. */
body.deskx #btn-fx-ref,body.deskx #btn-split,body.deskx #btn-split-menu,body.deskx #db-history-wrap,body.deskx #btn-history{display:none!important}
/* 2026-09-09: width-driven responsive fold, cheapest-first — All FX loses its label before
   Export does, both fold to icon-only (not hidden — they're the two most-used actions in the
   bar) rather than the title/flags/zoom ever having to give up space. Driven by a ResizeObserver
   on #fx-deskbar itself (see the IIFE next to the existing --deskbar-h one) rather than a plain
   @media query, since the bar's available width depends on the tool-rail/panel split too, not
   just the window. */
body.deskx.fx-deskbar-tight1 .js-allfx .fx-db-lb{display:none}
body.deskx.fx-deskbar-tight1 .js-allfx{padding:0;width:28px}
body.deskx.fx-deskbar-tight2 #btn-export-db .fx-db-lb{display:none}
body.deskx.fx-deskbar-tight2 #btn-export-db{padding:0;width:28px}
body.sk2.deskx.fx-deskbar-fold1 #fx-deskbar #fx-deskbar-title #db-title-status{display:none!important}
#fx-page-title{display:none}
/* Phones have no Gallery (desktop-only), so no gallery|studio switch. */
body.mobile-fx #cs-brand-tog,html.mobile-fx #cs-brand-tog{display:none!important}
body.deskx.cs-page-other #fx-page-title{display:flex;align-items:center;gap:16px;grid-column:2;grid-row:1;justify-self:center;white-space:nowrap;font-size:14px;color:var(--k-color-ink)}
body.deskx.cs-page-other #fx-page-title .fx-page-back{background:none;border:0;color:var(--k-color-muted);font:inherit;font-size:12px;cursor:pointer;padding:4px 0}
body.deskx.cs-page-other #fx-page-title .fx-page-back:hover{color:var(--k-color-ink)}
body.deskx.cs-page-other #fx-deskbar #fx-deskbar-left,body.sk2.deskx.cs-page-other #fx-deskbar #fx-deskbar-title,body.deskx.cs-page-other #fx-deskbar #fx-deskbar-right>:not(#fx-settings),body.deskx.cs-page-other #fx-deskbar #btn-fx-fullres,body.deskx.cs-page-other #fx-deskbar #btn-before{display:none!important}
body.deskx.cs-page-other #cs-tog-studio.on{opacity:.55}
/* At laptop widths, keep the logo mark and Gallery/Studio switch but drop the wordmark; fit() then
   measures the compact brand so the deskbar can retain the photo identity and zoom controls. */
@media(max-width:1400px){body.sk2.deskx #cs-brand-name .cs-bn-t{display:none}}
body.sk2.deskx.fx-deskbar-fold2 #fx-deskbar #fx-deskbar-title #db-title-name{display:none!important}
body.sk2.deskx.fx-deskbar-fold3 #fx-deskbar #fx-deskbar-tools #fx-zoom-slider{width:48px!important;flex-basis:48px!important}
body.sk2.deskx.fx-deskbar-fold4 #fx-deskbar #fx-deskbar-tools #fx-zoom-slider,body.sk2.deskx.fx-deskbar-fold4 #btn-fx-fullres{display:none!important}
/* Last fold (below the ~760px design floor): drop the flag/favourite buttons rather than let them run into All FX — P/X/F keys and the filmstrip still set them. */
body.sk2.deskx.fx-deskbar-fold5 #fx-deskbar #btn-flag-red,body.sk2.deskx.fx-deskbar-fold5 #fx-deskbar #btn-flag-green,body.sk2.deskx.fx-deskbar-fold5 #fx-deskbar #btn-favorite{display:none!important}
body.fx-deskb .fx-layout{grid-template-columns:auto 360px 1fr}
body.fx-deskb #fx-toolrail{display:flex;flex-direction:column;gap:3px;position:sticky;top:calc(var(--deskbar-h, 58px) + 16px);align-self:start;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:6px}
.fx-rail-btn{display:flex;align-items:center;gap:var(--sp-2);width:120px;background:none;border:none;border-radius:var(--r-sm);color:var(--mut);cursor:pointer;font-family:var(--sans);font-size:var(--fs-2);font-weight:500;letter-spacing:0;padding:var(--sp-2) var(--sp-2);text-align:left;transition:color var(--dur-1) var(--ease),background var(--dur-1) var(--ease)}
.fx-rail-btn:hover{background:var(--sur2);color:var(--txt)}
.fx-rail-btn.on{background:var(--tint-2);color:var(--acc)}
.fx-rail-btn .fx-rail-ic{display:inline-flex;flex-shrink:0}
.fx-rail-btn .fx-rail-lb{white-space:nowrap}
/* ⚠️ `column-count:1` is NOT the same as "not a multi-column element" — it still establishes a
   multicol formatting context, and per CSS Multicol a multicol box with a DEFINITE block-size
   fragments its overflow into EXTRA COLUMNS along the inline axis rather than overflowing
   vertically. Both single-column panels below have a definite height (max-height here,
   height:100% under deskx), so any section taller than the window used to fragment into
   off-screen columns: `scrollTop` was pinned at 0, vertical scrolling did nothing, and
   everything past the first screenful was unreachable. Measured on the Masks panel at
   1440x820: scrollWidth 937 vs clientWidth 319 — four columns, three of them invisible.
   `columns:initial` (count AND width back to auto) leaves the multicol context entirely, so the
   panel becomes an ordinary block that scrolls. The `.fx-ctrl[data-fxsec="looks"]
   {column-span:all}` rule above was an earlier per-card patch for a symptom of this same root
   cause; it is now inert here and only still applies to the 2-column web layout. */
body.fx-deskb .fx-panel{columns:initial;max-height:calc(100vh - 130px);overflow-y:auto;align-self:start;overscroll-behavior:contain}
body.fx-deskb .fx-ctrl.sec-active:last-of-type{margin-bottom:0}
/* 3.4.9: this is the rule that actually wins under deskx (body carries both .deskx and
   .fx-deskb, and this 2-class selector beats the base .looks-grid rule above) — the 198px set
   there never took effect for the real desktop layout. 2 columns here (not 3), so "fit 6 tiles"
   is 3 rows. Measured live (not estimated): tiles render 118.625px tall at this panel width,
   gap is 6px, so 3*118.625 + 2*6 = 367.875px for an exact 6-tile fit before scrolling. */
body.fx-deskb .looks-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:368px}
body.fx-deskb #fx-actionbar,body.fx-deskb #fx-secnav{display:none}
/* image always fits the viewport — no page scroll to see it */
body.fx-deskb #fx-canvas{max-height:calc(100vh - 150px)}
body.fx-deskb .fx-canvas-wrap{min-height:0}
/* enabled-section indicator on rail + strip */
.fx-rail-btn.enabled,.fx-sec-btn.enabled{color:var(--acc)}
.fx-rail-btn.enabled .fx-rail-ic,.fx-sec-btn.enabled .fx-sec-ic{color:var(--acc)}
.fx-rail-btn.enabled.on{background:var(--tint-3)}
/* All-FX buttons highlight when every effect is on */
.fx-db.js-allfx.allon{border-color:var(--acc);color:var(--acc)}
.fx-db.js-allfx.allon .fx-db-ic{color:var(--acc)}
.fx-act.js-allfx.allon .fx-act-ic,.fx-act.js-allfx.allon .fx-act-lb{color:var(--acc)}
/* zoom + compare/split/hist relocated into the desktop action bar */
#fx-deskbar-tools{display:flex;align-items:center;gap:8px}
body.fx-deskb #fx-deskbar-tools #fx-zoom-ctrl{position:static;display:flex;background:none;border:none;padding:0;gap:2px}
body.fx-deskb #fx-deskbar-tools #fx-preview-tools{position:static;display:flex;margin:0;gap:4px;flex-wrap:nowrap}
body.fx-deskb #fx-deskbar-tools .fx-mini{background:var(--sur2)}
/* ── DESKX — DRK-style desktop shell layout (body.deskx, layered ON TOP of fx-deskb).
   Applied only by the Tauri shell (desktop-native.js) or "?deskx=1" for browser testing, so
   the web/Pages/iOS builds are bit-identical without it. Geometry: one fixed 44px top bar
   (the deskbar, doubling as the window drag strip), photo edge-to-edge on black filling all
   remaining space, 320px single-section tools panel, 48px icon rail on the FAR RIGHT.
   Clicking the active rail icon closes the panel entirely (body.panel-closed). ── */
/* --deskx-topbar-h: the ONE place the 44px deskbar height is a literal — every rule below that
   needs to sit below the bar (main's own offset, the layout's height calc, and the breathing-
   room padding on the left library dock / tools panel / right rail, all added after the icons-
   too-close-to-the-bar report) reads this var instead of repeating 44px, so a future deskbar
   resize can't silently reopen the same overlap in only some of them. */
body.deskx{--deskx-topbar-h:56px;--deskbar-control-gap:12px}
body.deskx header,body.deskx #fx-filmstrip{display:none}
body.deskx main{max-width:none;margin:0;padding:var(--deskx-topbar-h) 0 0}
body.deskx.fx-deskb main{overflow:hidden;overflow:clip;height:100vh}   /* clip: not a scroll container, so focus restore on app switch cannot scroll (shift) the editor */
body.deskx:not(.fx-deskb) main{overflow-y:auto;height:100vh;padding:var(--sp-9) 24px var(--sp-11)}
/* 2026-09-10 (3.1.9/3.1.10): a real 3-column grid — Editor (Developer) View.dc.html's own
   .topbar is 1fr auto auto 1fr-ish grid, not a flex row with the title floated on top. Grid
   tracks physically cannot overlap, so this fixes the collision class rather than just today's
   specific one (see the long comment on #fx-deskbar-left/-right in the HTML for the history).
   Only overridden here, under body.deskx — #fx-deskbar-title's own base rule (above) keeps its
   position:absolute centering for the older body.fx-deskb-only flex layout, untouched. */
body.deskx #fx-deskbar{display:grid;grid-template-columns:minmax(max-content,1fr) minmax(0,240px) minmax(max-content,1fr);align-items:center;column-gap:var(--deskbar-control-gap);
  position:fixed;top:0;left:0;right:0;z-index:var(--z-overlay);height:var(--deskx-topbar-h);
  margin:0;padding:0 12px;border:none;border-radius:0;
  background:var(--glass-bg);
  /* Only the bottom edge has real width, but with border-color unset on the other three sides
     it computes to currentColor, not var(--bdr-panel) — see the identical #lib-overlay fix and
     its comment (library-ui.js). Set explicitly so getComputedStyle().borderColor is uniform. */
  border-color:transparent}
/* The 84px LEFT clearance above is for macOS's overlaid traffic-light buttons (titleBarStyle:
   Overlay, tauri.macos.conf.json) — Windows uses a native title bar (decorations:true,
   tauri.windows.conf.json) with its own min/max/close already occupying that space, so reserving
   it a second time here would just be 72px of dead padding pushing every left-cluster button
   inward for no reason. desktop-native.js adds body.mac-titlebar-overlay only under
   CS_PLATFORM.os==='macos' (and "?deskx=1" browser testing, which simulates the macOS wireframe
   this wasn't designed for anywhere else). docs/windows-port.md Phase 3 / G3's window-frame
   decision. */
body.mac-titlebar-overlay #fx-deskbar{padding-left:var(--sp-10)}
body.deskx #fx-deskbar-left{display:flex;align-items:center;gap:8px;grid-column:1;justify-self:start;min-width:0}
body.deskx #fx-deskbar-right{display:flex;align-items:center;gap:8px;grid-column:3;justify-self:end;min-width:0}
/* The title's own base rule (above #fx-deskbar-title) centers it by ABSOLUTE positioning against
   the bar — correct for the older flex layout, but that's exactly the mechanism that could
   overlap its neighbours instead of being physically kept apart from them. Under the grid, it's
   just the middle column's content: back to normal flow, centered in its own track instead. */
body.deskx #fx-deskbar-title{position:static;left:auto;top:auto;pointer-events:auto;
  grid-column:2;justify-self:center;
  box-sizing:border-box;padding:0 var(--sp-4); /* CHR-127: breathing room so the title never touches the zoom tile */
  /* 2026-09-11 (topbar parity pass, item 4): the grid's 1fr/auto/1fr split centers the title on
     the BAR's own geometric middle — it has no idea the actual photo sits further left or right,
     pushed there by the tool panel/rail (and, when Library is docked, the filmstrip). A pure-CSS
     constant offset was tried first (a calc() derived from --dock-w/--panel-w/--rail-w) and
     reverted: it's blind to how much slack #fx-deskbar-left/-right's OWN content actually needs,
     so it shifted the title straight into the zoom slider at ordinary widths — caught live by
     editor:responsive (OVERLAP, #db-title-name vs #fx-zoom-slider, 1440x900 and below). Recentering
     against the real image now happens in JS (fxSyncDeskbarTitleOffset(), near the deskbar-fold
     ResizeObserver below), which measures the left/right groups' actual rendered edges and clamps
     the shift so the title can NEVER overlap them — it only recenters as far as real slack allows,
     rather than by a fixed formula. --db-title-off defaults to 0 (dead center) until that JS runs. */
  transform:translateX(var(--db-title-off,0px));min-width:0;max-width:100%;
  /* 2026-09-10: the base rule (above) lays the filename and dimensions out side-by-side on one
     line — the wireframe stacks them (Editor (Developer) View.dc.html .fn/.meta), filename bold
     on top, capture details smaller and muted underneath. Column instead of row, both lines
     centered under the (already horizontally centered) title block. */
  flex-direction:column;align-items:center;gap:1px;text-align:center}
body.deskx #db-title-status{font-size:var(--fs-1)}
/* The full-window Library (library-ui.js's #lib-overlay.full) is a genuine takeover — its own
   top bar already reserves the same traffic-light drag space #fx-deskbar does — so this editor-
   only bar (undo/redo, the current photo's title, All FX, Export) would just be a second,
   redundant toolbar duplicating Library's own Filters/All FX/Export row underneath it. */
body.lib-full #fx-deskbar{display:none}
/* The deskbar is INSIDE #panel-fx; on other tabs that panel loses .active (display:none),
   which would take the fixed bar down with it. Keep the panel technically displayed and hide
   its editor content instead, so the top bar (and its ⋯ menu, the only way back) persists. */
body.deskx #panel-fx:not(.active){display:block}
body.deskx #panel-fx:not(.active) .fx-layout{display:none}
body.deskx .fx-db{padding:5px var(--sp-2)}
/* Grid columns are transitioned so opening/closing the panel (or the library dock resizing)
   reflows the photo smoothly instead of snapping — panel toggling is the app's most frequent
   desktop interaction, so this is worth the extra rule. renderPreview() is deliberately NOT
   called on every animation frame (too expensive); fxSection/library-ui.js fire ONE redraw via
   requestAnimationFrame after starting the transition, and the canvas's own max-width:100%;
   height:auto CSS scaling covers the visual interpolation in between. */
/* Leading dock column for the Library panel (library-ui.js's initDock() makes #lib-overlay
   the first child of .fx-layout) — --dock-w/--panel-w are the only two things that ever change
   this row's column widths, so there is exactly one grid-template-columns expression and no
   second px value anywhere that has to be kept in sync with it (the root cause of 4 previous
   "library covers the editor" regressions, which all stemmed from a SEPARATE body.paddingLeft
   value computed in JS). A reserved grid track can never visually overlap a sibling track. */
/* Declared on body.deskx too (not just .fx-layout) so #fx-deskbar — a SIBLING of .fx-layout,
   not a descendant — can read the same live --dock-w/--panel-w/--rail-w values for its own
   padding (see the #fx-deskbar title-centering comment below). Custom properties inherit down
   the DOM regardless of which selector set them, so declaring the identical values on their
   nearest common ancestor keeps this one source of truth instead of a second copy drifting. */
body.deskx{--dock-w:0px;--panel-w:var(--panel-w-user,320px);--rail-w:72px}
body.deskx .fx-layout{grid-template-columns:var(--dock-w) 1fr var(--panel-w) var(--rail-w);position:relative;
  gap:0;height:calc(100vh - var(--deskx-topbar-h));align-items:stretch;transition:grid-template-columns var(--dur-2) ease}
/* CHR-276: optional unified Gallery + Studio workspace. The preference is opt-in and adds its
   own adjustable Gallery track before the existing preview track; the user's normal dock and
   full-window Library layouts retain their original grid sizing. */
body.deskx.lib-unified-view{--unified-lib-w:var(--unified-lib-w-user,50%)}
body.deskx.lib-unified-view .fx-layout{grid-template-columns:minmax(300px,var(--unified-lib-w)) minmax(320px,1fr) var(--panel-w) var(--rail-w)}
body.deskx.lib-unified-view.lib-unified-dragging .fx-layout{transition:none!important}
body.deskx.lib-unified-view #lib-overlay{grid-column:1;grid-row:1;position:relative;inset:auto;top:auto;left:auto;bottom:auto;
  width:auto;height:100%;min-width:0;max-width:none;z-index:auto;display:grid;overflow:hidden}
body.deskx.lib-unified-view #lib-overlay #lib-top,
body.deskx.lib-unified-view #lib-overlay .lib-fullview-only{display:revert}
body.deskx.lib-unified-view #lib-overlay #lib-top{grid-column:1/3;grid-row:1}
body.deskx.lib-unified-view #lib-overlay #lib-side{grid-column:1;grid-row:2/5}
body.deskx.lib-unified-view #lib-overlay #lib-filters{grid-column:2;grid-row:2}
body.deskx.lib-unified-view #lib-overlay #lib-viewbar{grid-column:2;grid-row:3}
body.deskx.lib-unified-view #lib-overlay #lib-main{grid-column:2;grid-row:4}
body.deskx.lib-unified-view #lib-overlay #lib-bottom{grid-column:1/3;grid-row:5}
body.deskx.lib-unified-view #lib-overlay #lib-grid{grid-template-columns:repeat(auto-fill,minmax(var(--lib-thumb,140px),1fr))}
body.deskx.lib-unified-view #lib-overlay #lib-grid.aspect-view{display:flex;grid-template-columns:none}
body.deskx.lib-unified-view #lib-overlay:not(.full) .lib-stars{display:inline-flex}
body.deskx.lib-unified-view #lib-overlay:not(.full) .lib-card .lib-name{display:block}
body.deskx.lib-unified-view #lib-overlay:not(.full) .lib-tagrow{display:flex}
body.deskx.lib-unified-view #lib-overlay:not(.full) #lib-main{padding:16px}
body.deskx.lib-unified-view #lib-overlay #lib-unified-resizer[hidden]{display:none}
body.deskx.lib-unified-view #lib-overlay .lib-side-resizer{display:none}
body.deskx.lib-unified-view #lib-overlay .lib-dock-resizer{display:block;left:auto;right:0;width:8px;cursor:col-resize}
body.deskx.lib-unified-view #lib-unified-resizer{display:block;position:absolute;top:0;bottom:0;left:calc(var(--unified-lib-w) - 4px);
  width:9px;z-index:var(--z-float);cursor:col-resize;background:transparent;border:0;padding:0;touch-action:none}
body.deskx.lib-unified-view #lib-unified-resizer::after{content:'';position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--bdr-panel)}
body.deskx.lib-unified-view #lib-dock-reopen{display:none}
body.deskx.lib-unified-view.lib-dock-collapsed .fx-layout{--dock-w:var(--unified-lib-w)}
body.deskx.lib-unified-view .fx-preview-col{grid-column:2;min-width:0}
body.deskx.lib-unified-view:not(.panel-closed) .fx-panel{grid-column:3}
body.deskx.lib-unified-view #fx-toolrail{grid-column:4}
body.deskx.lib-unified-view #fx-panel-resizer{right:calc(var(--panel-w) + var(--rail-w) - 3px)}
body.deskx.lib-unified-view #fx-rail-resizer{right:calc(var(--rail-w) - 3px)}
body.deskx.lib-unified-view #fx-rail-show{right:0}
body.deskx.lib-unified-view #fx-deskbar{padding-left:calc(var(--unified-lib-w) + 16px)}
body.deskx.lib-unified-view.lib-dock-collapsed #lib-overlay{display:grid}
body.deskx.lib-unified-view.lib-dock-collapsed #lib-grid{visibility:hidden}
@media(max-width:1050px){body.deskx.lib-unified-view{--panel-w:0px;--rail-w:0px}
  body.deskx.lib-unified-view .fx-layout{grid-template-columns:minmax(280px,var(--unified-lib-w)) minmax(280px,1fr) 0 0}}
@media (prefers-reduced-motion:reduce){body.deskx.lib-unified-view .fx-layout{transition:none}}
/* Mid-drag the .2s column transition lags the pointer by a visible fifth of a second, so every
   drag reads as sluggish and overshoots. Dropped for the duration of the drag only — the class
   toggles (panel-closed, rail-icons, rail-hidden) keep their animation. */
body.deskx .fx-layout.fx-nodrag-anim{transition:none}
/* --dock-w-user: the ONLY thing library-ui.js's docked-filmstrip resizer (#lib-dock-resizer) is
   allowed to setProperty() — an indirection layer, not the token a state class assigns. Setting
   --dock-w directly here would beat this class selector on any later drag (inline style always
   wins over a class rule, same specificity trap --panel-w-user/--rail-w-user exist to avoid) and
   permanently break collapse-on-active-rail-click for this track the same way it would have for
   the others. State classes keep authority over the derived value; the user's own resize is only
   ever a fallback inside var(). */
body.deskx.lib-docked:not(.lib-full){--dock-w:var(--dock-w-user,120px)}
body.deskx.panel-closed{--panel-w:0px}
body.deskx.panel-closed .fx-panel{display:none}
/* ── Resizable tool panel + shrinkable tool rail (wireframe .tp-resizer / .rail icons-only).
   Both handles are absolutely-positioned children of .fx-layout rather than of the panel/rail
   themselves: .fx-panel is the scroll container (overflow-y:auto), so a handle inside it would
   scroll away with the content, and the rail is 44px wide in icon mode with no room to spare.
   Offsets are expressed in the SAME two vars the grid template uses, so there is still exactly
   one source of truth for these track widths (see the --dock-w comment above). ── */
/* Inert outside deskx: the handles are static markup in every layout, and on the phone shell they
   would otherwise paint as ordinary full-width 4px-tall buttons. */
.fx-edge{display:none}
body.deskx .fx-edge{display:block;position:absolute;top:0;bottom:0;width:7px;z-index:var(--z-float);cursor:col-resize;
  background:none;border:0;padding:0}
body.deskx #fx-panel-resizer{right:calc(var(--panel-w) + var(--rail-w) - 3px)}
body.deskx #fx-rail-resizer{right:calc(var(--rail-w) - 3px)}
body.deskx.panel-closed #fx-panel-resizer{display:none}
body.deskx.rail-hidden #fx-rail-resizer{display:none}
body.deskx .fx-edge::after{content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);
  width:2px;height:28px;border-radius:2px;background:transparent;transition:background var(--dur-1) var(--ease)}
body.deskx .fx-edge:hover::after,body.deskx .fx-edge:focus-visible::after{background:var(--acc)}
/* Icons-only rail: the labels go, the touch target does not — padding grows to keep each button
   at the same height, so switching modes never moves the tools under the pointer more than the
   width change itself. */
body.deskx.rail-icons{--rail-w:44px}
body.deskx.rail-icons #fx-toolrail .fx-rail-lb{display:none}
body.deskx.rail-icons #fx-toolrail .fx-rail-btn{padding:var(--sp-3) 3px}
body.deskx.rail-hidden{--rail-w:0px}
body.deskx.rail-hidden #fx-toolrail{display:none}
/* Foot of the rail: one button that narrows it a step (labels -> icons) and puts them back.
   margin-top:auto pins it to the bottom however many tools are above it. */
body.deskx #fx-rail-foot{margin-top:auto;padding-top:6px;flex:0 0 auto}
body.deskx #fx-rail-foot .fx-rail-btn{width:100%}
body.deskx.rail-icons #fx-rail-foot .fx-rail-ic{transform:scaleX(-1)}
/* Restore button for a HIDDEN rail — the panel needs no equivalent, because clicking any tool
   already reopens it; a hidden rail has no tools left to click. */
#fx-rail-show{display:none}
body.deskx.rail-hidden #fx-rail-show{position:absolute;top:8px;right:8px;z-index:var(--z-float);display:flex;
  align-items:center;justify-content:center;width:28px;height:28px;padding:0;border-radius:var(--r-sm);
  background:var(--sur2);border:1px solid var(--bdr-pill);color:var(--mut);cursor:pointer}
body.deskx.rail-hidden #fx-rail-show:hover{color:var(--txt)}
/* CHR-264: focus mode is a transient body class — no stored size is touched, so removing the class
   restores the exact prior layout. Bars, tool panel, rail, dock and filmstrip collapse; the preview
   column takes the freed grid tracks. A small exit chip keeps the way back discoverable. */
body.deskx.cs-focus{--deskx-topbar-h:0px;--panel-w:0px;--rail-w:0px}
body.deskx.cs-focus:not(.lib-full){--dock-w:0px}
body.deskx.cs-focus #fx-deskbar,body.deskx.cs-focus .fx-panel,body.deskx.cs-focus #fx-toolrail,body.deskx.cs-focus #fx-panel-resizer,body.deskx.cs-focus #fx-rail-resizer,body.deskx.cs-focus #fx-rail-show,body.deskx.cs-focus #fx-filmstrip,body.deskx.cs-focus:not(.lib-full) #lib-overlay{display:none}
#cs-focus-exit{display:none}
body.deskx.cs-focus #cs-focus-exit{display:flex;position:fixed;top:8px;right:8px;z-index:var(--z-float);align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-sm);background:var(--sur2);border:1px solid var(--bdr-pill);color:var(--mut);font:11px var(--mono);cursor:pointer;opacity:.7}
body.deskx.cs-focus #cs-focus-exit:hover,body.deskx.cs-focus #cs-focus-exit:focus-visible{opacity:1;color:var(--txt)}
/* Explicit grid-column (not just `order`, which only sequences auto-placement — it doesn't
   pin a track) on all 4 potential .fx-layout children: #lib-overlay is only actually IN the
   DOM once library-ui.js's initDock() has run — which is AFTER this layout's very first paint
   on every real launch, and NEVER in the plain browser/iOS builds. Auto-placement with only 3
   of the 4 intended items present filled tracks 1-3 (i.e. the 0px dock track, then panel's
   track, then rail's track) instead of 2-4, collapsing the actual preview column to 0 width —
   a real, confirmed bug (found by testing the ?deskx=1 browser mode, where the canvas was
   entirely blank despite a photo loading successfully). Pinning each item to its own numbered
   track makes every one of them independent of whether the other three exist in the DOM at all. */
body.deskx .fx-preview-col{grid-column:2;order:1;position:static;top:auto;align-self:stretch;height:100%;display:flex;flex-direction:column;min-width:0;min-height:0}
/* `columns:initial` + `overflow-x:hidden`: see the multicol note on body.fx-deskb .fx-panel.
   deskx sets a definite height:100%, which is exactly the condition that triggers overflow
   columns, so this panel MUST stay outside the multicol formatting context. overflow-x:hidden
   is a belt-and-braces guard — if anything ever re-introduces horizontal overflow here, it must
   surface as a clipped element the audit gate catches, never as a silent sideways scroll. */
/* padding-top 22px, not the 10px every other side gets: below the fixed deskbar, 10px read as
   flush rather than spaced (the reported "BASIC ADJUSTMENTS too close to the top bar" bug) — see
   the matching bump on #fx-toolrail below, and #lib-top in library-ui.js for the left dock. */
/* Editor (Developer) View.dc.html's .toolpanel/.rail both use --surface-tile-1 (same as the
   topbar/statusbar's --bg), not --surface-tile-2/--sur — and carry no box-shadow at all. */
body.deskx .fx-panel{grid-column:3;order:2;max-height:none;height:100%;columns:initial;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:22px var(--sp-2) var(--sp-2);box-sizing:border-box;
  background:var(--bg);box-shadow:none;
  /* See #fx-deskbar's identical comment — only the left edge has real width. */
  border-color:transparent}
body.deskx #fx-toolrail{grid-column:4;order:3;position:static;top:auto;align-self:stretch;width:var(--rail-w);box-sizing:border-box;
  border:none;border-radius:0;padding:22px 4px 4px;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:2px;background:var(--bg);box-shadow:none;
  border-color:transparent}

   Widened 64 -> 72px so the label can sit at 10px instead of 9px (the smallest text anywhere in
   the app, and the reason 14 rail items all read as one grey smear). The active item now also
   gets a 2px accent bar, so which tool is open is legible in peripheral vision rather than
   requiring a colour comparison between two dim greys. */
body.deskx .fx-rail-btn{width:100%;flex-direction:column;gap:4px;padding:6px 3px;justify-content:center;
  font-size:var(--fs-1);position:relative}
body.deskx .fx-rail-btn .fx-rail-lb{white-space:normal;text-align:center;line-height:var(--lh-tight)}
body.deskx .fx-rail-btn.on::before{content:'';position:absolute;left:-4px;top:7px;bottom:7px;width:2px;

body.deskx .fx-rail-sep{height:1px;background:var(--bdr);margin:3px var(--sp-2);flex:0 0 auto}
/* Reverted: a border/frame drawn around the PHOTO itself looked like a matte applied to the
   image (indistinguishable from the app's own Borders FX), which is not what was asked for —
   "border" meant panel separation (library <-> editor), not framing the canvas. Back to
   edge-to-edge, matching DRK; only the library/editor divider (library-ui.js) is thicker now. */
body.deskx .fx-canvas-wrap{overflow:clip;flex:1 1 auto;min-height:0;background:var(--bg);border:none;border-radius:0;margin:0;padding:16px;box-sizing:border-box}
body.deskx #fx-canvas{max-height:none}
body.deskx #fx-crop-tools{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:var(--z-float);
  background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 12px}
body.deskx .fx-preview-col{position:relative}
/* 2026-09-10: was force-shown under deskx ("display:inline-flex!important") — the wireframe's

body.deskx #db-lib-btn{display:none}
/* Skin/AI Select used to be individual buttons gated by a rule here; mskAddMenu() now checks
   body.deskx itself (see the Masks panel's own comment) so this rule has nothing left to gate. */

   separate buttons in the middle of the bar (three menus, 18 rows between them, some actions
   reachable from two). They're now one gear, docked at the FAR RIGHT after Export — matching the

   long flat scroll with every section's rows concatenated end to end. toolsBuild()/
   viewMenuBuild()/ovfBuild()/settingsSplitBuild()/settingsHistoryBuild() are STILL unchanged —

#fx-settings{display:none;position:relative}
body.deskx #fx-settings{display:inline-flex}
#fx-settings-menu{display:none;position:fixed;top:46px;right:12px;z-index:var(--z-menu);
  background:var(--glass-bg);
  border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--lift-2);overflow:hidden}

.theme-sw{position:relative;margin-left:auto;width:44px;height:22px;flex:none;border:1px solid var(--bdr);border-radius:11px;background:var(--sur2);display:flex;align-items:center;justify-content:space-between;padding:0 4px;box-sizing:border-box;color:var(--mut)}

body.sk2 .cs-ctx-it:hover>.cs-ctx-pop .cs-ctx-it::before{content:none}
body.sk2 .cs-ctx-it:hover>.cs-ctx-pop .cs-ctx-it:hover::before{content:''}
body.sk2 .cs-ctx-sep{background:var(--bdr)!important;margin:6px 0!important}
body.sk2 .cs-ctx-pop{margin-left:0!important;top:-7px!important}
/* ── Gallery (Library) — concept view: word-list sidebar with the square marker, big title with
   counts on the right, matted prints, square selection marker. Background-work progress lives in
   the bottom status bar (#lib-bottom), not the top bar: a top-bar indicator overcrowded it and its
   appear/disappear made the collision-driven top-bar fold flip between full and compact. */
body.sk2 #lib-overlay #lib-bottom{min-height:26px}
body.sk2 #lib-overlay #lib-grid-title{flex-direction:row!important;align-items:flex-end;justify-content:space-between;gap:24px;padding:28px 24px 22px;margin-bottom:24px}
body.sk2 #lib-overlay #lib-grid-title .lgt-l{display:flex;flex-direction:column;gap:6px;min-width:0}
body.sk2 #lib-overlay #lib-grid-title .lgt-h{font-size:64px;letter-spacing:-.045em;line-height:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.sk2 #lib-overlay .lgt-m{display:flex;align-items:baseline;gap:18px;font-size:13px;color:var(--k-color-muted);white-space:nowrap;padding-bottom:4px;font-variant-numeric:tabular-nums}
body.sk2 #lib-overlay .lgt-m>span{font-size:13px!important;color:var(--k-color-muted)!important}
body.sk2 #lib-overlay .lgt-m #lib-count{color:var(--k-color-ink)!important}
body.sk2 #lib-overlay #sk2-act{display:none;align-items:center;gap:8px;background:none;border:0;color:var(--k-color-muted);font:inherit;font-size:12px;cursor:pointer;padding:0 10px;height:28px;max-width:360px}
body.sk2 #lib-overlay #sk2-act.busy{display:inline-flex}
body.sk2 #lib-overlay .sk2-act-dot{width:8px;height:8px;background:var(--k-color-accent-a);flex:none;animation:sk2Pulse 1.4s ease-in-out infinite}
@keyframes sk2Pulse{50%{opacity:.25}}
body.sk2 #lib-overlay .sk2-act-body{display:none;align-items:center;gap:10px;overflow:visible;white-space:nowrap}
body.sk2 #lib-overlay #sk2-act.open .sk2-act-body,body.sk2 #lib-overlay #sk2-act:hover .sk2-act-body{display:inline-flex}
@media (prefers-reduced-motion:reduce){body.sk2 #lib-overlay .sk2-act-dot{animation:none}}
/* Sidebar */
body.sk2 #lib-overlay .lib-coll-heading{font-size:10px!important;font-weight:400!important;letter-spacing:.14em!important;color:var(--k-color-muted)!important;margin-top:22px}
body.sk2 #lib-overlay .lib-coll-sep{display:none}
body.sk2 #lib-overlay .lib-coll-row,body.sk2 #lib-overlay .lib-tree-row{position:relative;background:none!important;box-shadow:none!important;color:var(--k-color-muted);font-size:14px;border-radius:0!important}
body.sk2 #lib-overlay .lib-coll-row::before,body.sk2 #lib-overlay .lib-tree-row::before{content:none!important}
body.sk2 #lib-overlay .lib-coll-row:hover,body.sk2 #lib-overlay .lib-tree-row:hover,body.sk2 #lib-overlay .lib-coll-row.on,body.sk2 #lib-overlay .lib-tree-row.on{color:var(--k-color-ink)!important}
body.sk2 #lib-overlay .lib-coll-row.on::after,body.sk2 #lib-overlay .lib-tree-row.on::after{content:'';position:absolute;left:-2px;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--k-color-accent-a)}
body.sk2 #lib-overlay .lib-coll-row .lib-coll-ic{display:none}
body.sk2 #lib-overlay .lib-coll-row .lib-coll-lb{padding-left:12px}
body.sk2 #lib-overlay .lib-coll-count{font-size:11px;color:var(--k-color-muted);opacity:.7;font-variant-numeric:tabular-nums}
/* Prints: matted on a quiet surface; the selected one gets the square in its corner. */
body.sk2 #lib-overlay #lib-grid.lib-mat:not(.list-view):not(.aspect-view) .lib-thumb-wrap{background:color-mix(in srgb,var(--k-color-ink) 5%,var(--k-color-bg))!important}
body.sk2 #lib-overlay .lib-card:is(.sel,.multi){box-shadow:none!important;outline:0!important}
body.sk2 #lib-overlay .lib-card:is(.sel,.multi)::before,body.sk2 #lib-overlay .lib-card:is(.sel,.multi)::after{opacity:0!important}
body.sk2 #lib-overlay .lib-card:is(.sel,.multi) .lib-thumb-wrap::after{content:'';position:absolute;right:0;bottom:0;width:16px;height:16px;background:var(--k-color-accent-a);z-index:4}
body.sk2 #lib-overlay:not(.full) .lib-card:is(.sel,.multi) .lib-thumb-wrap::after{width:10px;height:10px}
body.sk2 #lib-overlay .lib-card:hover:not(.sel):not(.multi)::after{border-width:1px;opacity:.5}
/* Library buttons: sentence case, hairline underline instead of boxes. */
body.sk2 #lib-overlay .lib-btn{text-transform:none!important;letter-spacing:0!important;font-weight:400!important;border-color:transparent!important;box-shadow:none!important;background:transparent!important;border-radius:0!important;color:var(--k-color-ink)}
body.sk2 #lib-overlay .lib-btn:hover{color:var(--k-color-ink);box-shadow:inset 0 -1px 0 var(--k-color-ink)!important}
body.sk2 #lib-overlay .lib-btn.on,body.sk2 #lib-overlay .lib-btn[aria-pressed=true]{background:transparent!important;color:var(--k-color-ink)!important;box-shadow:inset 0 -2px 0 var(--k-color-ink)!important}
body.sk2 #ff-borders .sk2-layers{margin:2px 0 12px}
body.sk2 #ff-borders .fx-row[hidden]{display:none!important}
body.sk2 #ff-borders[data-sk2-layer=b1] [data-layer=b2],body.sk2 #ff-borders[data-sk2-layer=b2] [data-layer=b1]{display:none!important}
/* ── Swiss v2 refinement pass (20-point review, 2026-09-28) ─────────────────────────────── */
/* 1 · One type scale: display 64 / stage 46 / section 21 / body 13 / caption 11. */
body.sk2{--sk-t1:64px;--sk-t2:46px;--sk-t3:21px;--sk-t4:13px;--sk-t5:11px;--sk-g:8px}
body.sk2 .fx-label,body.sk2 .fx-val,body.sk2 .fx-sub,body.sk2 .btn,body.sk2 .fx-select,body.sk2 .vinput,body.sk2 .fx-preset-head{font-size:var(--sk-t4)!important}
body.sk2 .fx-sub{text-transform:none!important;letter-spacing:0!important;color:var(--k-color-muted)!important;font-weight:400!important;border:0!important;margin:calc(var(--sk-g)*3) 0 var(--sk-g)!important;padding:0!important}
body.sk2 .look-cat-hdr,body.sk2 .sk2x-cap,body.sk2 #lib-overlay .lib-coll-heading{font-size:var(--sk-t5)!important}
/* 2 · One left edge: panel content, sub-tabs, titles and rows all start at the same x; no inner card padding. */
body.sk2.deskx .fx-panel{padding-left:calc(var(--sk-g)*3)!important;padding-right:calc(var(--sk-g)*3)!important}
body.sk2 .fx-ctrl,body.sk2 .fx-fields{padding-left:0!important;padding-right:0!important;margin-left:0!important;margin-right:0!important}
body.sk2 .fx-ctrl-title{padding-left:0!important;padding-right:0!important}
/* CHR-193: per-section scope icon — only when several photos are open (body.cs-multi) */
.sec-scope{display:none;all:unset;cursor:pointer;margin-left:10px;width:22px;height:22px;align-items:center;justify-content:center;color:var(--k-color-muted);flex:0 0 auto}
body.cs-multi .sec-scope{display:inline-flex}
.sec-scope:hover{color:var(--k-color-ink)}
.sec-scope.one{color:var(--k-color-accent-a)}
.sec-scope[aria-disabled="true"]{cursor:default;opacity:.55}
.sec-scope:focus-visible{outline:2px solid var(--k-color-accent-a);outline-offset:2px}

body.cs-multi #adj-scope-row{display:none!important}
/* 3 · Numbers: tabular, one colour, one right edge. */
body.sk2 .fx-val,body.sk2 #lib-overlay .lib-coll-count,body.sk2 #lib-overlay .lgt-m,body.sk2 .sk2-bb-n{font-variant-numeric:tabular-nums;text-align:right}
body.sk2 .fx-val{min-width:3.2em}
/* 4 · Vermilion only for position, the main action and danger. */
body.sk2 .cs-tour-k{color:var(--k-color-muted)!important}
body.sk2 .cs-ctx-it[style*="--err"],body.sk2 .cs-ctx-it:last-child span:first-child{color:inherit}
/* 5 · Motion that means something. */
@keyframes sk2Slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
body.sk2 #sk2-stage-h.sk2-in{animation:sk2Slide .18s var(--k-motion-easing)}
body.sk2 #sk2-rail-mk{position:absolute;left:2px;top:0;width:8px;height:8px;background:var(--k-color-accent-a);transition:transform .18s var(--k-motion-easing),opacity .12s;pointer-events:none;z-index:3}
body.sk2 #fx-toolrail{position:relative}
body.sk2 #fx-toolrail.sk2-mk .fx-rail-btn.on::after{content:none!important}
@media (prefers-reduced-motion:reduce){body.sk2 #sk2-stage-h.sk2-in{animation:none}body.sk2 #sk2-rail-mk{transition:none}}
/* 6 · Pop-ups: flat panel, big title, numbered margin. */
body.sk2 .cs-modal{background:var(--k-color-bg)!important;border:1px solid var(--bdr)!important;border-radius:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:32px 32px 28px!important;box-shadow:0 24px 64px rgba(0,0,0,.35)!important}
body.sk2 .cs-modal h2{font-size:var(--sk-t2)!important;font-weight:400;letter-spacing:-.045em;line-height:.95}
/* The wordmark never breaks across lines; on a phone the title shrinks to fit instead. */
.cs-modal h2 .cs-nowrap{white-space:nowrap}
body.sk2.mobile-fx .cs-modal h2{font-size:min(var(--sk-t2),10.5vw)!important}
body.sk2 .cs-tour-step{position:relative;padding-left:48px;margin-bottom:22px!important}
body.sk2 .cs-tour-step::before{content:attr(data-n);position:absolute;left:0;top:-4px;font-size:30px;letter-spacing:-.04em;color:var(--k-color-muted);font-variant-numeric:tabular-nums}
body.sk2 .cs-tour-k{display:none}
body.sk2 .cs-tour-step>div:nth-child(2){font-size:15px!important;font-weight:500!important}
/* 8 · Gallery/studio slab no taller than the words. */
body.sk2 #cs-brand-tog{--k-two-tone-slab-a-top:4px;--k-two-tone-slab-a-bottom:0px;--k-two-tone-slab-b-top:9px;--k-two-tone-slab-b-bottom:3px}
/* 9 · Search: sentence case, underline only. */
body.sk2 #lib-overlay .lib-search-wrap{background:transparent!important;border:0!important;border-bottom:1px solid var(--bdr)!important;border-radius:0!important;box-shadow:none!important}
body.sk2 #lib-overlay .lib-search-wrap:focus-within{border-bottom-color:var(--k-color-ink)!important}
body.sk2 #lib-overlay #lib-search{text-transform:none!important;letter-spacing:0!important;font-size:var(--sk-t4)!important;background:transparent!important}
body.sk2 #lib-overlay #lib-search::placeholder{text-transform:none;letter-spacing:0;color:var(--k-color-muted)}
/* 10 · Title sits higher (no duplicate count above it). */
body.sk2 #lib-overlay #lib-grid-title{padding-top:20px!important;margin-bottom:16px!important}
body.sk2 #lib-overlay #lib-grid-title .lgt-k:empty{display:none}
/* 11 · Tile badges become a caption line under the print. */
body.sk2 #lib-overlay #lib-grid:not(.list-view) .lib-card{padding-bottom:22px}
body.sk2 #lib-overlay #lib-grid:not(.list-view) .lib-raw-badge,body.sk2 #lib-overlay #lib-grid:not(.list-view) .lib-video-badge{top:auto!important;bottom:-20px!important;left:0!important;background:none!important;color:var(--k-color-muted)!important;border:0!important;box-shadow:none!important;width:auto!important;height:auto!important;font-size:var(--sk-t5)!important;font-weight:400!important;padding:0!important;border-radius:0!important}
body.sk2 #lib-overlay #lib-grid:not(.list-view) .lib-raw-badge::after{content:'AW';letter-spacing:.02em}
body.sk2 #lib-overlay #lib-grid:not(.list-view) .lib-video-badge{left:auto!important;right:0!important}
/* 12 · Sidebar lists places; housekeeping collapses into "Manage". */
body.sk2 #lib-overlay .sk2-manage{display:none!important}
body.sk2 #lib-overlay .sk2-manage-open .sk2-manage{display:flex!important}
body.sk2 #lib-overlay .sk2-manage-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:6px 20px 6px 32px;box-sizing:border-box;font:inherit;font-size:var(--sk-t4);color:var(--k-color-muted);cursor:pointer}
body.sk2 #lib-overlay .sk2-manage-btn:hover{color:var(--k-color-ink)}
body.sk2 #lib-overlay .sk2-manage-btn::after{content:'+'}
body.sk2 #lib-overlay .sk2-manage-open .sk2-manage-btn::after{content:'–'}
/* Touch / Android WebView: a 20px backdrop blur behind a popover is a per-frame GPU cost for no visible gain (--glass-bg is
   already an opaque colour). Popovers keep a SOLID background; the blur is dropped. */
@media (hover:none),(pointer:coarse){
  .msk-more-menu,#fx-toast,[style*="var(--glass-bg"][style*="backdrop-filter"]{background:var(--glass-bg,var(--k-color-bg))!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
/* 13 · Selection bar: big count, three words, More. */
body.sk2 #lib-batchbar{background:var(--k-color-bg)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:1px solid var(--bdr)!important;border-radius:0!important;box-shadow:0 12px 32px rgba(0,0,0,.22)!important;gap:18px!important;padding:6px 18px 6px 14px!important}
body.sk2 .sk2-bb-n{font-size:30px;letter-spacing:-.04em;line-height:1;color:var(--k-color-ink)}
body.sk2 .sk2-bb-n small{font-size:var(--sk-t5);letter-spacing:0;color:var(--k-color-muted);margin-left:4px}
body.sk2 .sk2-bb-more{display:inline-flex;gap:18px}
body.sk2 .sk2-bb-more[hidden]{display:none}
/* 14 · Tiles still developing: paper tone with a hairline, not black. */
body.sk2 #lib-overlay .lib-thumb-wrap:not(:has(img.loaded)){background:color-mix(in srgb,var(--k-color-ink) 4%,var(--k-color-bg))!important;box-shadow:inset 0 0 0 1px var(--bdr)}
body.sk2 #lib-overlay .lib-thumb-wrap>img:not(.loaded){opacity:0}
/* 15 · In a stage with sub-tabs, the card title's words are the sub-tab's; the row keeps chevron, toggle, reset. */
body.sk2 .sk2-dup-title>.fx-ctrl-title>.sk2-long{display:none}
/* Small text actions ("Reset") keep their look but get a >=28px hit area. */
.fx-toggle-lb{position:relative}.fx-toggle-lb::before{content:'';position:absolute;inset:-9px -6px}
.fx-ctrl .fx-geom-reset{display:none}
.fx-ctrl.fx-geom-changed>.fx-ctrl-title .fx-geom-reset{display:inline}
body.sk2 #btn-crop{min-height:28px}
/* Sidebar counts are information, not decoration: one size (11px) and >=4.5:1 contrast. */
body.sk2 #lib-overlay :is(.lib-coll-count,.coll-count){font-size:11px!important;color:color-mix(in srgb,var(--k-color-ink) 72%,var(--k-color-bg))!important}
body.sk2 .sk2-dup-title>.fx-ctrl-title{min-height:36px;padding-top:6px!important;padding-bottom:6px!important}
body.sk2 .sk2-dup-title>.fx-ctrl-title::before{content:attr(data-sk2-name);font-size:17px;font-weight:500;letter-spacing:-.01em;color:var(--k-color-ink);order:1;margin-right:auto}
body.sk2 .sk2-dup-title>.fx-ctrl-title{min-height:48px!important}
/* Histogram reads as a tool header like its Light-stage siblings (chevron left, same size/ink). */
body.sk2 details#sk2-hist{border-top:0;margin:0 -8px;padding-top:0;box-shadow:0 1px 0 var(--bdr)} /* same inset as the .fx-ctrl-title rows below it */
body.sk2 details#sk2-hist>summary{justify-content:flex-start;gap:12px;font-size:17px;font-weight:500;letter-spacing:-.01em;color:var(--k-color-ink);min-height:48px;align-items:center}
body.sk2 details#sk2-hist>summary::before{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin:0 0 0 2px;transition:transform .15s}
body.sk2 details#sk2-hist[open]>summary::before{transform:rotate(45deg)}
body.sk2 details#sk2-hist>summary::after{content:none}
body.sk2 details.fx-info-part,body.sk2 details.sk2-more.fx-info-part{border-top:0;margin:0;padding-top:0;box-shadow:0 1px 0 var(--bdr)}
body.sk2 details.fx-info-part>summary{justify-content:flex-start!important;text-align:left;gap:12px;font-size:17px;font-weight:500;letter-spacing:-.01em;color:var(--k-color-ink);min-height:48px;align-items:center}
body.sk2 details.fx-info-part>summary::before{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin:0 0 0 2px;transition:transform .15s}
body.sk2 details.fx-info-part[open]>summary::before{transform:rotate(45deg)}
body.sk2 details.fx-info-part>summary::after,body.sk2 details.fx-info-part[open]>summary::after{content:none}
body.sk2 details.fx-info-part[open]{padding-bottom:12px}
/* Swiss v2 buttons are upright everywhere (the header's Export already was); only panel primaries were still italic. */
body.sk2 .bpri,body.sk2 #lib-overlay .lib-btn.on,body.sk2 #lib-overlay .lib-btn.lib-btn-export{font-style:normal}
body.sk2 .fx-info-part>summary{font-size:15px!important;color:var(--k-color-ink)!important;padding:6px 0}
body.sk2 .fx-info-part:first-of-type{margin-top:0;border-top:0}
body.sk2.deskx .fx-ctrl[data-fxsec=info]>.fx-ctrl-title{display:none} /* the stage header already says Info */
body.sk2 .sk2-dup-title>.fx-ctrl-title>*{font-size:var(--sk-t4)}
body.sk2 .sk2-dup-title>.fx-ctrl-title>.fx-ctrl-chev{order:0}
body.sk2 .sk2-dup-title>.fx-ctrl-title>:not(.fx-ctrl-chev){order:2}
/* 16 · Titles left, Reset beside them; ratios on a two-column grid. */
body.sk2 .fx-ctrl-title{justify-content:flex-start!important;text-align:left!important}
body.sk2 .fx-ctrl-title>.fx-title-right,body.sk2 .fx-ctrl-title>.fx-toggle{margin-left:auto}
body.sk2 .fx-ctrl:not(.fx-sec-collapsed)>#crop-ar-chips{display:grid!important;grid-template-columns:1fr 1fr;gap:2px 16px!important}
body.sk2 #crop-ar-chips>.btn{text-align:left;justify-self:start}
/* 17 · Mixer bands as filled squares, the chosen one marked underneath. */
body.sk2 .hsl-chip{background:var(--band-col)!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important;height:22px!important;position:relative;opacity:.55}
body.sk2 .hsl-chip.on,body.sk2 .hsl-chip.edited{opacity:1}
body.sk2 .hsl-chip.on::after{content:'';position:absolute;left:50%;bottom:-10px;width:6px;height:6px;margin-left:-3px;background:var(--k-color-ink)}
body.sk2 #hsl-chips{margin-bottom:14px!important}
/* 18 · Wheels as large as the panel allows, one amount slider under each. */
body.sk2 #ff-wheels canvas[id^=cv-wheel-]{max-width:none!important}
/* 19 · Last boxed controls: word buttons with a hairline; Crop is the one filled action in its card. */
body.sk2 .btn.bsec,body.sk2 #btn-ah-roi,body.sk2 .fx-hint-x>summary{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:inset 0 -1px 0 var(--bdr)!important;color:var(--k-color-ink)!important;text-transform:none!important;letter-spacing:0!important}
body.sk2 .fx-hint-x{border:0!important;background:none!important}
body.sk2 .fx-select{background-color:transparent!important;border:0!important;border-bottom:1px solid var(--bdr)!important;border-radius:0!important;box-shadow:none!important}
body.sk2 .fx-select:focus{border-bottom-color:var(--k-color-ink)!important;outline:none}
body.sk2 #btn-crop{background:var(--k-color-accent-a)!important;color:#fff!important;box-shadow:none!important;padding:0 18px!important}
/* 20 · Filmstrip: smaller, quiet, the open photo marked, count at the foot. */
body.sk2.deskx #lib-overlay:not(.full) .lib-card{opacity:.45;transition:opacity .12s}
body.sk2.deskx #lib-overlay:not(.full) .lib-card:hover,body.sk2.deskx #lib-overlay:not(.full) .lib-card:is(.sel,.multi,.cur,.current,.editing){opacity:1}
body.sk2.deskx #lib-overlay:not(.full) .lib-strip-info,body.sk2.deskx #lib-overlay:not(.full) .lib-name{display:none!important}
body.sk2.deskx #lib-overlay:not(.full) .lib-raw-badge:not(.lib-stack-badge){display:none!important}
/* CHR-137: the stack badge is the only way to expand a stack in the docked filmstrip, so it stays (compact, top-right). */
body.sk2.deskx #lib-overlay:not(.full) .lib-stack-badge{top:2px;right:2px;bottom:auto;left:auto;font-size:10px;line-height:14px;height:14px;min-width:14px;padding:0 3px}
/* Looks: the chosen look is marked by the square, not a kicked-out frame. */
body.sk2 .look-cell:hover{transform:none;box-shadow:none}
body.sk2 .look-cell.sel{border-color:transparent;box-shadow:none;position:relative}
body.sk2 .look-cell.sel::after{content:'';position:absolute;right:0;top:0;width:14px;height:14px;background:var(--k-color-accent-a);z-index:3}
body.sk2 #fx-add-btn{box-shadow:none}
body.sk2 #fx-add-btn:hover{transform:none;box-shadow:none}
body.sk2 #fx-toast{box-shadow:none}
@keyframes sk2In{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
body.sk2 .fx-ctrl{animation:sk2In .14s ease-out}
body.sk2.fx-deskb .looks-grid{max-height:none;gap:20px 12px}
body.sk2 .look-cell{border:0;padding:0}
body.sk2 .look-nm{font-size:12px;text-transform:none;letter-spacing:0;padding:6px 0 0;background:none!important;color:var(--k-color-muted)}
body.sk2 .look-cell.sel .look-nm{color:var(--k-color-ink)}
body.sk2 .look-cell.sk2-peek{outline:1px solid var(--k-color-ink);outline-offset:2px}
body.sk2.mobile-fx .look-cell.sk2-peek{outline:none}
/* Secondary actions folded into one quiet "More" line. */
body.sk2 details.sk2-more{margin-top:12px;border-top:1px solid var(--bdr);padding-top:8px}
body.sk2 details.sk2-more>summary{cursor:pointer;color:var(--k-color-muted);font-size:12px;list-style:none;display:flex;justify-content:space-between}

/* ── Swiss v2 review pass 2 (desktop review, 2026-09-28) ─────────────────────────────────── */
/* Filmstrip: its own opaque column with a hairline edge; greyscale until the pointer is anywhere

body.sk2.deskx #lib-overlay:not(.full):hover .lib-card img{filter:none!important}
/* Gallery title: room for descenders (y, g, p) — it clipped at line-height .88 + overflow:hidden. */

/* Tile caption: "RAW" for a raw file, "+n" for a stack — never run together as "+1AW". */

/* Selected date/tree row: the base rule forces its spans to the (white) selection foreground, but Swiss v2 marks selection with the accent square, not a fill — keep the text ink. */
body.sk2 #lib-overlay .lib-tree-row.on,body.sk2 #lib-overlay .lib-tree-row.on .coll-count,body.sk2 #lib-overlay .lib-tree-row.on .dayname,body.sk2 #lib-overlay .lib-tree-row.on span{color:var(--k-color-ink)!important;background-color:transparent}
body.sk2 #lib-overlay .lib-tree-row.on .coll-count{color:var(--k-color-muted)!important}

/* Selected print: hairline vermilion outline as well as the corner square. */
body.sk2 #lib-overlay .lib-card:is(.sel,.multi) .lib-thumb-wrap{outline:2px solid var(--k-color-accent-a);outline-offset:2px}

/* Selection bar docked as a flat strip along the bottom of the grid. */
body.sk2 #lib-batchbar{box-shadow:none!important;border-width:1px 0 0!important}
/* Tool rail: icon + word centred in the rail, the group centred in the window height. */
body.sk2.deskx #fx-toolrail{justify-content:center!important;align-items:center!important;padding-top:0!important}
body.sk2.deskx #fx-toolrail .fx-rail-btn{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:0!important}
body.sk2.deskx #fx-toolrail .fx-rail-lb{text-align:center}

body.sk2.deskx #fx-toolrail .fx-rail-btn{padding:8px 3px!important}
body.sk2 #fx-toolrail .fx-rail-btn::before,body.sk2 #fx-toolrail .fx-rail-btn.enabled::before{display:block!important;background:color-mix(in srgb,var(--k-color-ink) 12%,transparent)!important;border:0!important;outline:0!important;left:12px!important;right:-4px!important;top:2px!important;bottom:2px!important;clip-path:inset(0 0 0 100%);transition:clip-path .28s cubic-bezier(.2,.7,.2,1)}
/* Edited tools: the icon turns accent (no grey plate). */
body.sk2 #fx-toolrail .fx-rail-btn.edited .fx-rail-ic,body.sk2 #fx-toolrail .fx-rail-btn.edited .fx-rail-ic svg{color:var(--k-color-accent-a)}

body.sk2:not(.panel-closed) #fx-toolrail .fx-rail-btn.on .fx-rail-lb::after,body.sk2:not(.panel-closed) #fx-toolrail .fx-rail-btn.on .fx-rail-lb[data-ab]::after{transform:scaleX(1)}

body.sk2 .fx-row .fx-label{color:var(--k-color-ink)}

body.sk2 .fx-ctrl-title{font-weight:500}
body.sk2 .fx-slider::-webkit-slider-runnable-track{background:linear-gradient(to right,color-mix(in srgb,var(--k-color-ink) 22%,transparent) 0 var(--fillA,0%),var(--k-color-accent-a) var(--fillA,0%) var(--fillB,0%),color-mix(in srgb,var(--k-color-ink) 22%,transparent) var(--fillB,0%) 100%)!important}
