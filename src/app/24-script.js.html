<script>
/* CHR-189: favourite + recent looks on desktop. Same storage keys as the mobile long-press
   block below (csFavLooks / csRecentLooks), so both share one list. Wraps csLookSpecials
   rather than editing the mobile block, which only offers the chips on phones. */
(function(){
  var mob=function(){return document.body.classList.contains('mobile-fx');};
  var LS=function(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(e){return d;}};
  var SV=function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  var key=function(val){return String(val||'').replace(/^p:/,'');};
  function specials(){var o=[];if(LS('csRecentLooks',[]).length)o.push('Recent');if(LS('csFavLooks',[]).length)o.push('Favourites');return o;}
  document.addEventListener('DOMContentLoaded',function(){
    var base=window.csLookSpecials;
    window.csLookSpecials=function(){return mob()&&base?base():specials();};
  });
  window.csToggleFav=function(cell,val){
    var k=key(val),f=LS('csFavLooks',[]),i=f.indexOf(k);if(i>=0)f.splice(i,1);else f.unshift(k);SV('csFavLooks',f);
    cell.classList.toggle('fav',i<0);
    if(typeof toast==='function')toast(i<0?'Added to favourites':'Removed from favourites');
    if(typeof buildLookCatChips==='function')buildLookCatChips();
    if(typeof fxLookCatFilter!=='undefined'&&fxLookCatFilter==='Favourites'&&typeof buildLookGallery==='function')buildLookGallery();
  };
  document.addEventListener('click',function(e){
    if(mob())return;var t=e.target;if(!t.closest||t.closest('.look-fav'))return;
    var cell=t.closest('.look-cell');if(!cell||!cell._lookJob||!cell._lookJob.val)return;
    var k=key(cell._lookJob.val),r=LS('csRecentLooks',[]).filter(function(x){return x!==k;});r.unshift(k);SV('csRecentLooks',r.slice(0,8));
    setTimeout(function(){if(typeof buildLookCatChips==='function')buildLookCatChips();},400);
  },true);
})();
</script>
