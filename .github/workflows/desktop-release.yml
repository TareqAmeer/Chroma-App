# Build the desktop app for macOS (.dmg) and Windows (.exe installer) and publish both as
# downloadable assets on the same GitHub Release.
#
# Before this existed the only way to get the desktop app was to clone the repo, install Rust and
# Node, fetch ~200MB of models by hand and run desktop/install-app.sh — so in practice nobody but
# the author had it. Tag a version (`git tag v1.0.1 && git push --tags`) or run the workflow by
# hand, and both installers appear under Releases.
#
# Renamed from desktop-dmg.yml (docs/windows-port.md Phase 5) when the windows-latest job below
# was added; kept as two OS-specific jobs rather than one `strategy: matrix` block because the
# packaging step (hdiutil .dmg vs locating the NSIS .exe) and bundle target differ enough that a
# shared step list would need almost as much per-OS branching as just writing two jobs.
name: Build desktop apps (dmg + Windows installer)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    # ⚠️ macos-13 is deliberate: it is the x86_64 runner. desktop/src-tauri/vendor/onnxruntime
    # holds an Intel-only libonnxruntime.dylib, pinned at v1.20.0 because Microsoft dropped Intel
    # Mac prebuilts after it (see that directory's README). Building on an arm64 runner would
    # produce an app whose Rust binary cannot load its own inference library. Apple Silicon users
    # run this under Rosetta, which is what the download page tells them.
    #
    # ⚠️ The .dmg is packaged here with hdiutil rather than by adding "dmg" to
    # tauri.macos.conf.json's bundle.targets. That setting is ["app"] on purpose —
    # desktop/install-app.sh records that stray DMG bundle registrations broke the Adobe OAuth
    # callback locally. Leave it alone.
    #
    # ⚠️ The app is UNSIGNED (no paid Apple developer certificate). The release notes tell users
    # to right-click → Open. Do not "fix" this by stripping the quarantine attribute in CI;
    # quarantine is applied by the downloading browser on the user's machine, not here.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # the CLIP/ArcFace/SCRFD/EdgeSAM/face-parse weights live in Git LFS
      - run: git lfs checkout

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # The two model sets that are NOT in git (too large even for the LFS budget to be worth it).
      # scripts/fetch-models.mjs is the one script both OS jobs call (docs/windows-port.md ground
      # rule 4) — skips the win-x64 ONNX Runtime DLL automatically on macOS.
      - name: Cache fetched models
        id: models
        uses: actions/cache@v4
        with:
          key: models-sam2-2.1-tiny-rawnind-5.6.0
          path: |
            desktop/src-tauri/vendor/sam2/encoder.onnx
            desktop/src-tauri/vendor/sam2/decoder.onnx
            desktop/src-tauri/vendor/rawdenoise/model_linear.onnx
            desktop/src-tauri/vendor/rawdenoise/model_bayer.onnx

      - name: Fetch models
        run: node scripts/fetch-models.mjs

      # Must run before the resource-verify step below: tauri.conf.json's bundle.resources
      # includes "../dist" (desktop/dist), which doesn't exist until this staging step creates
      # it. This ordering bug was actually latent in the original desktop-dmg.yml too (the old
      # "Stage the web app into desktop/dist" step ran via bash build-desktop.sh, but the verify
      # step still ran before it) — it just never surfaced because that job had never had a
      # confirmed real run. Caught live by this job's first actual CI run.
      - name: Stage the web app into desktop/dist
        run: node scripts/build-desktop.mjs

      - name: Verify every bundled resource is present
        # tauri.conf.json's bundle.resources lists these by path; a missing one fails the bundle
        # late and confusingly, so check first and name the file that is absent.
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          python3 - <<'PY'
          import json, os, sys
          cfg = json.load(open('tauri.conf.json'))
          missing = [p for p in cfg['bundle']['resources'] if not os.path.exists(p)]
          if missing:
              sys.exit('missing bundle resources:\n  ' + '\n  '.join(missing))
          print('all bundle resources present')
          PY

      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Package the .dmg
        id: pack
        run: |
          set -euo pipefail
          APP=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }
          VERSION=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          NAME="Chromasmith-${VERSION}-macos-x86_64.dmg"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Chromasmith" -srcfolder "$STAGE" -ov -format UDZO "$NAME"
          echo "dmg=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Chromasmith-dmg
          path: ${{ steps.pack.outputs.dmg }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.dmg }}
          body: |
            ## Chromasmith ${{ steps.pack.outputs.version }}

            ### macOS

            1. Download the `.dmg` below and open it.
            2. Drag **Chromasmith** into your Applications folder.
            3. **Right-click the app and choose Open**, then Open again.

            macOS asks that once because the app is not signed with a paid Apple developer
            certificate. After the first launch it opens normally.

            **Intel build.** On an Apple Silicon Mac it runs under Rosetta 2 — macOS offers to
            install that automatically the first time. This is because the bundled ONNX Runtime
            has no Apple Silicon build at the pinned version.

            ### Windows

            1. Download the `.exe` installer below and run it.
            2. Windows SmartScreen will warn the app is from an "unknown publisher" — click
               **More info**, then **Run anyway**. This is because the installer is not
               code-signed (no paid certificate). It's the same trust gap as macOS's Gatekeeper
               warning above, just a different OS's version of "the author isn't a company
               Microsoft/Apple has vetted."
            3. The installer registers Chromasmith as a handler for TIFF/JPEG/PNG/RW2 files and
               for Adobe's OAuth sign-in redirect, so double-clicking a photo or signing in to
               Adobe from within the app both work immediately.

            Bundled on-device AI models keep their own licences, two of which are
            non-commercial/research — see
            [LICENSES-MODELS.md](https://github.com/TareqAmeer/Chroma-App/blob/main/LICENSES-MODELS.md).

  nsis:
    # windows-latest ships WebView2 preinstalled, which is what the Tauri window renders with —
    # no separate runtime download needed for the build itself (only for end users without it,
    # which the NSIS `webviewInstallMode: downloadBootstrapper` setting in tauri.windows.conf.json
    # already covers).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git lfs checkout

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Same script as the macOS job (docs/windows-port.md ground rule 4); on Windows it also
      # fetches the win-x64 ONNX Runtime DLL (gitignored — see vendor/onnxruntime/win-x64/README.md
      # for why that one isn't pinned like the macOS dylib).
      - name: Cache fetched models
        id: models
        uses: actions/cache@v4
        with:
          key: models-sam2-2.1-tiny-rawnind-5.6.0-ort-win-x64
          path: |
            desktop/src-tauri/vendor/sam2/encoder.onnx
            desktop/src-tauri/vendor/sam2/decoder.onnx
            desktop/src-tauri/vendor/rawdenoise/model_linear.onnx
            desktop/src-tauri/vendor/rawdenoise/model_bayer.onnx
            desktop/src-tauri/vendor/onnxruntime/win-x64/onnxruntime.dll

      - name: Fetch models
        run: node scripts/fetch-models.mjs
        shell: bash

      # Same ordering requirement as the dmg job above: "../dist" doesn't exist until this runs.
      - name: Stage the web app into desktop/dist
        run: node scripts/build-desktop.mjs
        shell: bash

      - name: Verify every bundled resource is present
        # tauri.conf.json's resources plus tauri.windows.conf.json's own (the onnxruntime.dll
        # resource, added only on this platform) — Tauri merges both at build time, so this
        # mirrors that merge instead of only checking the shared file like the macOS job does.
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          python3 - <<'PY'
          import json, os, sys
          base = json.load(open('tauri.conf.json'))['bundle']['resources']
          win = json.load(open('tauri.windows.conf.json'))['bundle']['resources']
          missing = [p for p in {**base, **win} if not os.path.exists(p)]
          if missing:
              sys.exit('missing bundle resources:\n  ' + '\n  '.join(missing))
          print('all bundle resources present')
          PY

      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Package the installer
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find desktop/src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' | head -1)
          [ -n "$EXE" ] || { echo "no NSIS installer was produced"; exit 1; }
          VERSION=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          NAME="Chromasmith-${VERSION}-windows-x64-setup.exe"
          cp "$EXE" "$NAME"
          echo "exe=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: Chromasmith-windows-setup
          path: ${{ steps.pack.outputs.exe }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.exe }}
