name: Mobile UX and data-safety gate
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mobile/**'
      - 'chromasmith-22.html'
      - 'vendor/fflate/**'
      - 'test/mobile_ux.mjs'
      - 'test/mobile_edge_cases.mjs'
      - 'package*.json'
      - '.github/workflows/mobile-ux.yml'
  pull_request:
    paths: ['mobile/**', 'chromasmith-22.html', 'test/mobile_ux.mjs', 'test/mobile_edge_cases.mjs', 'package*.json']
permissions:
  contents: read
jobs:
  mobile-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run mobile:test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ux-screenshots
          path: test/output/mobile
